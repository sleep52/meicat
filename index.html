<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<title>我家猫 · 真猫互动站</title>
<meta name="description" content="用一只真实存在猫的照片做出来的互动网页：换装、表情包、小游戏、相册。">
<link rel="stylesheet" href="css/app.css?v=100">
<script src="js/icons.js?v=100" defer></script>
<script src="js/core.js?v=100" defer></script>
<script src="js/cat.js?v=100" defer></script>
<script src="js/wardrobe.js?v=100" defer></script>
<script src="js/game.js?v=100" defer></script>
<script src="js/games.js?v=100" defer></script>
<script src="js/content.js?v=100" defer></script>
</head>
<body data-page="home">
<div class="app">

  <section class="hero">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="hc">
      <h1 id="greet">我家猫</h1>
      <p class="sub" id="line">正在加载真猫…</p>
    </div>
    <span class="tap-hint">点猫身上不同地方试试</span>
  </section>

  <div class="pill-row" id="pills"></div>

  <div class="sect"><h2>今天要做的事</h2><span class="mut small" id="dayTag"></span></div>
  <div class="card" id="tasks"></div>

  <div class="sect"><h2>做点东西</h2></div>
  <div class="grid2">
    <a class="tile tap" href="dressup.html"><img class="ph" alt="换装室封面">
      <div class="tb"><b>真猫换装室</b><span>6 件真图衣裳，可导出</span></div></a>
    <a class="tile tap" href="meme.html"><img class="ph" alt="表情包制造机封面">
      <div class="tb"><b>表情包制造机</b><span>真照片 + 文案 + 贴纸</span></div></a>
    <a class="tile tap" href="pet.html"><img class="ph" alt="我家猫封面">
      <div class="tb"><b>我家猫</b><span>分区能摸，会呼吸</span></div></a>
    <a class="tile tap" href="gallery.html"><img class="ph" alt="相册封面">
      <div class="tb"><b>生活相册</b><span>21 张原片，能写备注</span></div></a>
  </div>

  <div class="sect"><h2>玩游戏</h2><a href="games.html">全部 ›</a></div>
  <div class="grid2" id="recGames"></div>

  <div class="sect"><h2>最近的原片</h2><a href="gallery.html">相册 ›</a></div>
  <div class="pgrid" id="recPhotos"></div>

  <p class="gnote" style="margin-top:18px">站里的猫全部来自同一只真猫：<span id="srcNote">assets/rabbitcat.jpg</span> 的实拍抠图，
    没有一张是画出来的。</p>
</div>

<script src="js/p/index.js?v=100" defer></script>
</body>
</html>
