<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>喵星人打工人 · 表情包小游戏合集</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .hero { text-align: center; margin: 18px 0 26px; }
  .hero img {
    width: clamp(130px, 32vw, 190px);
    border-radius: 50%;
    border: 4px solid var(--accent);
    box-shadow: 0 10px 30px #00000088;
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
  .hero h1 { margin: 14px 0 6px; font-size: clamp(24px, 6.5vw, 34px); }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .cards {
    width: 100%;
    max-width: 720px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
  }
  .game-card {
    background: var(--card);
    border: 1px solid #ffffff18;
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.12s, border-color 0.12s;
  }
  .game-card:active { transform: scale(0.97); }
  .game-card:hover { border-color: var(--accent); }
  .game-card .thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 12px;
    background: #00000040;
  }
  .game-card h2 { margin: 0; font-size: 18px; }
  .game-card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; flex: 1; }
  .game-card .go {
    align-self: flex-start;
    font-size: 14px;
    font-weight: 700;
    color: #2a1c00;
    background: var(--accent);
    border-radius: 10px;
    padding: 7px 16px;
  }
  .tag { position: absolute; top: -8px; right: 10px; font-size: 11px; background: var(--accent2);
         color: #fff; padding: 3px 8px; border-radius: 8px; font-weight: 700; }
  .game-card { position: relative; }
</style>
</head>
<body>
  <div class="hero">
    <img src="assets/worker_s.jpg" alt="打工猫">
    <h1>喵星人打工人</h1>
    <p>一只金渐层的 21 种活法 · 三个小游戏 · 手机电脑都能玩</p>
  </div>

  <div class="cards">
    <a class="game-card" href="whack.html">
      <span class="tag">反应</span>
      <img class="thumb" src="assets/eleme_s.jpg" alt="敲地鼠">
      <h2>别摸鱼了，打工猫！</h2>
      <p>变装猫从洞里冒头，手快点它得分。连击越高倍率越大，饿了么头盔猫会触发金色狂热！</p>
      <span class="go">开玩 →</span>
    </a>
    <a class="game-card" href="flappy.html">
      <span class="tag">手感</span>
      <img class="thumb" src="assets/hashbrown_s.jpg" alt="脆薯饼猫">
      <h2>脆薯饼猫大冒险</h2>
      <p>装在麦当劳脆薯饼袋里的猫，点击屏幕飞起来，穿过黄椒与哈密瓜的缝隙，游得越远越难。</p>
      <span class="go">开玩 →</span>
    </a>
    <a class="game-card" href="memory.html">
      <span class="tag">休闲</span>
      <img class="thumb" src="assets/lipstick_s.jpg" alt="记忆翻牌">
      <h2>变装连连看</h2>
      <p>10 对名场面表情牌扣着洗乱，翻出相同的两张即消除。用最少的步数找回全部喵星人。</p>
      <span class="go">开玩 →</span>
    </a>
  </div>

  <footer class="credit">本页面为个人娱乐用的表情包整活合集，图里的猫不属于任何公司，也不代表麦当劳与饿了么。</footer>
</body>
</html>
