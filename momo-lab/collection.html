<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>收藏 — MOMO LAB</title>
<meta name="description" content="你在 MOMO LAB 做出来的作品与成绩，全部存在这台设备上。">
<link rel="stylesheet" href="css/base.css?v=4">
<link rel="stylesheet" href="css/app.css?v=4">
</head>
<body data-page="collection" data-base="./" data-app="1">

<main class="app">
  <header class="app-head">
    <div class="brand">
      <span class="bm">收藏</span>
      <span class="bt" id="tally">读取中…</span>
    </div>
    <a class="icon-btn" href="games.html" aria-label="去做一个" title="去做一个"><span data-icon="paw" style="display:grid"></span></a>
  </header>

  <section class="blk" style="margin-top:0">
    <div class="blk-head">
      <h3>我的作品</h3>
      <button class="more" id="clearAll" style="background:none;border:none;cursor:pointer">清空</button>
    </div>
    <div class="wgrid" id="works"></div>
    <div class="empty" id="empty" hidden>
      <span data-icon="bubble" style="display:grid"></span>
      <p>还没有存进来的作品。<br>做完一张图，点「存进收藏」就会出现在这里。</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <a class="btn small yel" href="game/dressup.html">换装室</a>
        <a class="btn small mint" href="game/meme-maker.html">表情包制造机</a>
      </div>
    </div>
  </section>

  <section class="blk">
    <div class="blk-head"><h3>成绩</h3><span class="pill-pts">累计 <b id="allPts">0</b> 分</span></div>
    <div id="scores"></div>
  </section>
</main>

<div class="ml-modal" id="modal" hidden>
  <div class="ml-modal-in">
    <img id="mImg" alt="作品预览">
    <p id="mTitle"></p>
    <div style="display:flex;gap:8px">
      <a class="btn small yel" id="mDl" download="momo-lab.png">下载</a>
      <button class="btn small" id="mClose">关闭</button>
    </div>
  </div>
</div>

<script src="js/icons.js?v=4"></script>
<script src="js/registry.js?v=4"></script>
<script src="js/core.js?v=4"></script>
<script>
(function () {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function render() {
    const list = ML.works();
    ML.$("#works").innerHTML = list.map(w => `<div class="wcard">
      ${w.png ? `<img src="${w.png}" alt="${esc(w.title)}">` : `<div class="wnoimg">${esc(w.title)}</div>`}
      <div class="wb"><b>${esc(w.title)}</b><span>${esc(w.gameName || w.game || "")} · ${esc(w.time || "")}${w.score ? " · " + w.score + " 分" : ""}</span></div>
      <div class="wa">
        ${w.png ? `<button data-view="${esc(w.id)}">查看</button><a download="${esc(w.id)}.png" href="${w.png}">下载</a>` : ""}
        <button data-del="${esc(w.id)}">删除</button>
      </div></div>`).join("");
    ML.$("#empty").hidden = list.length > 0;
    ML.$("#tally").textContent = `${list.length} 件作品 · 只存在这台设备`;

    ML.$$("#works [data-view]").forEach(btn => btn.onclick = () => {
      const w = ML.works().find(x => x.id === btn.dataset.view);
      if (!w || !w.png) return;
      ML.$("#mImg").src = w.png;
      ML.$("#mTitle").textContent = `${w.title}（${w.gameName || w.game || ""}）`;
      ML.$("#mDl").href = w.png; ML.$("#mDl").download = w.id + ".png";
      ML.$("#modal").hidden = false; ML.sound.tap();
    });
    ML.$$("#works [data-del]").forEach(btn => btn.onclick = () => {
      ML.dropWork(btn.dataset.del); ML.sound.bad(); render();
    });
  }

  function renderScores() {
    const rows = ML_GAMES.filter(g => g.rec).map(g => {
      const b = ML.best(g.rec), n = ML.plays(g.rec);
      return `<div class="srow"><span><b>${g.n}</b><span>${n ? `玩过 ${n} 局` : "还没玩过"}</span></span>
        <span class="pill-pts" style="${b ? "" : "background:var(--bg);box-shadow:none;border-color:rgba(34,34,34,.3);color:var(--mut)"}">${b || "—"}</span></div>`;
    }).join("");
    ML.$("#scores").innerHTML = rows + `<div class="srow"><span><b>互动次数</b><span>撸猫与游戏内交互的总和</span></span>
      <span class="pill-pts">${ML.stats().interactions}</span></div>`;
    ML.$("#allPts").textContent = ML.stats().points;
  }

  ML.$("#mClose").onclick = () => { ML.$("#modal").hidden = true; };
  ML.$("#modal").onclick = e => { if (e.target.id === "modal") ML.$("#modal").hidden = true; };
  document.addEventListener("keydown", e => { if (e.key === "Escape") ML.$("#modal").hidden = true; });
  ML.$("#clearAll").onclick = () => {
    if (!ML.works().length) return;
    if (!confirm("清空这台设备上的全部收藏作品？分数不会被删除。")) return;
    try { localStorage.setItem("ml-works", "[]"); } catch (e) {}
    ML.sound.bad(); render();
  };

  render(); renderScores();
})();
</script>
</body>
</html>
