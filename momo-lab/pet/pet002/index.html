<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOMO — PET PAGE — MOMO LAB</title>
<link rel="stylesheet" href="../../css/base.css">
</head>
<body data-page="" data-base="../../" data-pet="pet002">

<section class="wrap pet-hero">
  <div class="pet-avatar wm"><img id="pAvatar" src="../../assets/pets/pet002/avatar.jpg" alt=""></div>
  <div>
    <span class="label">CLIENT PET PAGE · <span id="pId">pet001</span></span>
    <h1 class="h-display" style="font-size:clamp(34px,5vw,56px)" id="pName">MOMO</h1>
    <p class="mut" style="margin-top:10px" id="pDesc">职业拆家，业余装睡。</p>
    <div style="display:flex;gap:8px;margin-top:14px"><span class="tag yel" id="pType">CAT</span><span class="tag mint">专属互动页</span></div>
  </div>
</section>

<section class="wrap" style="padding-bottom:48px">
  <div class="sec-head"><div class="left"><span class="sec-no">▶</span><h2 class="h2" style="font-size:24px">专属游戏</h2></div></div>
  <div class="grid-3" id="pGames"></div>
  <p class="mut" style="font-size:12px;margin-top:20px">本页面仅展示该客户配置（data/pets/<span id="pId2">pet001</span>.json），不包含其他客户信息。</p>
</section>

<script src="../../js/icons.js"></script>
<script src="../../js/core.js"></script>
<script>
ML.pet().then(cfg => {
  document.getElementById("pName").textContent = cfg.petName;
  document.getElementById("pDesc").textContent = cfg.petDescription;
  document.getElementById("pAvatar").src = cfg.petAvatar;
  document.getElementById("pType").textContent = (cfg.petType || "cat").toUpperCase();
  document.getElementById("pId").textContent = cfg.petId;
  document.getElementById("pId2").textContent = cfg.petId;
  document.title = cfg.petName + " — PET PAGE — MOMO LAB";
  const G = [
    ["escape", "THE ESCAPE", "紧急撤离 · 45s", "game/escape.html"],
    ["chaos", "CHAOS MODE", "混乱现场 · 30s", "game/chaos.html"],
    ["memeMaker", "MEME MAKER", "表情制造机", "game/meme-maker.html"],
    ["boss", "WHO'S THE BOSS", "家庭地位争夺战", "game/boss.html"],
    ["snackPanic", "SNACK PANIC", "零食危机 · 45s", "game/snack-panic.html"],
  ];
  const box = document.getElementById("pGames");
  G.filter(g => cfg.gameSettings[g[0]]).forEach(g => {
    const a = document.createElement("a");
    a.className = "card svc-card"; a.href = "../../" + g[3] + "?pet=" + cfg.petId;
    a.innerHTML = `<h3 class="h3">${g[1]}</h3><p class="mut" style="font-size:13px;margin:8px 0 14px">${g[2]}</p><span class="btn small yel">START</span>`;
    box.appendChild(a);
  });
});
</script>
</body>
</html>
