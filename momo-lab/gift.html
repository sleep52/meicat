<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>电子礼物 — MOMO 事务所</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body data-page="" data-base="./">

<section class="wrap page-head">
  <span class="label">MOMO 事务所 / 电子礼物</span>
  <h1 class="h-display" style="font-size:clamp(34px,5vw,60px)">数字礼物</h1>
  <p class="mut" style="margin-top:14px;max-width:52ch">数字纪念礼物：一个链接，就是一份可以打开的喜欢。</p>
</section>

<section class="wrap gift-hero" style="padding-bottom:48px">
  <div>
    <h2 class="h2">送一份会动的纪念。</h2>
    <p class="mut" style="margin:14px 0 22px;font-size:14px">生日、领养纪念日、或者只是今天很可爱。把宠物照片做成纪念网页、成长时间线或表情包礼包，对方打开链接就能玩。</p>
    <div class="grid-3" style="grid-template-columns:1fr;gap:12px">
      <a class="card price-row" href="pet/pet001/index.html"><span style="font-weight:800">生日纪念网页</span><span class="link-arrow">查看演示</span></a>
      <a class="card price-row" href="custom.html"><span style="font-weight:800">成长纪念册</span><span class="link-arrow">看看作品</span></a>
      <a class="card price-row" href="game/meme-maker.html"><span style="font-weight:800">专属表情包礼包</span><span class="link-arrow">打开制造机</span></a>
    </div>
  </div>
  <div class="gift-frame wm"><img src="assets/custom/case-sofa.png" alt=""></div>
</section>

<section class="sec wrap" style="padding-top:0">
  <div class="sec-head"><div class="left"><span class="sec-no">♥</span><h2 class="h2">试一试：纪念卡生成器</h2></div></div>
  <div class="card" style="padding:26px">
    <p class="mut" style="font-size:13px;margin-bottom:14px">输入名字和一句祝福，立刻生成一张可下载的 MOMO 事务所纪念卡（浏览器直接导出）。</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input class="ed-input" id="gName" value="MOMO" style="max-width:160px" aria-label="宠物名字">
      <input class="ed-input" id="gMsg" value="生日快乐，永远可爱。" style="flex:1;min-width:200px" maxlength="20" aria-label="祝福">
      <button class="btn yel" id="gBtn">生成纪念卡</button>
    </div>
    <div id="gResult" style="display:none;margin-top:18px;text-align:center">
      <img class="result-img" id="gImg" alt="纪念卡预览图" style="max-width:300px">
      <div class="row" style="display:flex;gap:10px;justify-content:center">
        <a class="btn yel small" id="gDl" download="momo-gift.png">下载 PNG</a>
      </div>
    </div>
  </div>
</section>

<section class="sec wrap" style="padding-top:0">
  <div class="contact-band">
    <h2 class="h2">有想法？说出来。</h2>
    <p>我们把它做成可以玩的东西。</p>
    <a class="btn yel big" href="service.html#contact">开始一个项目</a>
  </div>
</section>

<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script>
document.getElementById("gBtn").onclick = async () => {
  const cfg = await ML.pet();
  const url = await ML.shareCard({
    game: "电子礼物", petName: document.getElementById("gName").value || "MOMO",
    rating: "♥", ratingColor: "#F16D5B", score: "∞", timeText: "永远",
    ending: document.getElementById("gMsg").value || "生日快乐，永远可爱。",
    expr: cfg.petExpressions.sleep || cfg.petAvatar, badge: "一份小礼物"
  });
  document.getElementById("gImg").src = url;
  document.getElementById("gDl").href = url;
  document.getElementById("gResult").style.display = "block";
  ML.sound.good();
};
</script>
</body>
</html>
