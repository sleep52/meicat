<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>宠物世界 — MOMO 事务所</title>
<link rel="stylesheet" href="../css/base.css?v=4">
<link rel="stylesheet" href="../css/game.css?v=4">
<script type="importmap">
{ "imports": {
    "three": "../js/vendor/three.module.min.js",
    "three/addons/": "../js/vendor/addons/"
} }
</script>
</head>
<body data-page="play" data-base="../">

<div class="g-top">
  <div class="title"><span>游戏 06</span><small>宠物世界 · 3D 角色实时渲染</small></div>
  <div class="hud">
    <span class="chip">帧率 <b class="v" id="fps">—</b></span>
    <span class="chip">来源 <b class="v" id="src">—</b></span>
    <span class="chip">命中 <b class="v" id="zone">—</b></span>
    <span class="chip">动作 <b class="v" id="cur">ml_idle</b></span>
  </div>
  <a class="btn small" href="../play.html">返回</a>
</div>

<div id="boot" class="wrap" style="padding:18px 24px 0">
  <p class="mut" style="font-size:13px">正在初始化 WebGL…</p>
</div>

<section class="wrap" style="padding:14px 24px 0">
  <div class="card" style="padding:10px">
    <canvas id="stage" style="width:100%;height:46svh;min-height:260px;display:block;touch-action:none"></canvas>
  </div>
  <p class="mut" style="font-size:12px;margin-top:8px">直接点猫：点头 / 点身 / 点尾巴 / 点脚掌，分区不同反应不同。移动鼠标或手指时视线会跟随。</p>
</section>

<section class="wrap pw-grid" style="padding:18px 24px 40px">
  <div class="card" style="padding:14px">
    <span class="label">表情 · 9</span>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px" id="faces"></div>
  </div>
  <div class="card" style="padding:14px">
    <span class="label">动作 · 12</span>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px" id="bodies"></div>
  </div>
  <div class="card" style="padding:14px">
    <span class="label">游戏事件转发 · ML.sound</span>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px" id="evs"></div>
    <p class="mut" style="font-size:12px;margin-top:8px">这 8 个按钮走的是游戏里同一条链路：游戏只发事件，角色自己决定动作和表情。</p>
  </div>
  <div class="card" style="padding:14px">
    <span class="label">导出与体检</span>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">
      <button class="btn small yel" id="snap">导出透明 PNG</button>
      <a class="btn small" id="snapDl" download="momo-pet.png" style="display:none">下载 PNG</a>
      <a class="btn small" href="../tools/glb-check.html">GLB 契约自检</a>
    </div>
    <div id="snapBox" style="margin-top:10px;display:none">
      <img id="snapImg" alt="角色导出预览" style="max-width:150px;border:1.5px solid #222;border-radius:12px;background:repeating-conic-gradient(#EEE 0% 25%, #FFF 0% 50%) 0 0/16px 16px">
      <p class="mut" style="font-size:12px;margin-top:6px" id="snapSize"></p>
    </div>
    <div class="report" id="report" style="margin-top:10px;font-size:12px;color:#88847D"></div>
  </div>
</section>

<script src="../js/icons.js?v=4"></script>
<script src="../js/core.js?v=4"></script>
<style>
  .pw-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .pw-grid .card{padding:14px}
  @media(max-width:720px){.pw-grid{grid-template-columns:1fr;gap:12px}}
</style>
<script>
  setTimeout(() => {
    if (!window.__petBooted) {
      const b = document.getElementById("boot");
      if (b) b.innerHTML = '<div class="card" style="padding:16px"><b>无法启动 3D 角色</b>' +
        '<p class="mut" style="font-size:13px;margin-top:8px">当前用 file:// 直接打开，浏览器会拦掉 ES 模块。' +
        '请用本地服务器或线上地址访问；五个 2D 小游戏不受影响。</p></div>';
    }
  }, 2600);
</script>
<script type="module">
import { attach, forwardMLSound, FACES, CLIPS, EVENTS } from "../js/pet3d.js";

const FACE_CN = { normal: "正常", happy: "开心", shock: "震惊", disgust: "嫌弃", angry: "生气", sad: "委屈", confused: "疑惑", sleepy: "困倦", smug: "得意" };
const BODY_CN = {
  ml_idle: "待机", ml_walk: "走路", ml_look_around: "东张西望", ml_run: "奔跑", ml_jump: "跳跃",
  ml_roll: "翻滚", ml_pet: "被摸头", ml_poke: "被戳", ml_stretch: "伸懒腰",
  ml_shock: "受惊", ml_angry: "炸毛", ml_collapse: "瘫倒", ml_sit: "坐下", ml_victory: "胜利",
};
const EV_CN = { tap: "点击", good: "做对了", bad: "弄错", combo: "连击", bonus: "奖励", win: "胜利", lose: "失败", tick: "倒计时" };

const boot = document.getElementById("boot");
const canvas = document.getElementById("stage");
let pet = null;

function caps() {
  try {
    const c = document.createElement("canvas");
    return !!(window.WebGLRenderingContext && (c.getContext("webgl2") || c.getContext("webgl")));
  } catch (e) { return false; }
}

async function start() {
  if (!caps()) {
    boot.innerHTML = '<div class="card" style="padding:16px"><b>这台设备不支持 WebGL</b><p class="mut" style="font-size:13px;margin-top:8px">已为你保留 2D 版本的游戏，五款小游戏照常可玩。</p></div>';
    return;
  }
  boot.innerHTML = '<p class="mut" style="font-size:13px">正在加载角色…</p>';
  const cfg = await ML.pet();
  try {
    pet = await attach({
      canvas, cfg,
      onZone: z => touch(z),
    });
    window.__pet = pet;
  } catch (e) {
    boot.innerHTML = '<div class="card" style="padding:16px"><b>角色初始化失败</b><p class="mut" style="font-size:13px;margin-top:8px">' + e.message + "</p></div>";
    return;
  }
  boot.innerHTML = '<p class="label" style="font-size:11px">角色：' + cfg.petName + " · " + (cfg.modelUrl ? "客户 3D 模型" : "程序化占位角色（等待 GLB）") + "</p>";
  window.__petBooted = true;

  const faceBox = document.getElementById("faces");
  Object.keys(FACES).forEach(k => {
    const b = document.createElement("button");
    b.className = "btn small"; b.textContent = FACE_CN[k]; b.dataset.face = k;
    b.onclick = () => pet.setFace(k);
    faceBox.appendChild(b);
  });

  const bodyBox = document.getElementById("bodies");
  CLIPS.concat(["ml_sit", "ml_victory"]).forEach(k => {
    const b = document.createElement("button");
    b.className = "btn small"; b.textContent = BODY_CN[k] || k; b.dataset.body = k;
    b.onclick = () => pet.play({ body: k, priority: true, dur: k === "ml_idle" || k === "ml_walk" || k === "ml_run" || k === "ml_sit" ? 99 : 1.8, returnTo: "ml_idle" });
    bodyBox.appendChild(b);
  });
  bodyBox.parentNode.querySelector(".label").textContent = "动作 · " + bodyBox.children.length;

  const evBox = document.getElementById("evs");
  Object.keys(EVENTS).forEach(k => {
    const b = document.createElement("button");
    b.className = "btn small yel"; b.textContent = EV_CN[k]; b.dataset.ev = k;
    // 走真实链路：调用 ML.sound，由 forwardMLSound 转发给角色
    b.onclick = () => ML.sound[k === "combo" ? "combo" : k](3);
    evBox.appendChild(b);
  });
  forwardMLSound(pet);

  const ZONE = {
    head: { body: "ml_pet", face: "happy", tail: "sway" },
    body: { body: "ml_stretch", face: "smug", tail: "fast" },
    tail: { body: "ml_angry", face: "angry", tail: "puffed" },
    paw: { body: "ml_poke", face: "disgust", tail: "still" },
  };
  function touch(z) {
    document.getElementById("zone").textContent = z ? ({ head: "头", body: "身体", tail: "尾巴", paw: "脚掌" })[z] : "空";
    if (z && ZONE[z]) pet.play(Object.assign({ dur: 1.8, returnTo: "ml_idle", priority: true }, ZONE[z]));
  }

  const snap = document.getElementById("snap");
  snap.onclick = () => {
    const url = pet.snap({ face: pet.faceName, size: 700 });
    document.getElementById("snapImg").src = url;
    document.getElementById("snapBox").style.display = "block";
    const dl = document.getElementById("snapDl");
    dl.href = url; dl.style.display = "inline-flex";
    document.getElementById("snapSize").textContent = "透明背景 PNG · " + Math.round(url.length / 1024) + " KB · 表情「" + FACE_CN[pet.faceName] + "」";
  };

  const st = pet.stats();
  document.getElementById("src").textContent = st.source === "glb" ? "客户 GLB" : "占位角色";
  document.getElementById("report").innerHTML =
    "骨骼 " + st.bones + "/28 · 动作 " + st.clips + " · 形态键 " + st.morphs +
    (st.missing.length ? "<br>待补：" + st.missing.slice(0, 8).join("；") + (st.missing.length > 8 ? "…" : "") : "<br>契约全部满足");

  setInterval(() => {
    const s = pet.stats();
    document.getElementById("fps").textContent = s.fps;
    document.getElementById("cur").textContent = pet.body;
    document.getElementById("src").textContent = (s.source === "glb" ? "GLB" : "占位") + " · " + s.dpr + "x · " + Math.round(s.tris / 100) / 10 + "k 面";
  }, 500);

  addEventListener("keydown", e => {
    if (e.key === "p" || e.key === "P" || e.key === "Escape") pet.paused ? pet.resume() : pet.pause();
  });
}

start();
</script>
</body>
</html>
