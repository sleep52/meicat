<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>我家猫 — MOMO 事务所</title>
<meta name="description" content="用真实猫咪拆解部件装配成的可互动布偶：摸头、逗它、喂零食、让它睡，心情与饱食会随时间变化。">
<link rel="stylesheet" href="../css/base.css?v=4">
<link rel="stylesheet" href="../css/game.css?v=4">
<style>
  /* 本页专属，不动共享 CSS */
  .kt-wrap{max-width:560px}
  .kt-stage{position:relative;border:var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden;
    background:linear-gradient(#F7F2E8 0 58%,#EADFCA 58% 100%);touch-action:none;user-select:none;-webkit-user-select:none}
  #cv{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:480/560;-webkit-tap-highlight-color:transparent}
  .kt-corner{position:absolute;right:10px;top:10px;background:var(--card);border:var(--bd);border-radius:999px;
    padding:3px 10px;font-size:9px;font-weight:800;letter-spacing:.14em;box-shadow:2px 2px 0 var(--ink)}
  .kt-state{position:absolute;left:10px;top:10px;background:var(--mint);border:var(--bd);border-radius:999px;
    padding:3px 11px;font-size:11px;font-weight:900;box-shadow:2px 2px 0 var(--ink);max-width:60%}
  .kt-state.bad{background:var(--red);color:#fff}
  .kt-state.dim{background:#DCD2F5}
  .needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 10px}
  .need{border:var(--bd);border-radius:12px;background:var(--card);padding:7px 9px 6px;box-shadow:2px 2px 0 rgba(34,34,34,.15);overflow:hidden}
  .need .k{font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
  .need .v{float:right;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}
  .need .bar{height:9px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-top:6px;clear:both}
  .need .bar i{display:block;height:100%;width:50%;background:var(--mint);transition:width .25s}
  .need.low .bar i{background:var(--red)}
  .kt-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
  .kt-acts .btn{padding:10px 4px 8px;font-size:13px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .kt-acts .btn [data-icon]{display:block;width:22px;height:22px}
  .kt-acts .btn [data-icon] svg{width:22px;height:22px}
  .kt-acts .btn small{font-size:9px;font-weight:700;letter-spacing:.02em;opacity:.66}
  .kt-acts .btn.on{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
  .kt-row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .kt-row2 .btn{flex:1;min-height:44px}
  #catName{flex:1 1 130px;min-width:0;max-width:190px}
  .kt-note{font-size:11px;line-height:1.55;color:var(--mut);margin-top:10px;min-height:32px}
  .kt-log{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .kt-log span{font-size:10px;font-weight:800;border:var(--bd);border-radius:999px;background:#fff;padding:2px 9px}
  @media(max-width:520px){
    .kt-acts .btn{font-size:12px;padding:9px 2px 7px}
    .need .k{letter-spacing:.04em}
  }
</style>
</head>
<body data-page="kitten" data-base="../">

<div class="g-wrap kt-wrap">
  <div class="g-top">
    <a class="icon-btn" href="../games.html" aria-label="返回"><span data-icon="back"></span></a>
    <div class="title">我家猫<small>真实部件装配 · 分层布偶</small></div>
    <span class="tag yel" id="touchTag">互动 0</span>
  </div>

  <div class="kt-stage" id="stage">
    <canvas id="cv" width="480" height="560" aria-label="可以摸、逗、喂的猫"></canvas>
    <span class="kt-state" id="stateTag">待机</span>
    <span class="kt-corner" id="rigTag">实拍布偶</span>
  </div>

  <div class="banner" id="banner"></div>

  <div class="needs">
    <div class="need" id="nMood"><span class="k">心情</span><span class="v">—</span><span class="bar"><i></i></span></div>
    <div class="need" id="nEnergy"><span class="k">精力</span><span class="v">—</span><span class="bar"><i></i></span></div>
    <div class="need" id="nFull"><span class="k">饱食</span><span class="v">—</span><span class="bar"><i></i></span></div>
  </div>

  <div class="kt-acts">
    <button class="btn mint" id="actPet"><span data-icon="heart"></span>摸头<small>按住拖</small></button>
    <button class="btn yel" id="actPlay"><span data-icon="fish"></span>逗它<small>红点 12 秒</small></button>
    <button class="btn" id="actFeed"><span data-icon="treat"></span>喂零食<small>+饱食</small></button>
    <button class="btn" id="actSleep"><span data-icon="moon"></span>让它睡<small>+精力</small></button>
  </div>

  <div class="kt-row2">
    <input class="ed-input" id="catName" maxlength="10" placeholder="给它起个名字" aria-label="猫的名字">
    <button class="btn" id="expBtn"><span data-icon="download"></span>导出合影</button>
    <button class="btn red small" id="resetBtn">重置</button>
  </div>

  <p class="kt-note" id="note">直接摸它的头、身体、爪子和尾巴，每块地方的反应不一样。按住头来回拖 = 连续撸，它会眯眼。</p>
  <div class="kt-log" id="log"></div>
</div>

<div class="ov hide" id="ov" style="position:fixed">
  <div class="panel">
    <h2 class="h2" style="font-size:22px">合影已生成</h2>
    <img class="result-img" id="ovImg" alt="猫咪合影图">
    <p class="mut" style="font-size:12px">1080 × 1350 · 手机可长按保存。</p>
    <div class="row">
      <a class="btn yel small" id="ovDl" download="my-cat.png">下载 PNG</a>
      <button class="btn mint small" id="ovFav">存进收藏</button>
      <button class="btn small" id="ovClose">继续陪它</button>
    </div>
  </div>
</div>

<script src="../js/icons.js?v=4"></script>
<script src="../js/core.js?v=4"></script>
<script src="../js/cat-rig.js?v=4"></script>
<script>
(() => {
  const { $, clamp, rand, settings } = ML;
  const cv = $("#cv"), ctx = cv.getContext("2d");
  const stage = $("#stage"), bannerEl = $("#banner"), noteEl = $("#note");
  const stateTag = $("#stateTag"), touchTag = $("#touchTag"), logEl = $("#log");

  /* ---------------- 存档 ---------------- */
  const KEY = "ml-kitten";
  const DEF = { mood: 62, energy: 70, full: 66, touches: 0, name: "", last: Date.now() };
  function loadSave() {
    let s = {};
    try { s = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { s = {}; }
    const o = Object.assign({}, DEF, s);
    o.mood = clamp(+o.mood || 0, 0, 100);
    o.energy = clamp(+o.energy || 0, 0, 100);
    o.full = clamp(+o.full || 0, 0, 100);
    o.touches = Math.max(0, Math.floor(+o.touches || 0));
    o.last = +o.last || Date.now();
    return o;
  }
  let S = loadSave();
  function persist() {
    S.mood = Math.round(R.mood); S.energy = Math.round(R.energy); S.full = Math.round(R.full);
    S.last = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* 离线也会计时：饱食与精力往下掉，心情随处境漂移（最多按 16 小时算） */
  function applyAway() {
    const hrs = clamp((Date.now() - S.last) / 36e5, 0, 16);
    if (hrs < .08) return "";
    S.full = clamp(S.full - hrs * 12, 0, 100);
    S.energy = clamp(S.energy - hrs * 4, 0, 100);
    const bad = (S.full < 30 ? 1 : 0) + (S.energy < 25 ? 1 : 0);
    S.mood = clamp(S.mood - hrs * (2 + bad * 4), 0, 100);
    return `离开了 ${hrs < 1 ? Math.round(hrs * 60) + " 分钟" : hrs.toFixed(1) + " 小时"}，`
      + (bad ? "它有点不高兴。" : "它自己待着，看到你回来了。");
  }

  /* ---------------- 画布尺寸 ---------------- */
  let W = 0, H = 0, dpr = 1, fit = 1, loaded = false;
  function size() {
    const w = Math.max(220, Math.round(stage.clientWidth || 480));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = Math.round(w * 560 / 480);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    fit = W / 480;
    if (loaded) render();
  }

  /* ---------------- 运行时 ---------------- */
  const R = {
    t: 0, mood: S.mood, energy: S.energy, full: S.full,
    mode: "idle", modeT: 0,            // idle | petting | playing | eating | sleeping | mad
    headX: 0, headY: 0, headRot: 0, headTX: 0, headTY: 0, headTR: 0,
    bodyDX: 0, bodyDY: 0,
    squash: 0, squashV: 0,
    blink: 0, blinkOn: 0, nextBlink: 2.4, mouth: 0, yawn: 0,
    tailPuff: 0, tailPhase: 0, breatheRate: 1.1,
    pointer: null, stroking: false, strokeAcc: 0,
    dot: null, dotT: 0, dotWander: 0, treat: null,
    parts: [], logs: [], lastPersist: 0
  };

  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => 1 - Math.pow(1 - k, 3);

  function msg(text, cls) {
    bannerEl.innerHTML = text ? `<span class="msg ${cls || ""}">${text}</span>` : "";
    bannerEl.dataset.until = String(R.t + 2.8);
  }
  function note(text, warn) { noteEl.textContent = text; noteEl.style.color = warn ? "var(--red)" : ""; }
  function addLog(text) {
    R.logs.unshift(text);
    if (R.logs.length > 4) R.logs.pop();
    logEl.innerHTML = R.logs.map(t => `<span>${t}</span>`).join("");
  }

  /* ---------------- HUD ---------------- */
  function clampNeeds() {
    R.mood = clamp(R.mood, 0, 100); R.energy = clamp(R.energy, 0, 100); R.full = clamp(R.full, 0, 100);
  }
  function stateLabel() {
    if (R.mode === "sleeping") return ["睡着中", "dim"];
    if (R.mode === "mad") return ["炸毛中", "bad"];
    if (R.mode === "playing") return ["玩疯了", ""];
    if (R.mode === "petting") return ["被撸，很上头", ""];
    if (R.mode === "eating") return ["在吃", ""];
    if (R.energy < 22) return ["困了", "dim"];
    if (R.full < 25) return ["饿了", "bad"];
    if (R.mood > 78) return ["心情很好", ""];
    if (R.mood < 34) return ["有点不高兴", "bad"];
    return ["待机", ""];
  }
  function paintHUD() {
    [["nMood", R.mood], ["nEnergy", R.energy], ["nFull", R.full]].forEach(([id, v]) => {
      const el = $("#" + id);
      el.querySelector(".v").textContent = Math.round(v);
      el.querySelector(".bar i").style.width = clamp(v, 0, 100) + "%";
      el.classList.toggle("low", v < 30);
    });
    touchTag.textContent = "互动 " + S.touches;
    const [label, cls] = stateLabel();
    if (stateTag.textContent !== label) stateTag.textContent = label;
    stateTag.className = "kt-state " + cls;
    actPlay.classList.toggle("on", R.mode === "playing");
    actSleep.classList.toggle("on", R.mode === "sleeping");
    actFeed.disabled = !!R.treat;
  }

  /* ---------------- 粒子 ---------------- */
  function spawn(kind, x, y, n) {
    for (let i = 0; i < (n || 1); i++) {
      R.parts.push({
        kind, x, y, vx: rand(-16, 16), vy: kind === "zzz" ? rand(-30, -20) : rand(-44, -14),
        life: 0, max: kind === "crumb" ? rand(.5, .9) : rand(1, 1.5), rot: rand(-.5, .5), s: rand(.8, 1.25)
      });
    }
  }
  function stepParts(dt) {
    for (let i = R.parts.length - 1; i >= 0; i--) {
      const p = R.parts[i];
      p.life += dt;
      if (p.life > p.max) { R.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === "crumb") p.vy += 170 * dt; else p.vy -= 6 * dt;
      p.rot += dt * .6;
    }
  }
  function heart(x, r) {
    x.beginPath();
    x.moveTo(0, r * .55);
    x.bezierCurveTo(r, -.35 * r, r * .5, -r, 0, -.4 * r);
    x.bezierCurveTo(-r * .5, -r, -r, -.35 * r, 0, r * .55);
    x.fill();
  }
  function star(x, r) {
    x.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, rr = i % 2 ? r * .38 : r;
      x[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    x.closePath(); x.fill();
  }
  function drawParts(x) {
    R.parts.forEach(p => {
      x.save();
      x.globalAlpha = clamp((1 - p.life / p.max) * 1.4, 0, 1);
      x.translate(p.x, p.y); x.rotate(p.rot); x.scale(p.s, p.s);
      if (p.kind === "heart") { x.fillStyle = "#F16D5B"; heart(x, 11); }
      else if (p.kind === "spark") { x.fillStyle = "#F5E66B"; star(x, 10); }
      else if (p.kind === "zzz") { x.fillStyle = "#222"; x.font = '900 20px "PingFang SC",Arial,sans-serif'; x.textAlign = "center"; x.fillText("z", 0, 0); }
      else if (p.kind === "crumb") { x.fillStyle = "#C98A4B"; x.fillRect(-3, -3, 6, 6); }
      else if (p.kind === "anger") { x.strokeStyle = "#F16D5B"; x.lineWidth = 3.5; x.beginPath(); x.moveTo(-8, -8); x.lineTo(8, 8); x.moveTo(8, -8); x.lineTo(-8, 8); x.stroke(); }
      x.restore();
    });
  }

  /* ---------------- 房间背景 ---------------- */
  function room(x) {
    const g = x.createLinearGradient(0, 0, 0, 560);
    g.addColorStop(0, "#F8F3EA"); g.addColorStop(.58, "#F1E9DA");
    g.addColorStop(.581, "#E7DCC8"); g.addColorStop(1, "#DCCFB6");
    x.fillStyle = g; x.fillRect(0, 0, 480, 560);
    x.save(); x.globalAlpha = .45; x.fillStyle = "#FFF6D8";
    x.beginPath(); x.moveTo(300, 0); x.lineTo(480, 0); x.lineTo(480, 250); x.lineTo(360, 120); x.closePath(); x.fill();
    x.restore();
    x.strokeStyle = "rgba(34,34,34,.14)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(0, 325); x.lineTo(480, 325); x.stroke();
    x.save(); x.globalAlpha = .85;
    x.fillStyle = "#BFE4D0"; x.beginPath(); x.ellipse(240, 500, 200, 46, 0, 0, Math.PI * 2); x.fill();
    x.strokeStyle = "rgba(34,34,34,.2)"; x.lineWidth = 3; x.stroke();
    x.restore();
  }

  /* ---------------- 每帧求解 ---------------- */
  function setMode(m, text) {
    if (R.mode === m) return;
    R.mode = m; R.modeT = 0;
    if (text) msg(text);
  }
  function dozeOff() { setMode("sleeping"); addLog("自己睡着了"); }
  function wake(grumpy) {
    if (R.mode !== "sleeping") return;
    setMode("idle");
    if (grumpy) {
      R.mood = clamp(R.mood - 5, 0, 100);
      msg("被吵醒了，很不满", "red"); ML.sound.bad();
      spawn("anger", 240 + R.headX, 170, 1);
    } else {
      msg(R.energy >= 95 ? "睡饱了" : R.energy >= 75 ? "精神回来一点了" : "才睡了一会儿就醒了", "mint");
      addLog("醒了");
    }
  }
  function stopPlay(text) {
    if (R.mode !== "playing") return;
    R.dot = null; R.dotT = 0;
    setMode("idle");
    if (text) msg(text);
  }
  function touch(n) {
    S.touches += n;
    touchTag.textContent = "互动 " + S.touches;
    ML.patchStats({ interactions: n });
  }

  function solve(dt) {
    R.t += dt; R.modeT += dt;

    const rate = R.mode === "sleeping" ? .55 : R.mode === "playing" ? 2.4 : R.mode === "eating" ? 1.7 : 1.1;
    R.breatheRate = lerp(R.breatheRate, rate, ease(Math.min(1, dt * 3)));

    /* 眨眼 */
    if (R.mode === "sleeping") R.blink = lerp(R.blink, 1, ease(Math.min(1, dt * 5)));
    else if (R.mode === "petting") R.blink = lerp(R.blink, .62, ease(Math.min(1, dt * 4)));
    else {
      if (R.t > R.nextBlink) { R.nextBlink = R.t + rand(2.2, 6.4); R.blinkOn = .17; }
      if (R.blinkOn > 0) {
        R.blinkOn -= dt;
        R.blink = clamp(1 - Math.abs(R.blinkOn / .17 - .5) * 2, 0, 1);
      } else R.blink = lerp(R.blink, 0, ease(Math.min(1, dt * 12)));
    }

    /* 嘴 */
    if (R.mode === "eating") R.mouth = lerp(R.mouth, .35 + .65 * Math.abs(Math.sin(R.t * 9)), ease(Math.min(1, dt * 10)));
    else if (R.yawn > 0) { R.yawn -= dt; R.mouth = clamp(Math.min(1, R.yawn * 1.6), 0, 1); }
    else R.mouth = lerp(R.mouth, 0, ease(Math.min(1, dt * 9)));

    /* 尾巴 */
    R.tailPuff = lerp(R.tailPuff, R.mode === "mad" ? 1 : 0, ease(Math.min(1, dt * 6)));
    const wagSpeed = R.mode === "mad" ? 7.5 : R.mode === "playing" ? 5.2 : R.mode === "petting" ? 3 : R.mode === "sleeping" ? .7 : 1.5;
    R.tailPhase += dt * wagSpeed;

    /* 挤压回弹 */
    R.squashV += -R.squash * 60 * dt - R.squashV * 9 * dt;
    R.squash += R.squashV * dt;

    /* 视线：玩红点时看红点，否则跟指针 */
    const look = R.mode === "playing" && R.dot ? R.dot : R.pointer;
    if (look) {
      R.headTX = clamp((look.x - 240) * .075, -20, 20);
      R.headTY = clamp((look.y - 250) * .05, -14, 16);
      R.headTR = clamp(R.headTX * .0042, -.13, .13);
    } else {
      R.headTX = lerp(R.headTX, 0, ease(Math.min(1, dt * 1.2)));
      R.headTY = lerp(R.headTY, 0, ease(Math.min(1, dt * 1.2)));
      R.headTR = lerp(R.headTR, 0, ease(Math.min(1, dt * 2)));
    }
    if (R.mode === "eating") { R.headTY = 16; R.headTX = clamp(R.headTX * .4, -6, 6); }
    if (R.mode === "sleeping") { R.headTX = lerp(R.headTX, 0, ease(Math.min(1, dt * 2))); R.headTY = lerp(R.headTY, 10, ease(Math.min(1, dt * 2))); R.headTR = lerp(R.headTR, .05, ease(Math.min(1, dt * 2))); }
    const kHead = ease(Math.min(1, dt * (R.mode === "playing" ? 7 : 3.4)));
    R.headX = lerp(R.headX, R.headTX, kHead);
    R.headY = lerp(R.headY, R.headTY, kHead);
    R.headRot = lerp(R.headRot, R.headTR, kHead);

    R.bodyDX = lerp(R.bodyDX, R.mode === "playing" ? clamp(R.headX * .35, -10, 10) : 0, kHead);
    R.bodyDY = lerp(R.bodyDY, R.mode === "sleeping" ? 12 : 0, ease(Math.min(1, dt * 3)));

    /* 数值 */
    R.full = clamp(R.full - dt * .02, 0, 100);
    if (R.mode === "sleeping") { R.energy = clamp(R.energy + dt * 1.6, 0, 100); if (R.energy >= 100) wake(false); }
    else R.energy = clamp(R.energy - dt * (R.mode === "playing" ? .8 : .06), 0, 100);
    R.mood = clamp(R.mood + dt * ((R.full < 25 || R.energy < 20) ? -.5 : R.mood < 55 ? .06 : -.02), 0, 100);

    /* 状态自然回落 */
    if (R.mode === "petting" && !R.stroking && R.modeT > 1.4) setMode("idle");
    if (R.mode === "mad" && R.modeT > 3.2) setMode("idle");
    if (R.mode === "idle" && R.energy < 45 && R.yawn <= 0 && Math.random() < dt * .06) { R.yawn = .9; addLog("打了个哈欠"); }
    if (R.mode === "idle" && R.t - (R.lastAct || 0) > 25 && R.energy < 40) dozeOff();
    if (R.mode === "sleeping" && Math.random() < dt * .9) spawn("zzz", 250 + R.headX, 190, 1);

    /* 逗它：红点倒计时 + 没人动指针时自己飘 */
    if (R.mode === "playing") {
      R.dotT -= dt;
      if (R.dotT <= 0) { stopPlay("它玩够了，趴下来喘气。"); R.energy = clamp(R.energy - 4, 0, 100); }
      const still = !R.pointer || R.t - (R.pointerT || 0) > .5;
      if (R.dot && still) {
        R.dotWander += dt;
        R.dot.x = clamp(R.dot.x + Math.sin(R.dotWander * 1.7) * 90 * dt + Math.cos(R.dotWander * .8) * 40 * dt, 60, 420);
        R.dot.y = clamp(R.dot.y + Math.cos(R.dotWander * 2.3) * 70 * dt, 150, 470);
      }
      if (R.dot && Math.random() < dt * .45 && R.energy > 12) {
        R.squashV = -3.2; R.mouth = .8;
        spawn("spark", R.dot.x, R.dot.y, 2);
        ML.sound.combo(4);
      }
    }

    /* 零食下落 */
    if (R.treat) {
      const tr = R.treat;
      tr.y += dt * tr.vy; tr.vy += 230 * dt; tr.rot = (tr.rot || 0) + dt * 3;
      if (tr.y >= tr.ty) {
        R.treat = null;
        R.mouth = 1; setMode("eating");
        R.full = clamp(R.full + 20, 0, 100); R.mood = clamp(R.mood + 3, 0, 100);
        spawn("crumb", tr.x, tr.y, 5); addLog("吃了 1 颗"); ML.sound.good();
      }
    }
    if (R.mode === "eating" && !R.treat && R.modeT > 1.8) setMode("idle");

    /* 连续摸头 */
    if (R.stroking) {
      R.strokeAcc += dt;
      if (R.strokeAcc > .34) {
        R.strokeAcc = 0;
        R.mood = clamp(R.mood + 1.6, 0, 100);
        touch(1);
        const c = CatRig.center(P(), "head");
        spawn("heart", c[0] + rand(-34, 34), c[1] - 22, 1);
        if (Math.random() < .3) ML.sound.good();
      }
    }

    stepParts(dt);
    if (R.t - R.lastPersist > 4) { R.lastPersist = R.t; persist(); }
    if (bannerEl.innerHTML && R.t > +bannerEl.dataset.until) bannerEl.innerHTML = "";
  }

  function P() {
    return CatRig.pose({
      x: R.bodyDX, y: R.bodyDY,
      breathe: Math.sin(R.t * R.breatheRate),
      bodySquash: R.squash,
      headX: R.headX, headY: R.headY, headRot: R.headRot,
      blink: R.blink, mouth: R.mouth,
      tailRot: -.12 + R.tailPuff * .12,
      tailWag: Math.sin(R.tailPhase) * (R.mode === "mad" ? .5 : R.mode === "playing" ? .38 : R.mode === "sleeping" ? .05 : .2),
      tailPuff: R.tailPuff,
      shadow: clamp(1 - R.squash * .12, .8, 1.15)
    });
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.scale(fit, fit);
    room(ctx);
    CatRig.draw(ctx, P());
    if (R.mode === "playing" && R.dot) {
      ctx.save();
      ctx.fillStyle = "#F16D5B"; ctx.strokeStyle = "#222"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(R.dot.x, R.dot.y, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.beginPath(); ctx.arc(R.dot.x - 3, R.dot.y - 4, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if (R.treat) {
      ctx.save();
      ctx.translate(R.treat.x, R.treat.y); ctx.rotate(R.treat.rot || 0);
      ctx.fillStyle = "#C98A4B"; ctx.strokeStyle = "#222"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, 0, 13, 9, .5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#8C5A2B";
      ctx.beginPath(); ctx.arc(-3, -1, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, 2, 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawParts(ctx);
    ctx.restore();
    paintHUD();
  }

  /* ---------------- 主循环 ---------------- */
  let last = 0, paused = false;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (stage.clientWidth !== W) size();
    const dt = clamp((ts - last) / 1000, 0, .05); last = ts;
    if (paused || !loaded) return;
    if (settings.anim) solve(dt);
    else { R.t += dt; if (bannerEl.innerHTML && R.t > +bannerEl.dataset.until) bannerEl.innerHTML = ""; }
    render();
  }

  /* ---------------- 触摸分区反应 ---------------- */
  function reactTo(part, px, py) {
    touch(1);
    R.lastAct = R.t;
    if (R.mode === "sleeping" && part !== "tail") { wake(true); return; }
    if (part === "head") {
      R.mood = clamp(R.mood + 2.4, 0, 100);
      setMode("petting");
      spawn("heart", px, py - 12, 2);
      ML.sound.good(); addLog("摸了头");
      return;
    }
    if (part === "paw") {
      R.squashV = -2.2;
      if (R.mood < 45) {
        R.mood = clamp(R.mood - 2, 0, 100);
        msg("它把爪子抽回去了", "red"); ML.sound.bad(); addLog("不让碰爪");
      } else {
        R.mood = clamp(R.mood + 1, 0, 100);
        spawn("spark", px, py, 1); ML.sound.tap(); addLog("握了个爪");
      }
      return;
    }
    if (part === "tail") {
      R.mood = clamp(R.mood - 3.5, 0, 100);
      setMode("mad");
      R.tailPuff = 1;
      spawn("anger", px, py - 16, 2);
      ML.sound.bad(); addLog("拽了尾巴"); msg("别碰尾巴！", "red");
      return;
    }
    R.squashV = -2.6;
    R.mood = clamp(R.mood + .6, 0, 100);
    ML.sound.tap(); spawn("spark", px, py, 1);
    if (R.mode !== "playing" && R.mode !== "eating") setMode("idle");
    if (Math.random() < .3) addLog("抖了一下毛");
  }

  function toStagePt(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * 480, y: (e.clientY - r.top) / r.height * 560 };
  }
  let downPart = null;
  cv.addEventListener("pointerdown", e => {
    if (!loaded) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const p = toStagePt(e);
    R.pointer = p; R.pointerT = R.t;
    const part = CatRig.hit(P(), p.x, p.y);
    if (!part) { R.pointer = null; msg("它没反应，先摸摸它本身", "yel"); return; }
    downPart = part;
    if (R.mode === "playing") R.dot = p;
    reactTo(part, p.x, p.y);
    if (part === "head") { R.stroking = true; R.strokeAcc = 0; }
  });
  cv.addEventListener("pointermove", e => {
    const p = toStagePt(e);
    R.pointer = p; R.pointerT = R.t;
    if (R.mode === "playing") { R.dot = p; return; }
    if (R.stroking) {
      const part = CatRig.hit(P(), p.x, p.y);
      if (part === "head") R.stroking = true;
      else if (part === "body" || part === "paw") { R.stroking = false; downPart = part; }
    }
  });
  function endStroke() { R.stroking = false; downPart = null; }
  cv.addEventListener("pointerup", endStroke);
  cv.addEventListener("pointercancel", endStroke);
  cv.addEventListener("pointerleave", () => { R.pointer = null; endStroke(); });

  /* ---------------- 四个动作 ---------------- */
  const actPet = $("#actPet"), actPlay = $("#actPlay"), actFeed = $("#actFeed"), actSleep = $("#actSleep");
  actPet.onclick = () => {
    if (R.mode === "sleeping") { wake(true); return; }
    R.lastAct = R.t;
    touch(1);
    R.mood = clamp(R.mood + 3, 0, 100);
    setMode("petting");
    const c = CatRig.center(P(), "head");
    spawn("heart", c[0], c[1] - 26, 3);
    ML.sound.good(); addLog("摸了头");
  };
  actPlay.onclick = () => {
    if (R.mode === "sleeping") { wake(true); return; }
    if (R.mode === "playing") { stopPlay("不玩了，红点收起来。"); return; }
    if (R.energy < 25) { msg("太累了，先让它睡一会儿", "red"); ML.sound.bad(); return; }
    R.lastAct = R.t;
    R.dot = { x: 240, y: 300 }; R.dotT = 12; R.dotWander = 0;
    setMode("playing");
    R.energy = clamp(R.energy - 6, 0, 100);
    R.mood = clamp(R.mood + 5, 0, 100);
    touch(1);
    ML.sound.combo(3);
    msg("逗它玩：拖动红点", "mint");
  };
  actFeed.onclick = () => {
    if (R.mode === "sleeping") { wake(true); return; }
    if (R.treat) return;
    R.lastAct = R.t;
    if (R.full > 92) {
      R.mood = clamp(R.mood - 1.5, 0, 100);
      msg("它扭过头：吃不下了", "red"); ML.sound.bad();
      R.headTX = 18;
      return;
    }
    const c = CatRig.center(P(), "head");
    R.treat = { x: c[0] + rand(-24, 24), y: 120, vy: 40, ty: c[1] + 44, rot: 0 };
    touch(1);
    ML.sound.tick();
  };
  actSleep.onclick = () => {
    R.lastAct = R.t;
    if (R.mode === "sleeping") { wake(false); return; }
    stopPlay();
    setMode("sleeping");
    ML.sound.tick();
    msg("让它睡了，精力会慢慢回来", "mint");
    addLog("去睡觉了");
  };
  $("#resetBtn").onclick = () => {
    S = Object.assign({}, DEF, { last: Date.now() });
    R.mood = S.mood; R.energy = S.energy; R.full = S.full;
    R.parts.length = 0; R.logs.length = 0; R.treat = null;
    stopPlay();
    R.mode = "idle"; R.modeT = 0; R.tailPuff = 0;
    $("#catName").value = "";
    logEl.innerHTML = "";
    persist(); render();
    msg("已重置", "yel");
  };

  /* ---------------- 导出合影 ---------------- */
  const CAP = {
    hi: ["今天也是全家最可爱的", "被撸了三小时，手麻的是你", "心情很好，原因不明"],
    mid: ["精神状态：还行，没炸", "在等你下班", "表面平静，心里想着零食"],
    low: ["心情一般，请勿靠近尾巴", "已读不回", "这个家没我不行"]
  };
  const caption = () => CAP[R.mood > 72 ? "hi" : R.mood < 40 ? "low" : "mid"][Math.floor(Math.random() * 3)];
  function makePNG() {
    const CW = 1080, CH = 1350;
    const c = document.createElement("canvas"); c.width = CW; c.height = CH;
    const x = c.getContext("2d");
    const F = (w, s) => `${w} ${s}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Arial,sans-serif`;
    x.fillStyle = "#FAF8F3"; x.fillRect(0, 0, CW, CH);
    x.fillStyle = "#fff"; ML.rr(x, 40, 40, CW - 80, CH - 80, 34); x.fill();
    x.lineWidth = 10; x.strokeStyle = "#222"; ML.rr(x, 40, 40, CW - 80, CH - 80, 34); x.stroke();
    x.fillStyle = "#222"; x.font = F("900", 54); x.textAlign = "left";
    x.fillText(S.name || "我家猫", 86, 150);
    x.fillStyle = "#88847D"; x.font = F("700", 26); x.textAlign = "right";
    x.fillText("MOMO 事务所 · 我家猫", CW - 86, 142);
    x.fillStyle = "#F5E66B"; x.fillRect(86, 176, CW - 172, 14);
    x.lineWidth = 4; x.strokeStyle = "#222"; x.strokeRect(86, 176, CW - 172, 14);
    const sc = Math.min((CW - 240) / 480, 830 / 560);
    x.save();
    x.translate((CW - 480 * sc) / 2, 226);
    x.scale(sc, sc);
    room(x);
    CatRig.draw(x, P());
    x.restore();
    const rows = [["心情", Math.round(R.mood)], ["精力", Math.round(R.energy)], ["饱食", Math.round(R.full)]];
    const gap = 16, bw = (CW - 172 - gap * 2) / 3;
    rows.forEach((r, i) => {
      const bx = 86 + i * (bw + gap);
      x.fillStyle = "#F1E9DA"; ML.rr(x, bx, 1092, bw, 96, 18); x.fill();
      x.lineWidth = 4; x.strokeStyle = "#222"; ML.rr(x, bx, 1092, bw, 96, 18); x.stroke();
      x.fillStyle = "#88847D"; x.font = F("800", 22); x.textAlign = "left"; x.fillText(r[0], bx + 18, 1126);
      x.fillStyle = "#222"; x.font = F("900", 40); x.fillText(String(r[1]), bx + 18, 1170);
      x.fillStyle = "#D9CFC0"; ML.rr(x, bx + 18, 1178, bw - 36, 10, 5); x.fill();
      x.fillStyle = r[1] < 30 ? "#F16D5B" : "#5FBF9B"; ML.rr(x, bx + 18, 1178, Math.max(0, (bw - 36) * r[1] / 100), 10, 5); x.fill();
    });
    x.fillStyle = "#222"; x.font = F("900", 40); x.textAlign = "center";
    x.fillText("「" + caption() + "」", CW / 2, 1252);
    x.fillStyle = "#88847D"; x.font = F("700", 22);
    x.fillText(`累计互动 ${S.touches} 次 · ${ML.today()}`, CW / 2, 1294);
    return c.toDataURL("image/png");
  }
  let lastShot = null;
  $("#expBtn").onclick = () => {
    if (!loaded) return;
    try {
      lastShot = makePNG();
      $("#ovImg").src = lastShot;
      $("#ovDl").href = lastShot;
      $("#ov").classList.remove("hide");
      ML.patchStats({ points: 4 });
      msg("合影已生成", "mint");
    } catch (e) {
      note("导出失败：浏览器不允许把这张图写进 PNG。用本地服务器或线上地址打开本页即可正常导出。", true);
    }
  };
  $("#ovFav").onclick = () => {
    if (!lastShot) return;
    const work = {
      id: "kitten-" + Date.now(), game: "kitten", gameName: "我家猫",
      title: (S.name || "我家猫") + " · 心情 " + Math.round(R.mood),
      score: Math.round(R.mood),
      rating: R.mood > 72 ? "满分喵" : R.mood > 40 ? "还行" : "要哄",
      time: ML.today(), png: lastShot
    };
    ML.addWork(work);
    if (!ML.works().some(w => w.id === work.id)) {
      msg("收藏没存下：图片太大，本机存储写不进去。可以先点「下载 PNG」自己留一张。", "red");
      ML.sound.bad();
      return;
    }
    msg("已存进收藏", "mint");
    addLog("存了一张合影");
    $("#ov").classList.add("hide");
  };
  $("#ovClose").onclick = () => $("#ov").classList.add("hide");
  $("#ov").addEventListener("click", e => { if (e.target === $("#ov")) $("#ov").classList.add("hide"); });

  /* ---------------- 名字 ---------------- */
  const nameEl = $("#catName");
  nameEl.value = S.name || "";
  nameEl.oninput = () => { S.name = nameEl.value.slice(0, 10); persist(); };

  /* ---------------- 启动 ---------------- */
  document.addEventListener("visibilitychange", () => {
    paused = document.hidden;
    if (paused) persist(); else last = performance.now();
  });
  window.addEventListener("beforeunload", persist);
  window.addEventListener("resize", size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(stage);

  const away = applyAway();
  R.mood = S.mood; R.energy = S.energy; R.full = S.full;

  size();
  CatRig.load().then(() => {
    loaded = true;
    $("#rigTag").textContent = CatRig.masks.body ? "实拍剪影 · 像素命中" : "实拍剪影 · 近似命中";
    size();
    if (away) msg(away, "yel");
    requestAnimationFrame(ts => { last = ts; loop(ts); });
  }).catch(err => {
    note("部件图没读到：" + (err && err.message || err) + "。请确认 assets/pets/realcat/ 下的 6 张 webp 都在，并用本地服务器打开本页。", true);
    paintHUD();
  });

  window.__kitten = {
    R, S, CatRig, P, solve, render, size, msg, reactTo, makePNG,
    hit: (x, y) => CatRig.hit(P(), x, y),
    state: () => ({ mode: R.mode, mood: R.mood, energy: R.energy, full: R.full, blink: R.blink, mouth: R.mouth, puff: R.tailPuff, touches: S.touches })
  };
})();
</script>
</body>
</html>
