<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>紧急撤离 — MOMO 事务所</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/game.css">
</head>
<body data-page="play" data-base="../">

<div class="g-wrap">
  <div class="g-top">
    <a class="icon-btn" href="../play.html" aria-label="back"><span data-icon="back"></span></a>
    <div class="title">紧急撤离<small>游戏 01</small></div>
    <button class="icon-btn" id="pauseBtn" aria-label="pause"><span data-icon="pause"></span></button>
  </div>
  <div class="hud">
    <div class="chip hot"><div class="k">时间</div><div class="v" id="hTime">45</div></div>
    <div class="chip"><div class="k">清洁度</div><div class="v" id="hClean">0/8</div></div>
    <div class="chip yel"><div class="k">加分</div><div class="v" id="hBonus">0</div></div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="scene" id="scene">
    <div class="baseboard"></div><div class="rug"></div>
    <div class="sofa"></div><div class="table"></div>
    <div class="zone" id="z-sofa" style="left:9%;top:38%;width:38%;height:20%">沙发</div>
    <div class="zone" id="z-table" style="right:6%;top:40%;width:26%;height:14%">桌子</div>
    <div class="zone" id="z-mat" style="right:7%;bottom:5%;width:26%;height:14%">门口地垫</div>
    <div class="zone" id="z-basket" style="left:6%;bottom:5%;width:24%;height:16%">收纳篮</div>
    <div class="pet-sprite" id="pet" style="left:44%;top:60%"><img alt=""></div>

    <div class="ov" id="startOv">
      <div class="panel">
        <span class="tag red">"我快回来了。"</span>
        <h2 class="h2">紧急撤离</h2>
        <ul class="desc">
          <li>45 秒内收拾现场：抱枕/玩具/拖鞋<b>拖</b>到虚线区。</li>
          <li>纸巾<b>连点 3 次</b>；水杯<b>按住 0.5 秒再拖</b>到桌子。</li>
          <li>沙发抓痕点一下贴修复贴纸。</li>
          <li>随机突发事件：藏东西、选藏身点、机器人、监控…</li>
          <li>收拾完选择装睡地点，演技决定结局。P / Esc 暂停。</li>
        </ul>
        <div class="row"><button class="btn yel big" id="startBtn">开始撤离</button></div>
      </div>
    </div>
    <div class="ov hide" id="pauseOv">
      <div class="panel"><h2 class="h2">已暂停</h2><p class="mut" style="font-size:13px">主人也在暂停。</p>
        <div class="row"><button class="btn yel" id="resumeBtn">继续</button><a class="btn" href="../play.html">离开</a></div></div>
    </div>
    <div class="ov hide" id="eventOv">
      <div class="panel"><span class="tag red" id="evTag">事件</span><h2 class="h2" id="evTitle" style="font-size:22px"></h2>
        <p class="mut" style="font-size:13px" id="evDesc"></p><div class="row" id="evBtns"></div></div>
    </div>
    <div class="ov hide" id="sleepOv">
      <div class="panel"><span class="tag mint">现场已整理</span><h2 class="h2" style="font-size:22px">最后一步：装睡</h2>
        <p class="mut" style="font-size:13px">主人进门了。选择你的表演方式：</p>
        <div class="row" style="flex-direction:column">
          <button class="btn pur" data-loc="sofa">沙发上装睡</button>
          <button class="btn mint" data-loc="floor">地板上装睡</button>
          <button class="btn yel" data-loc="bed">猫窝里装睡</button>
          <button class="btn" data-loc="brazen">直接假装什么都不知道</button>
        </div></div>
    </div>
    <div class="ov hide" id="endOv">
      <div class="panel">
        <span class="rating" id="endRating">S</span>
        <h2 class="h2" id="endTitle" style="font-size:22px"></h2>
        <p class="mut" style="font-size:13px" id="endDesc"></p>
        <img class="result-img" id="endImg" alt="分享卡">
        <div class="row">
          <a class="btn yel small" id="saveBtn" download="momo-escape.png">保存卡片</a>
          <button class="btn small" id="retryBtn">再来一次</button>
          <a class="btn small" href="../play.html">大厅</a>
        </div>
      </div>
    </div>
  </div>
  <div class="g-actions"><span class="label">拖动 · 连点 · 按住拖 · 贴纸 / 触摸 & 鼠标 / P 暂停</span></div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/core.js"></script>
<script>
(() => {
  const { $, $$, clamp, rand, pick, shuffle, sound, floatSticker } = ML;
  const scene = $("#scene"), banner = $("#banner");
  const mac = ML.machine();
  let timeLeft = 45, elapsed = 0, done = 0, required = 8, bonus = 0, penalty = 0;
  let objs = [], activeEvent = null, eventTimes = [], freezeUntil = -1, petCfg = null, last = 0;

  const DEFS = [
    { icon: "cushion", type: "drag", zone: "z-sofa", name: "抱枕" },
    { icon: "tissue", type: "tap", taps: 3, name: "纸巾" },
    { icon: "cup", type: "hold", zone: "z-table", name: "水杯" },
    { icon: "slipper", type: "drag", zone: "z-mat", name: "拖鞋" },
    { icon: "slipper", type: "drag", zone: "z-mat", name: "拖鞋" },
    { icon: "toy", type: "drag", zone: "z-basket", name: "玩具" },
    { icon: "toy", type: "drag", zone: "z-basket", name: "玩具" },
    { icon: "scratch", type: "tap", taps: 1, name: "抓痕", sofa: true },
  ];
  const SLOTS = shuffle([{ x: 30, y: 66 }, { x: 50, y: 72 }, { x: 68, y: 64 }, { x: 22, y: 82 }, { x: 45, y: 86 }, { x: 66, y: 84 }, { x: 82, y: 72 }, { x: 12, y: 66 }]);

  function say(text, cls = "") { banner.innerHTML = text ? `<span class="msg ${cls}">${text}</span>` : ""; }
  function hud() {
    $("#hTime").textContent = Math.ceil(timeLeft);
    $("#hClean").textContent = done + "/" + required;
    $("#hBonus").textContent = bonus;
  }
  function spawn(def, pos) {
    const el = document.createElement("div");
    el.className = "obj"; el.innerHTML = ML_ICONS[def.icon]; el.dataset.icon = def.icon;
    el.style.left = `calc(${pos.x}% - 30px)`; el.style.top = `calc(${pos.y}% - 30px)`;
    if (def.type === "tap" && def.taps > 1) el.innerHTML += `<span class="pips">${"<i></i>".repeat(def.taps)}</span>`;
    scene.appendChild(el);
    const o = Object.assign({ el, done: false, taps: 0 }, def);
    objs.push(o); bindObj(o); return o;
  }
  function complete(o, label) {
    if (o.done) return;
    o.done = true; o.el.classList.add("done");
    const px = parseFloat(o.el.style.left) || 100, py = parseFloat(o.el.style.top) || 100;
    if (o.optional) { bonus++; sound.bonus(); floatSticker(scene, "+6", px, py); }
    else { done++; sound.good(); floatSticker(scene, label || "+1", px, py); }
    hud();
    if (done >= required && mac.get() === "PLAYING") setTimeout(() => { if (mac.get() === "PLAYING") { $("#sleepOv").classList.remove("hide"); } }, 450);
  }
  function bindObj(o) {
    const el = o.el;
    let drag = null, holdT = null;
    el.addEventListener("pointerdown", e => {
      if (mac.get() !== "PLAYING" || o.done) return;
      if (freezeUntil > elapsed) { penalty++; sound.bad(); say("被监控拍到了！-8", "red"); hud(); return; }
      e.preventDefault();
      if (o.type === "tap") {
        o.taps++; sound.tap();
        el.querySelectorAll(".pips i").forEach((p, i) => p.classList.toggle("on", i < o.taps));
        el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 300);
        if (o.taps >= o.need) complete(o, o.icon === "scratch" ? "修复!" : "收拾+1");
        return;
      }
      const r = scene.getBoundingClientRect();
      drag = { sx: e.clientX, sy: e.clientY, ox: el.offsetLeft, oy: el.offsetTop, active: o.type === "drag", r };
      if (o.type === "hold") { el.classList.add("hold"); holdT = setTimeout(() => { if (drag) { drag.active = true; el.classList.add("drag"); el.classList.remove("hold"); } }, 450); }
      else el.classList.add("drag");
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener("pointermove", e => {
      if (!drag || !drag.active) return;
      const nx = clamp(drag.ox + e.clientX - drag.sx, 0, drag.r.width - 60);
      const ny = clamp(drag.oy + e.clientY - drag.sy, 0, drag.r.height - 60);
      el.style.left = nx + "px"; el.style.top = ny + "px";
      const z = $("#" + o.zone), zr = z.getBoundingClientRect();
      const cx = drag.r.left + nx + 30, cy = drag.r.top + ny + 30;
      z.classList.toggle("over", cx > zr.left && cx < zr.right && cy > zr.top && cy < zr.bottom);
    });
    const up = e => {
      clearTimeout(holdT); el.classList.remove("hold");
      if (!drag) return;
      const wasActive = drag.active; drag = null; el.classList.remove("drag");
      if (!wasActive) { if (o.type === "hold") say("水杯要按住 0.5 秒再拖！"); return; }
      const z = $("#" + o.zone), zr = z.getBoundingClientRect(), r = scene.getBoundingClientRect();
      const cx = r.left + el.offsetLeft + 30, cy = r.top + el.offsetTop + 30;
      z.classList.remove("over");
      if (cx > zr.left && cx < zr.right && cy > zr.top && cy < zr.bottom) { z.classList.add("done"); complete(o); }
    };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  }

  function triggerEvent() {
    const kind = pick(["A", "B", "C", "D", "E"].filter(k => !triggerEvent.used?.includes(k)));
    (triggerEvent.used = triggerEvent.used || []).push(kind);
    if (kind === "A") {
      say("猫！你嘴里是什么？快点藏起来！", "red"); sound.bad();
      const o = spawn({ icon: "sock", type: "tap", taps: 1, name: "袜子" }, { x: rand(25, 75), y: rand(62, 86) });
      o.need = 1; o.optional = true;
      activeEvent = { kind, until: elapsed + 5, obj: o };
    } else if (kind === "B") {
      say("门口有脚步声！选一个藏身点！", "red"); sound.bad();
      $("#evTag").textContent = "事件 B"; $("#evTitle").textContent = "脚步声！";
      $("#evDesc").textContent = "3 秒内选择藏身地点：";
      const box = $("#evBtns"); box.innerHTML = "";
      ["沙发后", "窗帘后", "纸箱里"].forEach(t => {
        const b = document.createElement("button"); b.className = "btn small pur"; b.textContent = t;
        b.onclick = () => { $("#eventOv").classList.add("hide"); bonus++; sound.good(); say("藏好了！+6", "mint"); activeEvent = null; hud(); };
        box.appendChild(b);
      });
      $("#eventOv").classList.remove("hide");
      activeEvent = { kind, until: elapsed + 3 };
    } else if (kind === "C") {
      say("扫地机器人把玩具推出来了！拖回收纳篮！", "yel"); sound.bad();
      const o = spawn({ icon: "toy", type: "drag", zone: "z-basket", name: "玩具" }, { x: 88, y: 70 });
      o.optional = true;
      activeEvent = { kind, until: elapsed + 6, obj: o };
    } else if (kind === "D") {
      timeLeft = Math.min(timeLeft + 10, 60); required += 2;
      say("主人说还有五分钟。+10s，但地上多了零食！", "mint"); sound.bonus();
      spawn(Object.assign({ icon: "treat", type: "tap", taps: 1, name: "零食", need: 1 }, {}), { x: rand(25, 45), y: rand(64, 84) }).need = 1;
      spawn({ icon: "treat", type: "tap", taps: 1, name: "零食", need: 1 }, { x: rand(55, 80), y: rand(64, 84) });
      hud();
    } else {
      freezeUntil = elapsed + 4;
      say("监控摄像头连接中…保持安静，别碰任何东西！", "pur"); sound.tick();
      activeEvent = { kind, until: elapsed + 4 };
    }
  }

  function finish(loc) {
    mac.set("FINISHED");
    $("#sleepOv").classList.add("hide"); $("#eventOv").classList.add("hide");
    const pct = Math.min(1, done / required);
    let score = Math.round(clamp(pct * 60 + Math.min(timeLeft, 20) * 1.5 + bonus * 6 - penalty * 8, 0, 120));
    let rating, title, desc, expr, color;
    if ((loc === "brazen" && pct < 0.3) || (loc === null && done === 0)) {
      rating = "H"; color = "#DCD2F5"; title = "理直气壮 · 隐藏结局";
      desc = "你根本没收拾，反而理直气壮地坐在现场中央。主人沉默了。"; expr = "mischief"; score = Math.max(score, 66);
    } else if (loc === "brazen") {
      rating = "A"; color = "#F5E66B"; title = "演技派"; desc = "现场干净，演技自然。主人只觉得今天猫格外乖巧。"; expr = "deadpan";
    } else if (loc === null) {
      rating = pct >= .6 ? "B" : "C"; color = rating === "B" ? "#F5E66B" : "#F16D5B";
      title = rating === "B" ? "有些可疑" : "失败现场";
      desc = rating === "B" ? "你掩盖了大部分证据，但主人还是皱起了眉。" : "主人一进门就发现了真相。";
      expr = rating === "B" ? "surprised" : "innocent";
    } else {
      if (score >= 88) { rating = "S"; color = "#F5E66B"; title = "完美现场"; desc = "主人没有发现任何异常。甚至夸你是好猫。"; expr = "happy"; }
      else if (score >= 70) { rating = "A"; color = "#F5E66B"; title = "基本无事发生"; desc = "但主人觉得家里好像哪里不对。"; expr = "deadpan"; }
      else if (score >= 45) { rating = "B"; color = "#F5E66B"; title = "有些可疑"; desc = "你成功掩盖了大部分证据。"; expr = "surprised"; }
      else { rating = "C"; color = "#F16D5B"; title = "失败现场"; desc = "主人一进门就发现了真相。"; expr = "innocent"; }
    }
    const rec = ML.record("escape", score);
    $("#endRating").textContent = rating; $("#endRating").style.background = color;
    $("#endRating").style.color = color === "#F16D5B" ? "#fff" : "#222";
    $("#endTitle").textContent = title;
    $("#endDesc").textContent = `${desc} 完成度 ${Math.round(pct * 100)}% · 得分 ${score} · 历史最佳 ${rec.best}`;
    $("#endOv").classList.remove("hide");
    rating === "C" ? sound.lose() : sound.win();
    const exprUrl = petCfg.petExpressions[expr] || petCfg.petAvatar;
    ML.shareCard({ game: "紧急撤离", petName: petCfg.petName, rating, ratingColor: color, score, timeText: `用时 ${Math.round(elapsed)} 秒`, ending: title, expr: exprUrl, badge: "撤离报告" })
      .then(url => { $("#endImg").src = url; $("#saveBtn").href = url; });
  }

  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.max(0, Math.min((t - last) / 1000, .05)); last = t;
    if (mac.get() !== "PLAYING") return;
    if (!$("#sleepOv").classList.contains("hide")) return;
    timeLeft -= dt; elapsed += dt;
    if (eventTimes.length && elapsed >= eventTimes[0]) { eventTimes.shift(); triggerEvent(); }
    if (activeEvent && elapsed >= activeEvent.until) {
      const ev = activeEvent; activeEvent = null;
      if (ev.kind === "B") { $("#eventOv").classList.add("hide"); penalty++; say("没藏好，被看到了！-8", "red"); sound.bad(); }
      else if (ev.kind === "E") { bonus++; say("监控没拍到异常。+6", "mint"); sound.good(); }
      else if (ev.obj && !ev.obj.done) { penalty++; ev.obj.el.classList.add("done"); ev.obj.done = true; say("没及时处理！-8", "red"); sound.bad(); }
      hud();
    }
    if (timeLeft <= 5 && Math.ceil(timeLeft) !== Math.ceil(timeLeft + dt)) sound.tick();
    if (timeLeft <= 0) { timeLeft = 0; hud(); finish(null); return; }
    hud();
  }

  function togglePause(force) {
    if (mac.get() === "PLAYING" && force !== false) { mac.set("PAUSED"); $("#pauseOv").classList.remove("hide"); }
    else if (mac.get() === "PAUSED") { mac.set("PLAYING"); $("#pauseOv").classList.add("hide"); }
  }
  $("#pauseBtn").onclick = () => togglePause();
  $("#resumeBtn").onclick = () => togglePause();
  ML.bindPause(mac, togglePause);
  $("#retryBtn").onclick = () => location.reload();
  $$("#sleepOv [data-loc]").forEach(b => b.onclick = () => {
    $("#sleepOv").classList.add("hide");
    const loc = b.dataset.loc;
    const img = $("#pet img");
    img.src = petCfg.petExpressions[loc === "brazen" ? "deadpan" : "sleep"] || petCfg.petAvatar;
    setTimeout(() => finish(loc), 500);
  });

  ML.pet().then(cfg => {
    petCfg = cfg;
    const img = $("#pet img");
    const src = cfg.petExpressions.mischief || cfg.petAvatar;
    if (ML.petId() === "pet001") ML.img(src).then(i => { img.src = ML.cut(i).toDataURL(); }).catch(() => { img.src = src; });
    else img.src = src;
  });

  $("#startBtn").onclick = () => {
    $("#startOv").classList.add("hide");
    let si = 0;
    DEFS.forEach(d => {
      const o = spawn(d, d.sofa ? { x: rand(14, 34), y: rand(40, 50) } : SLOTS[si++]);
      o.need = d.taps || 1;
    });
    eventTimes = [rand(9, 14), rand(24, 30)];
    hud(); mac.set("PLAYING"); last = performance.now();
    requestAnimationFrame(loop);
    say("主人还有 45 秒到家。快收拾！", "yel");
  };
  hud();
})();
</script>
</body>
</html>
