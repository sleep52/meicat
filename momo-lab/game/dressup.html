<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>MOMO 换装室 — MOMO 事务所</title>
<meta name="description" content="给 MOMO 换表情、戴帽子、搭衣服，导出 1080×1350 的成品 PNG。">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/game.css">
<style>
  /* 本页专属布局，不动共享 CSS */
  .dz-wrap{max-width:860px}
  .dz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .dz-col{min-width:0}
  .dz-stage{position:relative;border:var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden;
    background:linear-gradient(#F6F1E7 0 62%,#E7DCC8 62% 100%)}
  #cv{display:block;width:100%;max-width:100%;height:auto;touch-action:none;-webkit-tap-highlight-color:transparent}
  .dz-corner{position:absolute;right:10px;top:10px;background:var(--card);border:var(--bd);border-radius:999px;
    padding:3px 10px;font-size:9px;font-weight:800;letter-spacing:.16em;box-shadow:2px 2px 0 var(--ink)}
  .dz-note{font-size:11px;line-height:1.5;color:var(--mut);margin-top:8px;min-height:16px}
  .dz-note.warn{color:var(--red);font-weight:700}
  /* 横向滚动的分类 chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip-btn{flex:none;border:var(--bd);border-radius:999px;background:#fff;padding:9px 15px;font-size:13px;font-weight:800;
    letter-spacing:.08em;box-shadow:3px 3px 0 rgba(34,34,34,.18);white-space:nowrap;min-height:40px}
  .chip-btn i{font-style:normal;font-size:10px;font-weight:900;color:var(--mut);margin-left:5px}
  .chip-btn.sel{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
  .chip-btn.sel i{color:var(--ink)}
  /* 横向滚动的单品卡片 */
  .items{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .items::-webkit-scrollbar{display:none}
  .item{flex:none;width:94px;border:var(--bd);border-radius:14px;background:#fff;box-shadow:3px 3px 0 rgba(34,34,34,.18);
    padding:7px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(34,34,34,.2)}
  .item.sel{background:var(--pur);box-shadow:3px 3px 0 var(--ink)}
  .item.none{width:62px;justify-content:center;background:var(--bg)}
  .item.none.sel{background:var(--yel)}
  .item .th{width:58px;height:58px;display:grid;place-items:center;background:#fff;border:var(--bd);border-radius:10px;overflow:hidden}
  .item.none .th{background:repeating-linear-gradient(45deg,#fff 0 6px,#EFE9DD 6px 12px)}
  .item .th svg{width:100%;height:100%}
  .item .nm{font-size:12px;font-weight:800;line-height:1.25;text-align:center}
  .item .bdg{font-size:9px;font-weight:900;letter-spacing:.1em;border:1px solid var(--ink);border-radius:999px;padding:0 6px;color:var(--mut)}
  .item .bdg.img{background:var(--mint);color:var(--ink)}
  /* 滑块 */
  .dz-slider{display:grid;grid-template-columns:74px 1fr 42px;align-items:center;gap:10px;margin:8px 0}
  .dz-slider .k{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mut)}
  .dz-slider .v{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
  .dz-slider input[type=range]{width:100%;height:34px;accent-color:var(--ink);background:none}
  .furs{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
  .fur{width:34px;height:34px;border-radius:50%;border:var(--bd);cursor:pointer;box-shadow:2px 2px 0 rgba(34,34,34,.2)}
  .fur.sel{outline:3px solid var(--ink);outline-offset:2px}
  .dz-mini{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5}
  /* 底部动作条：移动端吸底 */
  .dz-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .dz-actions .btn{flex:1 1 auto}
  .dz-actions [data-icon]{display:grid;place-items:center;width:18px;height:18px;flex:none}
  .dz-actions svg{width:18px;height:18px;display:block;flex:none}
  @media(max-width:759px){
    .dz-actions{position:sticky;bottom:0;z-index:35;background:rgba(250,248,243,.96);border-top:var(--bd);
      margin:14px -10px 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  }
  @media(min-width:760px){
    .dz-grid{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);align-items:start;gap:18px}
    .dz-left{position:sticky;top:78px}
    .dz-note{font-size:12px}
  }
</style>
</head>
<body data-page="dressup" data-base="../">

<div class="g-wrap dz-wrap">
  <div class="g-top">
    <a class="icon-btn" href="../games.html" aria-label="返回"><span data-icon="back"></span></a>
    <div class="title">MOMO 换装室<small>创作台 · <span id="whoName">MOMO</span> 主演</small></div>
    <span class="tag yel" id="eqTag">已穿 0 件</span>
  </div>

  <div class="dz-grid">
    <div class="dz-col dz-left">
      <div class="dz-stage" id="stage">
        <canvas id="cv" width="600" height="600" aria-label="换装实时预览画布"></canvas>
        <span class="dz-corner">LIVE · 600</span>
      </div>
      <p class="dz-note" id="note">点下面的卡片给 MOMO 穿戴，所有变化都是实时画在画布上的。</p>
    </div>

    <div class="dz-col dz-right">
      <div class="card ed-sec">
        <span class="label">01 / 分类 · 单品（再点一次脱下）</span>
        <div class="chips" id="chips"></div>
        <div class="items" id="items"></div>
      </div>

      <div class="card ed-sec">
        <span class="label">02 / 体型 · 毛色</span>
        <div class="dz-slider"><span class="k">体型</span><input type="range" id="sBody" min="0.85" max="1.25" step="0.01" value="1.05" aria-label="体型胖瘦"><span class="v" id="vBody">1.05</span></div>
        <div class="dz-slider"><span class="k">头身</span><input type="range" id="sHead" min="0.90" max="1.20" step="0.01" value="1.05" aria-label="头部大小"><span class="v" id="vHead">1.05</span></div>
        <div class="furs" id="furs"></div>
        <div class="ed-row" style="margin-top:12px">
          <button class="ed-btn" id="stickerBtn">表情贴纸：关</button>
          <button class="ed-btn" id="animBtn">待机动画：开</button>
        </div>
        <p class="dz-mini">体型与头身会同时改变耳朵、帽子、衣服、项圈的落点。</p>
      </div>

      <div class="card ed-sec">
        <span class="label">03 / 名牌文案（进导出图）</span>
        <input class="ed-input" id="capText" maxlength="18" placeholder="例如：职业拆家 · 一级拆迁户" aria-label="名牌文案">
        <div class="ed-row" style="margin-top:10px" id="capPresets"></div>
      </div>
    </div>
  </div>

  <div class="dz-actions" id="actions">
    <button class="btn yel" id="randBtn"><span data-icon="shuffle"></span>随机一套</button>
    <button class="btn" id="expBtn"><span data-icon="download"></span>导出 PNG</button>
    <button class="btn mint" id="favBtn">存进收藏</button>
    <button class="btn red small" id="resetBtn">重置</button>
  </div>

  <div class="ov hide" id="ov" style="position:fixed">
    <div class="panel">
      <h2 class="h2" style="font-size:22px">成品图已生成</h2>
      <img class="result-img" id="ovImg" alt="换装成品图">
      <p class="mut" style="font-size:12px" id="ovNote">1080 × 1350 · 手机可长按保存。</p>
      <div class="row">
        <a class="btn yel small" id="ovDl" download="momo-dressup.png">下载 PNG</a>
        <button class="btn small" id="ovClose">继续搭配</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/core.js"></script>
<script>
(() => {
  "use strict";
  const $ = ML.$, $$ = ML.$$, clamp = ML.clamp, pick = ML.pick, sound = ML.sound;
  const LOGICAL = 600, INK = "#222222";
  const stage = $("#stage"), cv = $("#cv"), ctx = cv.getContext("2d");

  /* ---------------- 状态 ---------------- */
  let ITEMS = [];                  // 单品库在下一段填充
  let petCfg = null;
  const exprImgs = {};             // 表情 PNG（可选贴纸）
  const assetImgs = {};            // 单品换图 assets/dressup/<id>.png
  const assetTried = {};
  let dpr = 1, scale = 1, tNow = 0;

  const CATS = [["expr", "表情"], ["head", "头饰"], ["cloth", "衣服"], ["neck", "颈部"], ["hand", "手持"], ["sticker", "贴纸"], ["bg", "背景"]];
  const EXPR_KEYS = ["happy", "angry", "surprised", "innocent", "sleep", "deadpan", "mischief"];
  const FUR_OPTS = ["#E8A857", "#D8B26A", "#8E8E93", "#4A4A4A"];
  const state = {
    eq: { expr: "happy", head: "", cloth: "", neck: "", hand: "", sticker: "", bg: "studio" },
    fur: "#E8A857", bodyFat: 1.05, headWidth: 1.05, earSpread: 1,
    caption: "", cat: "expr", sticker: false, anim: true
  };
  const itemById = id => ITEMS.find(it => it.id === id) || null;
  const equipped = () => CATS.map(([k]) => state.eq[k]).filter(id => id && id !== "none").map(itemById).filter(Boolean);
  const animOn = () => ML.settings.anim && state.anim;

  /* ---------------- 小工具 ---------------- */
  function hx2(h) { h = String(h).replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mixc(a, b, t) { const A = hx2(a), B = hx2(b); return "#" + A.map((v, i) => clamp(Math.round(v + (B[i] - v) * t), 0, 255).toString(16).padStart(2, "0")).join(""); }
  function ink(x, w) { x.lineWidth = w || 5; x.strokeStyle = INK; x.lineJoin = "round"; x.lineCap = "round"; }
  function ell(x, cx, cy, rx, ry, rot) { x.beginPath(); x.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), rot || 0, 0, Math.PI * 2); }
  function fs(x, f) { x.fillStyle = f; x.fill(); x.stroke(); }
  function poly(x, pts) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); }
  function starPath(x, cx, cy, r, n, inner) {
    x.beginPath();
    for (let i = 0; i < n * 2; i++) { const rad = i % 2 ? r * inner : r, a = -Math.PI / 2 + i * Math.PI / n; const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad; i ? x.lineTo(px, py) : x.moveTo(px, py); }
    x.closePath();
  }

  /* ---------------- 换图素材（可选，全部 try/catch） ---------------- */
  function loadAsset(id) {
    if (assetTried[id]) return;
    assetTried[id] = 1;
    try {
      ML.img(ML.asset("assets/dressup/" + id + ".png")).then(img => {
        assetImgs[id] = img; markBadges(); render();
      }).catch(() => { assetImgs[id] = null; markBadges(); });
    } catch (e) { assetImgs[id] = null; }
  }

  /* ---------------- 几何：所有落点跟着滑块走 ---------------- */
  function geo(t) {
    const hw = state.headWidth, bf = state.bodyFat, es = state.earSpread;
    const hx = 300, hy = 238, hrx = 90 * hw, hry = 78 * Math.sqrt(hw);
    const bx = 300, by = 404, brx = 108 * bf, bry = 102 * (0.80 + 0.20 * bf);
    const a = animOn();
    const breathe = a ? Math.sin(t / 640) * 3.2 : 0;
    const wag = a ? Math.sin(t / 480) : 0;
    const s = (t % 4300) / 4300;
    const lid = a && s > 0.955 ? Math.abs(Math.cos((s - 0.955) / 0.045 * Math.PI)) : 1;
    const earOf = side => ({ x: hx + side * hrx * 0.80 * es, y: hy - hry * 0.66 - hrx * 0.52 });
    const A = {
      "head-top": { x: hx, y: hy - hry }, "head": { x: hx, y: hy }, "face": { x: hx, y: hy - hry * 0.04 },
      "ear-L": earOf(-1), "ear-R": earOf(1),
      "neck": { x: hx, y: hy + hry * 0.90 },
      "chest": { x: bx, y: by - bry * 0.34 + breathe },
      "paw-L": { x: bx - brx * 0.44, y: by + bry * 0.76 }, "paw-R": { x: bx + brx * 0.44, y: by + bry * 0.76 },
      "back": { x: bx + brx * 0.86, y: by - bry * 0.44 },
      "cheek": { x: hx + hrx * 0.58, y: hy + hry * 0.26 }, "cheek-L": { x: hx - hrx * 0.58, y: hy + hry * 0.26 },
      "side-L": { x: hx - hrx * 0.98, y: hy - hrx * 0.02 }, "side-R": { x: hx + hrx * 0.98, y: hy - hrx * 0.02 },
      "tail": { x: bx + brx * 0.98, y: by + bry * 0.20 }, "floor": { x: bx, y: by + bry + 8 }
    };
    return {
      hx, hy, hrx, hry, bx, by, brx, bry, hw, bf, es, t, A, breathe, wag, lid,
      eyeY: hy - hry * 0.06, eyeDx: hrx * 0.35, eyeR: hrx * 0.12,
      noseY: hy + hry * 0.26, mouthY: hy + hry * 0.44,
      fur: state.fur, dark: mixc(state.fur, "#000000", 0.22), light: mixc(state.fur, "#FFFFFF", 0.30),
      belly: mixc(state.fur, "#FFFFFF", 0.66), inner: mixc(state.fur, "#F16D5B", 0.45),
      anchor(n) { return A[n] || A.chest; }
    };
  }

  /* ---------------- 表情：程序化五官 ---------------- */
  const FACE = {
    none: { eye: "round", brow: 0, mouth: "soft" },
    happy: { eye: "up", brow: 0, mouth: "open" },
    angry: { eye: "sharp", brow: -1, mouth: "frown" },
    surprised: { eye: "wide", brow: 1, mouth: "o" },
    innocent: { eye: "big", brow: 0.5, mouth: "tiny" },
    sleep: { eye: "down", brow: 0, mouth: "line" },
    deadpan: { eye: "half", brow: 0.25, mouth: "line" },
    mischief: { eye: "wink", brow: -0.4, mouth: "smirk" }
  };
  function pupil(x, cx, cy, rx, ry) {
    x.fillStyle = INK; ell(x, cx, cy, rx, ry); x.fill();
    x.fillStyle = "#fff"; ell(x, cx - rx * 0.32, cy - ry * 0.34, rx * 0.3, ry * 0.28); x.fill();
  }
  function eyeUp(x, cx, cy, r) { x.beginPath(); x.arc(cx, cy + r * 0.5, r * 1.2, Math.PI * 1.1, Math.PI * 1.9); x.stroke(); }
  function eyeDown(x, cx, cy, r) { x.beginPath(); x.arc(cx, cy - r * 0.5, r * 1.2, Math.PI * 0.1, Math.PI * 0.9); x.stroke(); }
  function eyeLine(x, cx, cy, r) { x.beginPath(); x.moveTo(cx - r * 1.15, cy); x.lineTo(cx + r * 1.15, cy); x.stroke(); }
  function drawEyes(x, g, kind) {
    const ey = g.eyeY, dx = g.eyeDx, r = g.eyeR, L = g.hx - dx, R = g.hx + dx, lid = g.lid;
    ink(x, 4.5);
    const shut = lid < 0.3;
    if (kind === "up" || kind === "down") { (kind === "up" ? eyeUp : eyeDown)(x, L, ey, r); (kind === "up" ? eyeUp : eyeDown)(x, R, ey, r); return; }
    if (kind === "wink") { eyeUp(x, L, ey, r); pupil(x, R, ey, r * 0.9, r * (shut ? 0.14 : 1)); return; }
    if (shut) { eyeLine(x, L, ey, r); eyeLine(x, R, ey, r); return; }
    if (kind === "wide") {
      [L, R].forEach(cx => { x.fillStyle = "#fff"; ell(x, cx, ey, r * 1.5, r * 1.55 * lid); x.fill(); x.stroke(); pupil(x, cx, ey, r * 0.72, r * 0.86 * lid); });
      return;
    }
    if (kind === "big") {
      [L, R].forEach(cx => {
        x.fillStyle = "#fff"; ell(x, cx, ey, r * 1.7, r * 1.8 * lid); x.fill(); x.stroke();
        pupil(x, cx, ey + r * 0.1, r * 1.02, r * 1.12 * lid);
        x.fillStyle = "#fff"; ell(x, cx + r * 0.5, ey - r * 0.7, r * 0.34, r * 0.3); x.fill();
      });
      return;
    }
    if (kind === "sharp") {
      [L, R].forEach((cx, i) => { const sgn = i ? 1 : -1; pupil(x, cx, ey, r * 0.85, r * 0.6); x.beginPath(); x.moveTo(cx - sgn * r * 1.6, ey - r * 1.5); x.lineTo(cx + sgn * r * 0.9, ey - r * 0.5); x.stroke(); });
      return;
    }
    if (kind === "half") {
      [L, R].forEach(cx => {
        pupil(x, cx, ey, r * 0.8, r * 0.9);
        x.fillStyle = g.fur; x.beginPath(); x.rect(cx - r * 1.4, ey - r * 1.6, r * 2.8, r * 0.85); x.fill();
        x.beginPath(); x.moveTo(cx - r * 1.3, ey - r * 0.7); x.lineTo(cx + r * 1.3, ey - r * 0.7); x.stroke();
      });
      return;
    }
    [L, R].forEach(cx => pupil(x, cx, ey, r * 0.8, r * (0.95 * lid)));
  }
  function drawMouth(x, g, kind) {
    const nx = g.hx, my = g.mouthY, w = g.hrx * 0.2;
    ink(x, 4);
    if (kind === "open") {
      x.beginPath(); x.moveTo(nx - w, my - w * .2); x.quadraticCurveTo(nx, my + w * 1.1, nx + w, my - w * .2); x.closePath();
      x.fillStyle = INK; x.fill(); x.stroke();
      x.fillStyle = "#F16D5B"; x.beginPath(); x.ellipse(nx, my + w * 0.35, w * 0.45, w * 0.3, 0, 0, 7); x.fill();
      return;
    }
    if (kind === "frown") { x.beginPath(); x.arc(nx - w * .55, my + w * .55, w * .6, Math.PI * 1.15, Math.PI * 1.9); x.arc(nx + w * .55, my + w * .55, w * .6, Math.PI * 1.1, Math.PI * 1.85); x.stroke(); return; }
    if (kind === "o") { x.fillStyle = INK; ell(x, nx, my + w * .3, w * .5, w * .62); x.fill(); x.stroke(); return; }
    if (kind === "line") { x.beginPath(); x.moveTo(nx - w * .8, my + w * .3); x.lineTo(nx + w * .8, my + w * .3); x.stroke(); return; }
    if (kind === "tiny") { x.beginPath(); x.arc(nx, my, w * .3, Math.PI * 0.15, Math.PI * 0.85); x.stroke(); return; }
    if (kind === "smirk") { x.beginPath(); x.moveTo(nx - w * .8, my); x.quadraticCurveTo(nx + w * .5, my + w * .7, nx + w * 1.05, my - w * .45); x.stroke(); return; }
    x.beginPath(); x.arc(nx - w * .5, my, w * .55, Math.PI * 0.12, Math.PI * 0.9); x.arc(nx + w * .5, my, w * .55, Math.PI * 0.1, Math.PI * 0.88); x.stroke();
  }
  function drawFace(x, g) {
    const key = state.eq.expr && FACE[state.eq.expr] ? state.eq.expr : "none";
    const f = FACE[key];
    // 鼻子 + 口吻
    x.save(); ink(x, 4);
    x.fillStyle = mixc(g.inner, "#F16D5B", 0.4);
    poly(x, [[g.hx - g.hrx * 0.09, g.noseY - g.hry * 0.05], [g.hx + g.hrx * 0.09, g.noseY - g.hry * 0.05], [g.hx, g.noseY + g.hry * 0.06]]);
    x.fill(); x.stroke(); x.restore();
    drawEyes(x, g, f.eye);
    drawMouth(x, g, f.mouth);
    if (f.brow) {
      ink(x, 4); const dy = f.brow * g.hry * 0.16;
      [-1, 1].forEach(s => { const cx = g.hx + s * g.eyeDx, cy = g.eyeY - g.eyeR * 2.1;
        x.beginPath(); x.moveTo(cx - s * g.eyeR * 1.2, cy + dy); x.lineTo(cx + s * g.eyeR * 1.2, cy - dy); x.stroke(); });
    }
    // 胡须
    ink(x, 3);
    [-1, 1].forEach(s => {
      for (let i = 0; i < 3; i++) {
        const y0 = g.hy + g.hry * (0.14 + i * 0.13), x0 = g.hx + s * g.hrx * 0.42;
        x.beginPath(); x.moveTo(x0, y0); x.quadraticCurveTo(x0 + s * g.hrx * 0.5, y0 - g.hry * 0.06 + i * 4, x0 + s * g.hrx * 0.92, y0 - g.hry * 0.14 + i * 9); x.stroke();
      }
    });
    if (key === "sleep" && animOn()) {
      x.fillStyle = INK; x.font = '900 26px "PingFang SC","Microsoft YaHei",Arial,sans-serif'; x.textAlign = "left";
      const p = (g.t % 2600) / 2600;
      x.globalAlpha = 0.85; x.fillText("z", g.hx + g.hrx * 0.9, g.hy - g.hry * 0.9 - p * 34);
      x.font = '900 18px "PingFang SC","Microsoft YaHei",Arial,sans-serif'; x.fillText("z", g.hx + g.hrx * 1.2, g.hy - g.hry * 1.2 - p * 30); x.globalAlpha = 1;
    }
  }
  function drawFaceSticker(x, g) {
    const im = exprImgs[state.eq.expr];
    if (!im || !state.sticker) return;
    const a = g.anchor("ear-R"), s = 92;

    $("#ovNote").textContent = fallback
      ? "已改用「自绘」图层导出：本机素材图片被浏览器安全策略拦下（常见于 file:// 打开）。"
      : "1080 × 1350 · 手机可长按图片保存。";
    if (url) $("#ovImg").src = url; else $("#ovImg").removeAttribute("src");
    $("#ovDl").href = url || "#"; $("#ovDl").download = name;
    $("#ov").classList.remove("hide");
  }
  function doDownload() {
    const r = makePNG();
    const name = "momo-dressup-" + Date.now() + ".png";
    if (!r.url) { setNote("当前浏览器不允许把画布导出成 PNG（画布被安全策略锁住）。可以截图，或用本地服务器打开本页。", true); sound.bad(); return; }
    try {
      const a = document.createElement("a"); a.href = r.url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { setNote("自动下载被拦截，请点弹窗里的「下载 PNG」。", true); }
    showOv(r.url, name, r.fallback); sound.good(); queueInteraction();
  }
  function saveToFav() {
    const r = makePNG();
    if (!r.url) { setNote("收藏失败：这台设备上的画布无法导出 PNG。", true); sound.bad(); return; }
    const work = {
      id: "dressup-" + Date.now(), game: "dressup", gameName: "换装室",
      title: "换装室 · " + comboName(), score: 0, rating: "满分喵",
      time: dateStr(), png: r.url
    };
    let ok = false;
    try {
      ML.addWork(work);
      ok = ML.works().some(w => w.id === work.id);   // 真的写进去了才算成功
    } catch (e) { ok = false; }
    if (!ok) { setNote("收藏没存下：1080×1350 的图太大，本机存储写不进去。可以先点「导出 PNG」自己保存图片。", true); sound.bad(); return; }
    try { ML.patchStats({ outfitsMade: 1 }); } catch (e) { setNote("作品已存下，但「换装套数」统计没写进去。", true); }
    try { ML.floatSticker(stage, "已存进收藏", stage.clientWidth * 0.5 - 46, stage.clientHeight * 0.14); } catch (e) {}
    setNote("已存进收藏：" + work.title + (r.fallback ? "（自绘导出）" : "") + "，到「收藏」页可以看大图。", false);
    sound.win(); queueInteraction();
  }

  /* ---------------- 记忆 / 重置 ---------------- */
  const KEY = "ml-dressup";
  let saveT = 0;
  function persistSoon() { clearTimeout(saveT); saveT = setTimeout(persistNow, 420); }
  function persistNow() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        v: 1, eq: state.eq, fur: state.fur, bodyFat: state.bodyFat, headWidth: state.headWidth,
        earSpread: state.earSpread, caption: state.caption, sticker: state.sticker, anim: state.anim, cat: state.cat
      }));
    } catch (e) { setNote("这套搭配没能记住：本机存储不可用，下次打开会回到默认。", true); }
  }
  function restore() {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return false;
    if (o.eq && typeof o.eq === "object") CATS.forEach(([k]) => {
      const id = o.eq[k];
      if (k === "bg") state.eq.bg = itemById(id) ? id : "studio";
      else if (typeof id === "string") state.eq[k] = (id === "" || id === "none" || itemById(id)) ? id : "";
    });
    if (FUR_OPTS.indexOf(o.fur) >= 0) state.fur = o.fur;
    if (typeof o.bodyFat === "number") state.bodyFat = clamp(o.bodyFat, 0.85, 1.25);
    if (typeof o.headWidth === "number") state.headWidth = clamp(o.headWidth, 0.9, 1.2);
    if (typeof o.earSpread === "number") state.earSpread = clamp(o.earSpread, 0.6, 1.6);
    if (typeof o.caption === "string") state.caption = o.caption.slice(0, 18);
    state.sticker = !!o.sticker; state.anim = o.anim !== false;
    if (CATS.some(([k]) => k === o.cat)) state.cat = o.cat;
    setNote("已恢复上次在换装室的搭配。", false);
    return true;
  }
  function resetAll() {
    state.eq = { expr: "happy", head: "", cloth: "", neck: "", hand: "", sticker: "", bg: "studio" };
    state.caption = ""; state.sticker = false; state.anim = true; state.cat = "expr";
    const sp = (petCfg && petCfg.shapeParams) || {};
    state.fur = (petCfg && petCfg.furColor && FUR_OPTS.indexOf(petCfg.furColor) >= 0) ? petCfg.furColor : FUR_OPTS[0];
    state.bodyFat = clamp(typeof sp.bodyFat === "number" ? sp.bodyFat : 1.05, 0.85, 1.25);
    state.headWidth = clamp(typeof sp.headWidth === "number" ? sp.headWidth : 1.05, 0.9, 1.2);
    state.earSpread = clamp(typeof sp.earSpread === "number" ? sp.earSpread : 1, 0.6, 1.6);
    try { localStorage.removeItem(KEY); } catch (e) { setNote("存储不可用，重置只作用于当前页面。", true); }
    els.capText.value = "";
    sound.bad(); flashNote("已恢复到角色默认样子。");
    buildChips(); buildItems(); buildFurs(); buildCaps(); syncToggles();
    els.sBody.value = String(state.bodyFat); els.vBody.textContent = state.bodyFat.toFixed(2);
    els.sHead.value = String(state.headWidth); els.vHead.textContent = state.headWidth.toFixed(2);
    render();
  }

  /* ---------------- 表情原图（可选贴纸） ---------------- */
  let exprImgLoaded = false;
  function loadExprImgs() {
    if (exprImgLoaded || !petCfg) return;
    exprImgLoaded = true;
    const map = petCfg.petExpressions || {};
    EXPR_KEYS.forEach(k => {
      if (!map[k] || exprImgs[k]) return;
      try {
        ML.img(map[k]).then(i => { exprImgs[k] = i; if (state.sticker) render(); }).catch(() => { exprImgs[k] = null; });
      } catch (e) { exprImgs[k] = null; }
    });
  }

  /* ---------------- 待机循环 ---------------- */
  let lastLoop = 0;
  function loop(ts) {
    tNow = ts || 0;
    if (animOn() && tNow - lastLoop > 33) { lastLoop = tNow; render(); }
    requestAnimationFrame(loop);
  }

  /* ---------------- 启动 ---------------- */
  const restored = restore();
  $("#randBtn").onclick = randomOutfit;
  $("#expBtn").onclick = doDownload;
  $("#favBtn").onclick = saveToFav;
  $("#resetBtn").onclick = resetAll;
  $("#ovClose").onclick = () => { $("#ov").classList.add("hide"); sound.tap(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("#ov").classList.add("hide"); });
  equipped().forEach(it => loadAsset(it.id));   // 其余分类在 buildItems() 里懒加载
  wireUI();
  size();
  window.addEventListener("resize", size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(stage);
  requestAnimationFrame(loop);

  ML.pet().then(cfg => {
    petCfg = cfg;
    els.whoName.textContent = (cfg.petName || "MOMO") + " 主演";
    const sp = cfg.shapeParams || {};
    if (!restored) {
      if (cfg.furColor) state.fur = FUR_OPTS.indexOf(cfg.furColor) >= 0 ? cfg.furColor : FUR_OPTS[0];
      if (typeof sp.bodyFat === "number") state.bodyFat = clamp(sp.bodyFat, 0.85, 1.25);
      if (typeof sp.headWidth === "number") state.headWidth = clamp(sp.headWidth, 0.9, 1.2);
      if (typeof sp.earSpread === "number") state.earSpread = clamp(sp.earSpread, 0.6, 1.6);
      els.sBody.value = String(state.bodyFat); els.vBody.textContent = state.bodyFat.toFixed(2);
      els.sHead.value = String(state.headWidth); els.vHead.textContent = state.headWidth.toFixed(2);
      buildFurs();
    }
    buildCaps();
    loadExprImgs();
    render(); persistSoon();
    setNote((cfg.petDescription ? "角色设定：" + cfg.petDescription + " · " : "") + "换好之后点「导出 PNG」拿 1080×1350 成图。", false);
  }).catch(() => {
    setNote("宠物资料读取失败，用默认角色 MOMO 继续搭配。", true);
    render();
  });
})();
</script>
</body>
</html>
