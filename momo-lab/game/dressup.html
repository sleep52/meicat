<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>MOMO 换装室 — MOMO 事务所</title>
<meta name="description" content="给自己家的真猫试穿实物照片服装和道具，导出 1080×1350 的成品 PNG。">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/game.css">
<style>
  /* 本页专属布局，不动共享 CSS */
  .dz-wrap{max-width:860px}
  .dz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .dz-col{min-width:0}
  .dz-stage{position:relative;border:var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden;
    background:linear-gradient(#F6F1E7 0 62%,#E7DCC8 62% 100%)}
  #cv{display:block;width:100%;max-width:100%;height:auto;-webkit-tap-highlight-color:transparent}
  .dz-corner{position:absolute;right:10px;top:10px;background:var(--card);border:var(--bd);border-radius:999px;
    padding:3px 10px;font-size:9px;font-weight:800;letter-spacing:.16em;box-shadow:2px 2px 0 var(--ink)}
  .dz-note{font-size:11px;line-height:1.5;color:var(--mut);margin-top:8px;min-height:16px}
  .dz-note.warn{color:var(--red);font-weight:700}
  /* 横向滚动的分类 chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip-btn{flex:none;border:var(--bd);border-radius:999px;background:#fff;padding:9px 15px;font-size:13px;font-weight:800;
    letter-spacing:.08em;box-shadow:3px 3px 0 rgba(34,34,34,.18);white-space:nowrap;min-height:40px}
  .chip-btn i{font-style:normal;font-size:10px;font-weight:900;color:var(--mut);margin-left:5px}
  .chip-btn.sel{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
  .chip-btn.sel i{color:var(--ink)}
  /* 横向滚动的单品卡片 */
  .items{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .items::-webkit-scrollbar{display:none}
  .item{flex:none;width:94px;border:var(--bd);border-radius:14px;background:#fff;box-shadow:3px 3px 0 rgba(34,34,34,.18);
    padding:7px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(34,34,34,.2)}
  .item.sel{background:var(--pur);box-shadow:3px 3px 0 var(--ink)}
  .item.none{width:62px;justify-content:center;background:var(--bg)}
  .item.none.sel{background:var(--yel)}
  .item .th{width:58px;height:58px;display:grid;place-items:center;background:#fff;border:var(--bd);border-radius:10px;overflow:hidden}
  .item.none .th{background:repeating-linear-gradient(45deg,#fff 0 6px,#EFE9DD 6px 12px)}
  .item .th svg{width:100%;height:100%}
  .item .th img{width:100%;height:100%;object-fit:contain;background:#FCEEF2}
  .item .nm{font-size:12px;font-weight:800;line-height:1.25;text-align:center}
  .item .bdg{font-size:9px;font-weight:900;letter-spacing:.1em;border:1px solid var(--ink);border-radius:999px;padding:0 6px;color:var(--mut)}
  .item .bdg.img{background:var(--mint);color:var(--ink)}
  /* 滑块 */
  .dz-slider{display:grid;grid-template-columns:74px 1fr 42px;align-items:center;gap:10px;margin:8px 0}
  .dz-slider .k{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mut)}
  .dz-slider .v{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
  .dz-slider input[type=range]{width:100%;height:34px;accent-color:var(--ink);background:none}
  .dz-mini{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5}
  /* 底部动作条：移动端吸底 */
  .dz-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .dz-actions .btn{flex:1 1 auto}
  .dz-actions [data-icon]{display:grid;place-items:center;width:18px;height:18px;flex:none}
  .dz-actions svg{width:18px;height:18px;display:block;flex:none}
  @media(max-width:759px){
    .dz-actions{position:sticky;bottom:0;z-index:35;background:rgba(250,248,243,.96);border-top:var(--bd);
      margin:14px -10px 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  }
  @media(min-width:760px){
    .dz-grid{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);align-items:start;gap:18px}
    .dz-left{position:sticky;top:78px}
    .dz-note{font-size:12px}
  }
</style>
</head>
<body data-page="dressup" data-base="../">

<div class="g-wrap dz-wrap">
  <div class="g-top">
    <a class="icon-btn" href="../games.html" aria-label="返回"><span data-icon="back"></span></a>
    <div class="title">MOMO 换装室<small>创作台 · <span id="whoName">MOMO</span> 主演</small></div>
    <span class="tag yel" id="eqTag">已穿 0 件</span>
  </div>

  <div class="dz-grid">
    <div class="dz-col dz-left">
      <div class="dz-stage" id="stage">
        <canvas id="cv" width="600" height="600" aria-label="换装实时预览画布"></canvas>
        <span class="dz-corner">LIVE · 600</span>
      </div>
      <p class="dz-note" id="note">点下面的卡片给真猫穿戴：服装和道具都是实物照片，直接贴在家猫的分层照片上。</p>
    </div>

    <div class="dz-col dz-right">
      <div class="card ed-sec">
        <span class="label">01 / 分类 · 单品（再点一次脱下）</span>
        <div class="chips" id="chips"></div>
        <div class="items" id="items"></div>
      </div>

      <div class="card ed-sec">
        <span class="label">02 / 姿态 · 待机</span>
        <div class="dz-slider"><span class="k">大小</span><input type="range" id="sScale" min="0.80" max="1.20" step="0.01" value="1.00" aria-label="整体大小"><span class="v" id="vScale">1.00</span></div>
        <div class="dz-slider"><span class="k">压扁</span><input type="range" id="sSquash" min="0" max="1" step="0.01" value="0" aria-label="身体压扁"><span class="v" id="vSquash">0.00</span></div>
        <div class="dz-slider"><span class="k">歪身</span><input type="range" id="sLean" min="-0.20" max="0.20" step="0.01" value="0" aria-label="身体倾斜"><span class="v" id="vLean">0.00</span></div>
        <div class="dz-slider"><span class="k">歪头</span><input type="range" id="sTilt" min="-0.25" max="0.25" step="0.01" value="0" aria-label="头部旋转"><span class="v" id="vTilt">0.00</span></div>
        <div class="dz-slider"><span class="k">炸毛</span><input type="range" id="sPuff" min="0" max="1" step="0.01" value="0" aria-label="尾巴炸毛"><span class="v" id="vPuff">0.00</span></div>
        <div class="dz-slider"><span class="k">闭眼</span><input type="range" id="sBlink" min="0" max="1" step="0.01" value="0" aria-label="闭眼量"><span class="v" id="vBlink">0.00</span></div>
        <div class="dz-slider"><span class="k">张嘴</span><input type="range" id="sMouth" min="0" max="1" step="0.01" value="0" aria-label="张嘴量"><span class="v" id="vMouth">0.00</span></div>
        <div class="ed-row" style="margin-top:12px">
          <button class="ed-btn" id="animBtn">待机动画：开</button>
          <button class="ed-btn" id="poseBtn">姿态归零</button>
        </div>
        <p class="dz-mini">照片猫改不了毛色和体型，所以这里只动布偶的真实关节：歪头会带着帽子和围巾一起转，压扁会带着衣服一起缩。</p>
      </div>

      <div class="card ed-sec">
        <span class="label">03 / 名牌文案（进导出图）</span>
        <input class="ed-input" id="capText" maxlength="18" placeholder="例如：职业拆家 · 一级拆迁户" aria-label="名牌文案">
        <div class="ed-row" style="margin-top:10px" id="capPresets"></div>
      </div>
    </div>
  </div>

  <div class="dz-actions" id="actions">
    <button class="btn yel" id="randBtn"><span data-icon="shuffle"></span>随机一套</button>
    <button class="btn" id="expBtn"><span data-icon="download"></span>导出 PNG</button>
    <button class="btn mint" id="favBtn">存进收藏</button>
    <button class="btn red small" id="resetBtn">重置</button>
  </div>

  <div class="ov hide" id="ov" style="position:fixed">
    <div class="panel">
      <h2 class="h2" style="font-size:22px">成品图已生成</h2>
      <img class="result-img" id="ovImg" alt="换装成品图">
      <p class="mut" style="font-size:12px" id="ovNote">1080 × 1350 · 手机可长按保存。</p>
      <div class="row">
        <a class="btn yel small" id="ovDl" download="momo-dressup.png">下载 PNG</a>
        <button class="btn small" id="ovClose">继续搭配</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/core.js"></script>
<script src="../js/cat-rig.js"></script>
<script>
(() => {
  "use strict";
  const $ = ML.$, $$ = ML.$$, clamp = ML.clamp, pick = ML.pick, sound = ML.sound;
  const LOGICAL = 600, INK = "#222222";
  const stage = $("#stage"), cv = $("#cv"), ctx = cv.getContext("2d");

  /* ---------------- 状态 ---------------- */
  let ITEMS = [];                     // 单品库在下面装配
  let petCfg = null, rigReady = false, curP = null;
  const PHOTOS = {};                  // "assets/props/snack-fish.png" -> 已解码的实物照片
  let dpr = 1, scale = 1, tNow = 0;

  const CATS = [["expr", "表情"], ["head", "头饰"], ["cloth", "衣服"], ["neck", "颈部"], ["hand", "道具"], ["sticker", "贴纸"], ["bg", "背景"]];
  const POSE0 = { scale: 1, squash: 0, lean: 0, tilt: 0, puff: 0, blink: 0, mouth: 0 };
  const POSE_RANGE = { scale: [.8, 1.2], squash: [0, 1], lean: [-.2, .2], tilt: [-.25, .25], puff: [0, 1], blink: [0, 1], mouth: [0, 1] };
  const state = {
    eq: { expr: "plain", head: "", cloth: "", neck: "", hand: "", sticker: "", bg: "studio" },
    pose: Object.assign({}, POSE0), caption: "", cat: "expr", anim: true
  };
  const itemById = id => ITEMS.find(it => it.id === id) || null;
  const equipped = () => CATS.map(([k]) => state.eq[k]).filter(id => id && id !== "plain").map(itemById).filter(Boolean);
  const animOn = () => ML.settings.anim && state.anim;

  /* ---------------- 小工具 ---------------- */
  function ink(x, w) { x.lineWidth = w || 5; x.strokeStyle = INK; x.lineJoin = "round"; x.lineCap = "round"; }
  function ell(x, cx, cy, rx, ry, rot) { x.beginPath(); x.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), rot || 0, 0, Math.PI * 2); }
  function poly(x, pts) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); }
  function starPath(x, cx, cy, r, n, inner) {
    x.beginPath();
    for (let i = 0; i < n * 2; i++) { const rad = i % 2 ? r * inner : r, a = -Math.PI / 2 + i * Math.PI / n; const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad; i ? x.lineTo(px, py) : x.moveTo(px, py); }
    x.closePath();
  }

  /* ---------------- 舞台盒：把 480×560 的真猫布偶塞进 600 逻辑坐标 ---------------- */
  const BOX = CatRig.box(140, 150, 320);   // s=.667：脚落在逻辑 y≈499，尾巴尖 x≈452，全在框里
  const PART = { body: CatRig.P_BODY, head: CatRig.P_HEAD, tail: CatRig.P_TAIL };

  function rigPose(t) {
    const a = animOn(), ph = a ? (t % 4300) / 4300 : 0;
    const autoBlink = a && ph > 0.955 ? Math.abs(Math.cos((ph - 0.955) / 0.045 * Math.PI)) : 0;
    const ef = (itemById(state.eq.expr) || {}).face || {};
    const k = state.pose.scale;
    return CatRig.pose({
      x: 0, y: 244 * (1 - k), scale: k,          // 缩放绕脚底而不是画布中心，脚才不会飘
      breathe: a ? Math.sin(t / 640) : 0,
      bodyRot: state.pose.lean, bodySquash: state.pose.squash,
      headRot: state.pose.tilt + (ef.tilt || 0),
      blink: Math.max(state.pose.blink, ef.blink || 0, autoBlink),
      mouth: Math.max(state.pose.mouth, ef.mouth || 0),
      tailRot: -.12, tailWag: a ? Math.sin(t / 470) * .16 : 0, tailPuff: state.pose.puff
    });
  }
  /* cat-rig 的 tf() 是内部函数，这里按发布出来的 P_BODY/P_HEAD/P_TAIL 复刻一份，服装才算得出同一个变形 */
  function rigTf(P) {
    const br = 1 + .018 * P.breathe;
    return {
      body: { sx: PART.body.s * (1 - .012 * P.breathe) * (1 + P.bodySquash * .1), sy: PART.body.s * (1 - P.bodySquash * .12) * br, rot: P.bodyRot, dx: 0, dy: 0 },
      tail: { sx: PART.tail.s * (1 + P.tailPuff * .35), sy: PART.tail.s * (1 + P.tailPuff * .35), rot: P.tailRot + P.tailWag, dx: 0, dy: 0 },
      head: { sx: PART.head.s * P.headSquash, sy: PART.head.s * (2 - P.headSquash) * br, rot: P.headRot, dx: P.headX, dy: P.headY }
    };
  }
  /* 复刻 apply(part,t)：平移到关节 → 旋转 → 非等比缩放 → 退回锚点。
   * stageSpace=true 时改成绕关节按同比例变形，给按舞台坐标画的贴纸用。 */
  function partXf(x, part, t, stageSpace) {
    x.translate(part.at[0] + t.dx, part.at[1] + t.dy);
    if (t.rot) x.rotate(t.rot);
    x.scale(stageSpace ? t.sx / part.s : t.sx, stageSpace ? t.sy / part.s : t.sy);
    if (stageSpace) x.translate(-part.at[0], -part.at[1]);
    else x.translate(-part.anchor[0], -part.anchor[1]);
  }
  /* 服装的 at 写舞台坐标，这里换成宿主图片坐标：pin 与部件缩放绑定，resize 后依旧对齐 */
  const toPart = (part, sx, sy) => [part.anchor[0] + (sx - part.at[0]) / part.s, part.anchor[1] + (sy - part.at[1]) / part.s];

  function drawShadow(x, P) {
    x.save(); x.globalAlpha = .28 * P.shadow; x.fillStyle = "#4a3a22";
    x.beginPath(); x.ellipse(240, 518, 134 * P.shadow, 21, 0, 0, Math.PI * 2); x.fill(); x.restore();
  }
  function drawRigLayer(x, part, t) {
    const im = CatRig.imgs[part.img]; if (!im) return;
    x.save(); partXf(x, part, t); x.drawImage(im, 0, 0, part.size[0], part.size[1]); x.restore();
  }
  function drawFacePatch(x, name, alpha) {
    const f = CatRig.P_FACE[name], im = CatRig.imgs[name]; if (!im) return;
    if (alpha !== undefined) x.globalAlpha = alpha;
    x.drawImage(im, f.at[0] - f.anchor[0], f.at[1] - f.anchor[1], f.size[0] * f.f, f.size[1] * f.f);
    if (alpha !== undefined) x.globalAlpha = 1;
  }
  function drawHeadLayer(x, P, t) {
    const im = CatRig.imgs.head; if (!im) return;
    x.save(); partXf(x, PART.head, t);
    x.drawImage(im, 0, 0, PART.head.size[0], PART.head.size[1]);
    drawFacePatch(x, "eyes-open");
    if (P.blink > .01) drawFacePatch(x, "eyes-closed", P.blink);
    if (P.mouth > .01) drawFacePatch(x, "mouth-open", P.mouth);
    x.restore();
  }
  /* body 图下半截是两只前爪；衣服围巾盖完再补画一次，爪子才不会消失在毛衣里 */
  function drawPaws(x, t) {
    const im = CatRig.imgs.body; if (!im) return;
    x.save(); partXf(x, PART.body, t);
    x.drawImage(im, 100, 440, 250, 88, 100, 440, 250, 88);
    x.restore();
  }
  function drawWear(x, it, T) {
    const im = PHOTOS[it.file]; if (!im) return;
    const host = it.host === "head" ? "head" : "body", part = PART[host], t = T[host];
    const nw = im.naturalWidth || im.width, nh = im.naturalHeight || im.height, c = it.crop || [0, 0, 1, 1];
    const sw = (c[2] - c[0]) * nw, sh = (c[3] - c[1]) * nh, dw = it.w / part.s, dh = dw * sh / sw;
    const p = toPart(part, it.at[0], it.at[1]);
    x.save(); partXf(x, part, t);
    if (it.rot) { x.translate(p[0], p[1]); x.rotate(it.rot); x.translate(-p[0], -p[1]); }
    x.drawImage(im, c[0] * nw, c[1] * nh, sw, sh, p[0] - (it.u || .5) * dw, p[1] - (it.v || .5) * dh, dw, dh);
    x.restore();
  }
  function drawSticker(x, it, T) {
    const host = it.host === "head" ? "head" : "body";
    x.save(); partXf(x, PART[host], T[host], true); it.draw(x); x.restore();
  }
  /* 分层顺序 = 真实遮挡：影子 → 身体 → 衣服 → 围巾领结（挂头上但画在头之前，让下巴毛压住巾角）→
   * 前爪 → 尾巴 → 头和五官 → 帽子 → 道具 → 贴纸。 */
  function drawScene(x, opt) {
    opt = opt || {};
    const P = curP = rigPose(opt.t == null ? tNow : opt.t);
    const T = rigTf(P);
    const wear = cat => equipped().filter(it => it.cat === cat).forEach(it => (it.draw ? drawSticker(x, it, T) : drawWear(x, it, T)));
    x.save();
    x.beginPath(); x.rect(0, 0, LOGICAL, LOGICAL); x.clip();
    const bg = itemById(state.eq.bg);
    if (bg) bg.draw(x); else { x.fillStyle = "#FAF8F3"; x.fillRect(0, 0, LOGICAL, LOGICAL); }
    if (!rigReady) {
      x.fillStyle = INK; x.font = '900 22px "PingFang SC","Microsoft YaHei",Arial,sans-serif';
      x.textAlign = "center"; x.fillText("真猫素材加载中…", LOGICAL / 2, LOGICAL / 2);
      x.restore(); return P;
    }
    x.save();
    x.translate(BOX.gx, BOX.gy); x.scale(BOX.s, BOX.s);
    x.translate(CatRig.STAGE_W / 2 + P.x, CatRig.STAGE_H / 2 + P.y); x.scale(P.scale, P.scale);
    x.translate(-CatRig.STAGE_W / 2, -CatRig.STAGE_H / 2);
    drawShadow(x, P);
    drawRigLayer(x, PART.body, T.body);
    wear("cloth"); wear("neck");
    drawPaws(x, T.body);
    drawRigLayer(x, PART.tail, T.tail);
    drawHeadLayer(x, P, T.head);
    wear("head"); wear("hand"); wear("sticker");
    x.restore();
    x.restore();
    return P;
  }
  function render() {
    const k = dpr * scale;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawScene(ctx, { t: tNow });
    hudTag();
  }
  function size() {
    const w = Math.max(240, stage.clientWidth || 360);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    scale = w / LOGICAL;
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
    render();
  }

  /* ---------------- 单品库：服装道具都是实物照片，at 一律写 480×560 舞台坐标 ---------------- */
  const SV = b => `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${b}</svg>`;
  const PH_SVG = SV('<rect x="7" y="11" width="34" height="26" rx="4"/><circle cx="17" cy="20" r="3"/><path d="M9 33l10-8 7 6 5-4 8 6"/>');
  ITEMS = [
    /* ---- 表情：照片猫只能切五官贴片和头姿，所以这一栏是姿态预设而不是画脸 ---- */
    { id: "plain", cat: "expr", name: "默认脸", face: {},
      svg: SV('<circle cx="17" cy="21" r="2.6" fill="#222"/><circle cx="31" cy="21" r="2.6" fill="#222"/><path d="M20 31c3 2.5 6 2.5 8 0"/>') },
    { id: "part", cat: "expr", name: "轻声喵", face: { mouth: .35 },
      svg: SV('<circle cx="17" cy="21" r="2.6" fill="#222"/><circle cx="31" cy="21" r="2.6" fill="#222"/><ellipse cx="24" cy="31" rx="3.5" ry="2.6" fill="#222"/>') },
    { id: "open", cat: "expr", name: "大声喵", face: { mouth: 1 },
      svg: SV('<path d="M13 19c2-3 6-3 8 0M27 19c2-3 6-3 8 0"/><ellipse cx="24" cy="31" rx="6" ry="6.5" fill="#222"/>') },
    { id: "shut", cat: "expr", name: "闭眼", face: { blink: 1 },
      svg: SV('<path d="M13 22c2 4 6 4 8 0M27 22c2 4 6 4 8 0"/><path d="M20 32c3 2 6 2 8 0"/>') },
    { id: "half", cat: "expr", name: "半眯眼", face: { blink: .55 },

  /* 批量写 ml-stats：一次搭配只落一次 */
  function queueInteraction() {
    pendingI++;
    clearTimeout(iTimer);
    iTimer = setTimeout(() => {
      if (!pendingI) return;
      try { ML.patchStats({ interactions: pendingI }); } catch (e) { setNote("互动次数没能写入本机存储（浏览器限制了 localStorage）。", true); }
      pendingI = 0;
    }, 900);
  }
  function hudTag() {
    const n = equipped().filter(it => it.cat !== "bg" && it.cat !== "expr").length;
    els.eqTag.textContent = "已穿 " + n + " 件";
  }
  const badge = it => it.file ? "实物" : it.cat === "expr" ? "姿态" : it.cat === "bg" ? "棚景" : "贴纸";

  function buildChips() {
    els.chips.innerHTML = CATS.map(([k, cn]) => {
      const cur = state.eq[k], it = itemById(cur);
      const on = cur && cur !== "plain";
      return `<button class="chip-btn${state.cat === k ? " sel" : ""}" data-cat="${k}">${cn}<i>${on ? (it ? it.name : "已穿") : (k === "expr" ? "默认脸" : "—")}</i></button>`;
    }).join("");
    $$("#chips .chip-btn").forEach(b => b.onclick = () => {
      state.cat = b.dataset.cat; sound.tap(); buildChips(); buildItems();
    });
  }

  function thumb(it) {
    if (it.file) return PHOTOS[it.file] ? `<img src="${ML.asset(it.file)}" alt="${it.name}实物照片">` : PH_SVG;
    return it.svg || PH_SVG;
  }
  function buildItems() {
    const cat = state.cat, list = ITEMS.filter(it => it.cat === cat), cur = state.eq[cat];
    const noneSvg = SV('<path d="M13 13l22 22M35 13 13 35"/>');
    els.items.innerHTML = `<button class="item none${!cur || cur === "plain" ? " sel" : ""}" data-id="" aria-label="无">
        <span class="th">${noneSvg}</span><span class="nm">无</span><span class="bdg">卸下</span></button>` +
      list.map(it => `<button class="item${cur === it.id ? " sel" : ""}" data-id="${it.id}">
          <span class="th">${thumb(it)}</span><span class="nm">${it.name}</span>
          <span class="bdg${it.file ? " img" : ""}">${badge(it)}</span></button>`).join("");
    $$("#items .item").forEach(b => b.onclick = () => equip(cat, b.dataset.id));
  }

  function equip(cat, id) {
    const it = itemById(id);
    if (id && it && it.file && !PHOTOS[it.file]) {      // 照片没到位就不写状态，免得「穿了却看不见」
      setNote("「" + it.name + "」的实物照片还没加载好，先不穿上。", true); sound.bad(); return;
    }
    const prev = itemById(state.eq[cat]);
    const want = id || (cat === "expr" ? "plain" : "");
    const already = state.eq[cat] === want;
    const next = already ? (cat === "expr" ? "plain" : "") : want;
    state.eq[cat] = next;
    let msg;
    if (!id) msg = cat === "expr" ? "回到真猫的默认脸" : (prev ? "卸下 " + prev.name : "这一栏本来就空着");
    else if (already) msg = "卸下 " + (prev ? prev.name : id);
    else msg = (it && it.file ? "贴上实物 " : "换上 ") + (it ? it.name : id);
    (already || !next) ? sound.tick() : sound.tap();
    queueInteraction(); flashNote(msg);
    buildChips(); buildItems(); render(); persistSoon();
  }

  function bindSlider(inp, out, key) {
    const rg = POSE_RANGE[key];

      const v = parseFloat(inp.value);
      state.pose[key] = clamp(Number.isFinite(v) ? v : POSE0[key], rg[0], rg[1]);
      out.textContent = state.pose[key].toFixed(2);
      render(); persistSoon();
    });
    inp.addEventListener("change", () => { sound.tick(); queueInteraction(); });
  }
  function syncPoseUI() {
    SLIDERS.forEach(([key, sid, vid]) => {
      const inp = $("#" + sid), out = $("#" + vid);
      inp.value = String(state.pose[key]); out.textContent = state.pose[key].toFixed(2);
    });

    els.capPresets.innerHTML = list.map(t => `<button class="ed-btn" data-t="${t.replace(/"/g, "&quot;")}">${t.length > 12 ? t.slice(0, 12) + "…" : t}</button>`).join("");

  function markCapSel() {
    $$("#capPresets .ed-btn").forEach(b => b.classList.toggle("sel", b.dataset.t === state.caption));

  function syncToggles() {
    const useAnim = ML.settings.anim && state.anim;
    els.animBtn.textContent = "待机动画：" + (useAnim ? "开" : "关");
    els.animBtn.classList.toggle("sel", useAnim);

  function wireUI() {
    SLIDERS.forEach(([key, sid, vid]) => bindSlider($("#" + sid), $("#" + vid), key));
    els.animBtn.onclick = () => {
      state.anim = !state.anim; sound.tap(); syncToggles(); render(); persistSoon();
      flashNote(state.anim ? "呼吸 / 尾巴 / 眨眼已开启" : "待机动画已关闭，姿态滑块仍然有效");
    };
    els.poseBtn.onclick = () => {
      state.pose = Object.assign({}, POSE0); syncPoseUI(); sound.tick(); queueInteraction(); render(); persistSoon();
      flashNote("姿态归零：真猫回到照片里的原始比例。");
    };
    els.capText.addEventListener("input", e => {
      state.caption = e.target.value.slice(0, 18); markCapSel(); render(); persistSoon();
    });
    els.capText.addEventListener("change", () => { sound.tick(); queueInteraction(); });
    els.capText.value = state.caption || "";
    buildChips(); buildItems(); buildCaps(); syncToggles(); syncPoseUI();
  }

    const parts = CATS.filter(([k]) => k !== "bg").map(([k]) => state.eq[k])

    const bg = itemById(state.eq.bg);
    return (parts.join("·") || "素颜真猫") + (bg ? "@" + bg.name : "");

  function randomOutfit() {
    const pool = cat => ITEMS.filter(it => it.cat === cat && (!it.file || PHOTOS[it.file]));   // 没到位的实物不进抽签
    state.eq.expr = pick(pool("expr")).id;
    ["head", "cloth", "neck", "hand", "sticker"].forEach(cat => {
      const l = pool(cat);
      state.eq[cat] = (l.length && Math.random() < 0.8) ? pick(l).id : "";

    const bg = pool("bg");
    if (bg.length) state.eq.bg = pick(bg).id;
    queueInteraction(); sound.bonus();
    flashNote("随机一套：" + comboName());

    x.lineWidth = 5; x.strokeStyle = INK; x.strokeRect(60, 64, 960, 960);
    // 黄色信息带
    x.fillStyle = "#F5E66B"; x.fillRect(60, 1044, 960, 118);
    x.lineWidth = 4; x.strokeStyle = INK; x.strokeRect(60, 1044, 960, 118);
    x.textAlign = "left"; x.textBaseline = "alphabetic";
    x.fillStyle = INK; x.font = F("900", 42); x.fillText((petCfg && petCfg.petName) || "MOMO", 88, 1116);
    x.textAlign = "right"; x.font = F("700", 24);
    x.fillText("MOMO LAB · 换装室", 992, 1090);
    x.fillStyle = "#5C574F"; x.font = F("700", 22); x.fillText(o.date || "", 992, 1128);
    // 文案胶囊
    x.textAlign = "center";
    let fz = 46; const txt = capText();
    x.font = F("900", fz);
    while (x.measureText(txt).width > 700 && fz > 20) { fz -= 2; x.font = F("900", fz); }
    x.fillStyle = "#DCD2F5"; ML.rr(x, 150, 1200, 780, 74, 37); x.fill(); x.lineWidth = 4; x.strokeStyle = INK; x.stroke();
    x.fillStyle = INK; x.textBaseline = "middle"; x.fillText(txt, 540, 1238);
    x.textBaseline = "alphabetic";
    x.fillStyle = "#88847D"; x.font = F("700", 20); x.fillText("搭配：" + comboName(), 540, 1306);
  }
  function dateStr() {
    try { return ML.today(); } catch (e) {
      try { return new Date().toISOString().slice(0, 10); } catch (e2) { return "2026-11-10"; }
    }
  }
  function posterCanvas(date) {
    const c = document.createElement("canvas"); c.width = 1080; c.height = 1350;
    drawPoster(c.getContext("2d"), { date });
    return c;
  }
  /* 每一层都是照片，画布被污染时没有「退化成矢量重画」这条路，只能实话实说 */
  const TAINT_NOTE = "所有图层都是真猫照片，浏览器不允许把这种画布导出成 PNG（用 file:// 直接打开本页就会这样）。请用本地 HTTP 打开本页再导出，或者改用系统截图。";
  function makePNG() {
    if (!rigReady) return { url: "", tainted: false };
    const date = dateStr();
    try { return { url: posterCanvas(date).toDataURL("image/png"), tainted: false }; }
    catch (e) { return { url: "", tainted: true }; }
  }
  function showOv(url, name) {
    $("#ovNote").textContent = "1080 × 1350 · 手机可长按图片保存。";
    $("#ovImg").src = url;
    $("#ovDl").href = url; $("#ovDl").download = name;
    $("#ov").classList.remove("hide");
  }
  function doDownload() {
    if (!rigReady) { setNote("真猫素材还在加载，稍等一下再导出。", true); sound.bad(); return; }
    const r = makePNG();
    const name = "momo-dressup-" + Date.now() + ".png";
    if (!r.url) { setNote(TAINT_NOTE, true); sound.bad(); return; }
    try {
      const a = document.createElement("a"); a.href = r.url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { setNote("自动下载被拦截，请点弹窗里的「下载 PNG」。", true); }
    showOv(r.url, name); sound.good(); queueInteraction();
  }
  function saveToFav() {
    if (!rigReady) { setNote("真猫素材还在加载，稍等一下再收藏。", true); sound.bad(); return; }
    const r = makePNG();
    if (!r.url) { setNote(TAINT_NOTE + " 收藏也要用到 PNG 数据，这一步同样做不了。", true); sound.bad(); return; }
    const work = {
      id: "dressup-" + Date.now(), game: "dressup", gameName: "换装室",
      title: "换装室 · " + comboName(), score: 0, rating: "满分喵",
      time: dateStr(), png: r.url
    };
    let ok = false;
    try {
      ML.addWork(work);
      ok = ML.works().some(w => w.id === work.id);   // 真的写进去了才算成功
    } catch (e) { ok = false; }
    if (!ok) { setNote("收藏没存下：1080×1350 的图太大，本机存储写不进去。可以先点「导出 PNG」自己保存图片。", true); sound.bad(); return; }
    try { ML.patchStats({ outfitsMade: 1 }); } catch (e) { setNote("作品已存下，但「换装套数」统计没写进去。", true); }
    try { ML.floatSticker(stage, "已存进收藏", stage.clientWidth * 0.5 - 46, stage.clientHeight * 0.14); } catch (e) {}
    setNote("已存进收藏：" + work.title + "，到「收藏」页可以看大图。", false);
    sound.win(); queueInteraction();
  }

  /* ---------------- 记忆 / 重置 ---------------- */
  const KEY = "ml-dressup";
  let saveT = 0;
  function persistSoon() { clearTimeout(saveT); saveT = setTimeout(persistNow, 420); }
  function persistNow() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        v: 2, eq: state.eq, pose: state.pose, caption: state.caption, anim: state.anim, cat: state.cat
      }));
    } catch (e) { setNote("这套搭配没能记住：本机存储不可用，下次打开会回到默认。", true); }
  }
  function restore() {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return false;
    /* v1 存档里的 fur / bodyFat / headWidth / earSpread / sticker 开关对照片猫无意义：直接忽略，不迁移也不报错 */
    if (o.eq && typeof o.eq === "object") CATS.forEach(([k]) => {
      const id = o.eq[k];
      if (k === "bg") state.eq.bg = itemById(id) ? id : "studio";
      else if (typeof id === "string") state.eq[k] = (id === "" || id === "plain" || itemById(id)) ? id : (k === "expr" ? "plain" : "");
    });
    if (o.pose && typeof o.pose === "object") SLIDERS.forEach(([key]) => {
      const v = parseFloat(o.pose[key]);
      if (Number.isFinite(v)) state.pose[key] = clamp(v, POSE_RANGE[key][0], POSE_RANGE[key][1]);
    });
    if (typeof o.caption === "string") state.caption = o.caption.slice(0, 18);
    state.anim = o.anim !== false;
    if (CATS.some(([k]) => k === o.cat)) state.cat = o.cat;
    setNote("已恢复上次在换装室的搭配和姿态。", false);
    return true;
  }
  function resetAll() {
    state.eq = { expr: "plain", head: "", cloth: "", neck: "", hand: "", sticker: "", bg: "studio" };
    state.pose = Object.assign({}, POSE0);
    state.caption = ""; state.anim = true; state.cat = "expr";
    try { localStorage.removeItem(KEY); } catch (e) { setNote("存储不可用，重置只作用于当前页面。", true); }
    els.capText.value = "";
    sound.bad(); flashNote("已恢复到真猫照片的原始样子。");
    buildChips(); buildItems(); buildCaps(); syncToggles(); syncPoseUI();
    render();
  }

  /* ---------------- 待机循环 ---------------- */
  let lastLoop = 0;
  function loop(ts) {
    tNow = ts || 0;
    if (animOn() && tNow - lastLoop > 33) { lastLoop = tNow; render(); }
    requestAnimationFrame(loop);
  }

  /* ---------------- 启动：先把真猫分层和实物照片读进来，再开始画 ---------------- */
  async function boot() {
    try { await CatRig.load(); }
    catch (e) {
      setNote("真猫分层素材（assets/pets/realcat/*.webp）没能加载。这页不画假猫，素材修好之前只有背景可用。", true);
      sound.bad(); render(); return;
    }
    rigReady = true;
    const files = [];
    ITEMS.forEach(it => { if (it.file && files.indexOf(it.file) < 0) files.push(it.file); });
    const rs = await Promise.all(files.map(f => ML.img(ML.asset(f)).then(im => { PHOTOS[f] = im; return 1; }).catch(() => 0)));
    const miss = rs.filter(v => !v).length;
    if (miss) setNote("有 " + miss + " 件实物照片没找到，其余照常可穿；缺的卡片会显示成占位图标。", true);
    buildItems(); render();
  }

  const restored = restore();
  $("#randBtn").onclick = randomOutfit;
  $("#expBtn").onclick = doDownload;
  $("#favBtn").onclick = saveToFav;
  $("#resetBtn").onclick = resetAll;
  $("#ovClose").onclick = () => { $("#ov").classList.add("hide"); sound.tap(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("#ov").classList.add("hide"); });
  wireUI();
  size();
  window.addEventListener("resize", size);
  if (window.ResizeObserver) new ResizeObserver(size).observe(stage);
  requestAnimationFrame(loop);
  boot();
  if (!restored) setNote("真猫照片加载中，稍等一下就能穿戴。", false);

  ML.pet().then(cfg => {
    petCfg = cfg;
    els.whoName.textContent = (cfg.petName || "MOMO") + " 主演";
    /* furColor / shapeParams 对照片猫无效：毛色和体型都长在实拍里，这里不做假响应 */
    buildCaps(); render(); persistSoon();
    setNote((cfg.petDescription ? "角色设定：" + cfg.petDescription + " · " : "") + "换好之后点「导出 PNG」拿 1080×1350 成图。", false);
  }).catch(() => {
    setNote("宠物资料读取失败，用默认角色 MOMO 继续搭配。", true);
    render();
  });

  /* ---------------- 调试钩子：让测试能拿数字验证对位 ---------------- */
  window.__dressupDebug = {
    state, items: ITEMS, photos: PHOTOS, CatRig, box: BOX, parts: PART, frame: LOGICAL,
    rigPose, rigTf, drawScene, render, size, pose: () => curP,
    page: (sx, sy) => BOX.p(sx, sy, curP || rigPose(0)),
    /* 服装锚点的实时落点：at 是舞台坐标，先除以部件基准 s 再乘当前变形，最后过一遍舞台盒 */
    wearPoint(id) {
      const it = itemById(id); if (!it || !it.at) return null;
      const host = it.host === "head" ? "head" : "body", part = PART[host];
      const P = curP || rigPose(0), t = rigTf(P)[host];
      const dx = (it.at[0] - part.at[0]) * (t.sx / part.s), dy = (it.at[1] - part.at[1]) * (t.sy / part.s);
      const c = Math.cos(t.rot), s = Math.sin(t.rot);
      const st = [part.at[0] + t.dx + dx * c - dy * s, part.at[1] + t.dy + dx * s + dy * c];
      const im = it.file ? PHOTOS[it.file] : null;
      return {
        id, host, part: part.img, stage: st, pivot: [part.at[0] + t.dx, part.at[1] + t.dy],
        rot: t.rot, scale: [t.sx, t.sy], baseScale: part.s, page: BOX.p(st[0], st[1], P),
        photo: it.file || null, loaded: !!im, w: it.w, crop: it.crop || [0, 0, 1, 1]
      };
    },
    /* 眼睛中心的实时落点：帽子围巾都不该盖过它。
     * 五官贴片画在 head 图坐标的 (at-anchor) 处、尺寸是 size*f，所以眼心还要再加半张贴片。 */
    eyePoint() {
      const f = CatRig.P_FACE["eyes-open"], PH = PART.head, P = curP || rigPose(0), t = rigTf(P).head;
      const qx = f.at[0] - f.anchor[0] + f.size[0] * f.f / 2, qy = f.at[1] - f.anchor[1] + f.size[1] * f.f / 2;
      const dx = (qx - PH.anchor[0]) * t.sx, dy = (qy - PH.anchor[1]) * t.sy;
      const c = Math.cos(t.rot), s = Math.sin(t.rot);
      const st = [PH.at[0] + t.dx + dx * c - dy * s, PH.at[1] + t.dy + dx * s + dy * c];
      return { stage: st, page: BOX.p(st[0], st[1], P), blink: P.blink, mouth: P.mouth };
    }
  };
})();
</script>
</body>
</html>
