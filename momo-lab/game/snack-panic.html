<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNACK PANIC — MOMO LAB</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/game.css">
</head>
<body data-page="play" data-base="../">

<div class="g-wrap">
  <div class="g-top">
    <a class="icon-btn" href="../play.html" aria-label="back"><span data-icon="back"></span></a>
    <div class="title">SNACK PANIC<small>GAME 05 · 零食危机</small></div>
    <button class="icon-btn" id="pauseBtn" aria-label="pause"><span data-icon="pause"></span></button>
  </div>
  <div class="hud">
    <div class="chip hot"><div class="k">TIME</div><div class="v" id="hTime">45</div></div>
    <div class="chip yel"><div class="k">SCORE</div><div class="v" id="hScore">0</div></div>
    <div class="chip"><div class="k">COMBO</div><div class="v" id="hCombo">×0</div></div>
    <div class="chip"><div class="k">LIVES</div><div class="v" id="hLives">♥3</div></div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="cv-wrap" id="wrap">
    <div class="cv-bg" style="background-image:url(../assets/backgrounds/snack-room.png)"></div>
    <canvas id="cv"></canvas>
    <div class="ov" id="startOv">
      <div class="panel">
        <span class="tag red">SNACK RAIN INCOMING</span>
        <h2 class="h2">SNACK PANIC</h2>
        <ul class="desc">
          <li>45 秒零食雨：拖动 / 方向键移动篮子。</li>
          <li>接住：小鱼干+10 零食+15 肉干+20 玩具+5。</li>
          <li>稀有能量球触发 BONUS +50。</li>
          <li>危险：胡萝卜 / 洗澡用品 / 药片 / 臭袜子 / 机器人，碰到 -1 生命。</li>
          <li>连续接住形成 COMBO 倍率；最后 10 秒全面加速。</li>
        </ul>
        <div class="row"><button class="btn yel big" id="startBtn">开始接零食</button></div>
      </div>
    </div>
    <div class="ov hide" id="pauseOv">
      <div class="panel"><h2 class="h2">PAUSED</h2>
        <div class="row"><button class="btn yel" id="resumeBtn">继续</button><a class="btn" href="../play.html">离开</a></div></div>
    </div>
    <div class="ov hide" id="endOv">
      <div class="panel">
        <span class="rating" id="endRating">S</span>
        <h2 class="h2" id="endTitle" style="font-size:22px"></h2>
        <p class="mut" style="font-size:13px" id="endDesc"></p>
        <img class="result-img" id="endImg" alt="share card">
        <div class="row">
          <a class="btn yel small" id="saveBtn" download="momo-snack.png">保存卡片</a>
          <button class="btn small" id="retryBtn">再来一次</button>
          <a class="btn small" href="../play.html">大厅</a>
        </div>
      </div>
    </div>
  </div>
  <div class="g-actions"><span class="label">拖动 / ← → 移动 · P 暂停</span></div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/core.js"></script>
<script>
(() => {
  const { $, clamp, rand, pick, sound } = ML;
  const cv = $("#cv"), wrap = $("#wrap"), x = cv.getContext("2d");
  const mac = ML.machine();
  let W = 0, H = 0, basketX = 0, items = [], floats = [], score = 0, combo = 0, lives = 3;
  let timeLeft = 45, elapsed = 0, spawnT = 0, missStreak = 0, angryUntil = -1, flash = 0, last = 0;
  let petCanvas = null, angryImg = null, petCfg = null;
  const keys = {};
  const GOOD = [
    { k: "fish", pts: 10, w: 30 }, { k: "treat", pts: 15, w: 30 }, { k: "meat", pts: 20, w: 20 },
    { k: "toy", pts: 5, w: 12 }, { k: "energy", pts: 50, w: 5 },
  ];
  const BAD = [{ k: "carrot" }, { k: "soap" }, { k: "pill" }, { k: "sock" }, { k: "robot" }];
  const imgs = {};
  [...GOOD.map(g => g.k), ...BAD.map(b => b.k)].forEach(k => { imgs[k] = mlIconImage(k, 80); });

  function size() {
    W = wrap.clientWidth; H = wrap.clientHeight;
    cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
    x.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    basketX = basketX || W / 2;
  }
  window.addEventListener("resize", size);
  function say(t, cls = "") { $("#banner").innerHTML = t ? `<span class="msg ${cls}">${t}</span>` : ""; }
  function hud() {
    $("#hTime").textContent = Math.ceil(timeLeft);
    $("#hScore").textContent = score;
    $("#hCombo").textContent = "×" + combo;
    $("#hLives").textContent = "♥" + lives;
  }
  function spawn() {
    const good = Math.random() < .68;
    let def;
    if (good) {
      const total = GOOD.reduce((s, g) => s + g.w, 0);
      let r = Math.random() * total;
      def = GOOD.find(g => (r -= g.w) <= 0) || GOOD[0];
    } else def = pick(BAD);
    const speed = (rand(130, 230) + elapsed * 2.2) * (timeLeft <= 10 ? 1.5 : 1);
    items.push({ k: def.k, pts: def.pts || 0, good, x: rand(30, W - 30), y: -30, v: speed, rot: rand(-.4, .4) });
  }
  function finish() {
    mac.set("FINISHED");
    const r = score >= 450 ? "S" : score >= 250 ? "A" : score >= 100 ? "B" : "C";
    const t = r === "S" ? "零食黑洞" : r === "A" ? "接食神爪" : r === "B" ? "小有收获" : "零食路人";
    const color = r === "S" ? "#F16D5B" : r === "C" ? "#BFE4D0" : "#F5E66B";
    const rec = ML.record("snack", score);
    $("#endRating").textContent = r; $("#endRating").style.background = color;
    $("#endRating").style.color = color === "#F16D5B" ? "#fff" : "#222";
    $("#endTitle").textContent = t;
    $("#endDesc").textContent = `收集得分 ${score} · 历史最佳 ${rec.best} · 剩余生命 ${lives}`;
    $("#endOv").classList.remove("hide");
    r === "C" ? sound.lose() : sound.win();
    ML.shareCard({ game: "SNACK PANIC", petName: petCfg?.petName || "MOMO", rating: r, ratingColor: color, score, timeText: `用时 ${Math.round(elapsed)}s`, ending: t, expr: petCfg?.petExpressions[r === "C" ? "angry" : "happy"] || petCfg?.petAvatar, badge: "SNACK REPORT" })
      .then(url => { $("#endImg").src = url; $("#saveBtn").href = url; });
  }
  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.max(0, Math.min((t - last) / 1000, .05)); last = t;
    if (mac.get() !== "PLAYING") return;
    timeLeft -= dt; elapsed += dt;
    if (keys.ArrowLeft) basketX -= 320 * dt;
    if (keys.ArrowRight) basketX += 320 * dt;
    basketX = clamp(basketX, 50, W - 50);
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = timeLeft <= 10 ? .45 : .7; }
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.y += it.v * dt;
      if (it.y > H - 86 && it.y < H - 36 && Math.abs(it.x - basketX) < 52) {
        items.splice(i, 1);
        if (it.good) {
          combo++; missStreak = 0;
          const gain = Math.round(it.pts * (1 + Math.min(combo, 10) * .1));
          score += gain; sound.combo(combo);
          floats.push({ t: "+" + gain, x: it.x, y: H - 110, life: .8 });
          if (it.k === "energy") { sound.bonus(); say("BONUS！能量球 +50！", "yel"); }
        } else {
          lives--; combo = 0; missStreak++; flash = .3; sound.bad();
          floats.push({ t: "-1♥", x: it.x, y: H - 110, life: .8 });
          if (missStreak >= 3) { angryUntil = elapsed + 1.5; say("猫生气了！！", "red"); }
          if (lives <= 0) { hud(); finish(); return; }
        }
        hud();
      } else if (it.y > H + 30) {
        items.splice(i, 1);
        if (it.good) { combo = 0; missStreak++; if (missStreak >= 3) { angryUntil = elapsed + 1.5; } hud(); }
      }
    }
    if (timeLeft <= 10 && Math.ceil(timeLeft) !== Math.ceil(timeLeft + dt)) { sound.tick(); say("最后十秒！加速！", "red"); }
    if (timeLeft <= 0) { timeLeft = 0; hud(); finish(); return; }
    hud();
    draw();
  }
  function draw() {
    x.clearRect(0, 0, W, H);
    x.fillStyle = "rgba(34,34,34,.12)"; x.fillRect(0, H - 46, W, 46);
    items.forEach(it => {
      x.save(); x.translate(it.x, it.y); x.rotate(it.rot);
      const im = imgs[it.k];
      if (im.complete) x.drawImage(im, -20, -20, 40, 40);
      x.restore();
    });
    if (petCanvas) x.drawImage(petCanvas, basketX - 52, H - 168, 104, 104);
    x.fillStyle = "#F5E66B"; x.strokeStyle = "#222"; x.lineWidth = 3;
    x.beginPath(); x.moveTo(basketX - 46, H - 64); x.lineTo(basketX + 46, H - 64); x.lineTo(basketX + 36, H - 26); x.lineTo(basketX - 36, H - 26); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(basketX - 40, H - 52); x.lineTo(basketX + 40, H - 52); x.stroke();
    floats.forEach(f => { f.life -= 1 / 60; f.y -= 1; x.fillStyle = "#222"; x.font = "900 16px Arial"; x.textAlign = "center"; x.fillText(f.t, f.x, f.y); });
    floats = floats.filter(f => f.life > 0);
    if (flash > 0) { flash -= 1 / 60; x.fillStyle = `rgba(241,109,91,${flash})`; x.fillRect(0, 0, W, H); }
    if (elapsed < angryUntil && angryImg && angryImg.complete) { x.drawImage(angryImg, W / 2 - 60, 12, 120, 120); }
  }
  function togglePause(force) {
    if (mac.get() === "PLAYING" && force !== false) { mac.set("PAUSED"); $("#pauseOv").classList.remove("hide"); }
    else if (mac.get() === "PAUSED") { mac.set("PLAYING"); $("#pauseOv").classList.add("hide"); }
  }
  $("#pauseBtn").onclick = () => togglePause();
  $("#resumeBtn").onclick = () => togglePause();
  ML.bindPause(mac, togglePause);
  $("#retryBtn").onclick = () => location.reload();
  cv.addEventListener("pointerdown", e => { const r = cv.getBoundingClientRect(); basketX = clamp(e.clientX - r.left, 50, W - 50); try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
  cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") { const r = cv.getBoundingClientRect(); basketX = clamp(e.clientX - r.left, 50, W - 50); } });
  document.addEventListener("keydown", e => { keys[e.key] = true; });
  document.addEventListener("keyup", e => { keys[e.key] = false; });
  $("#startBtn").onclick = () => {
    $("#startOv").classList.add("hide");
    size(); mac.set("PLAYING"); last = performance.now();
    requestAnimationFrame(loop);
  };
  ML.pet().then(cfg => {
    petCfg = cfg;
    const src = cfg.petExpressions.happy || cfg.petAvatar;
    if (ML.petId() === "pet001") ML.img(src).then(i => { petCanvas = ML.cut(i); }).catch(() => {});
    ML.img("../assets/effects/snack-angry.png").then(i => { angryImg = i; }).catch(() => {});
  });
  size(); hud();
  window.__snackDebug = { items: () => items, setX: v => { basketX = v; } };
})();
</script>
</body>
</html>
