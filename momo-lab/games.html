<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>游戏 — MOMO LAB</title>
<meta name="description" content="MOMO LAB 的全部小游戏：蓄力跳家具、偷吃木头人、换装室、表情包制造机、紧急撤离、混乱现场、谁是老板、零食危机、宠物世界。">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="games" data-base="./" data-app="1">

<main class="app">
  <header class="app-head">
    <div class="brand">
      <span class="bm">游戏</span>
      <span class="bt" id="tally">加载中…</span>
    </div>
    <button class="icon-btn" id="sortBtn" aria-label="排序方式" title="排序方式"><span data-icon="shuffle" style="display:grid"></span></button>
  </header>

  <div class="pills" style="margin-bottom:14px" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="new">最新</button>
    <button data-f="score">有分数</button>
    <button data-f="tool">创作工具</button>
    <button data-f="played">玩过</button>
  </div>

  <div class="glist" id="list"></div>

  <div class="grp"><h3>关于分数</h3></div>
  <div class="about">
    <p>分数与局数存在这台设备的浏览器里（localStorage），只记最好的一次。想把自己家猫做成这样一套游戏，看
      <a href="service.html" style="font-weight:900;text-decoration:underline">服务内容</a> 和
      <a href="studio.html" style="font-weight:900;text-decoration:underline">工作室首页</a>。</p>
  </div>
</main>

<script src="js/icons.js"></script>
<script src="js/registry.js"></script>
<script src="js/core.js"></script>
<script>
(function () {
  const NEW = ["jump", "sneak", "dressup"];
  let filter = "all";

  const thumb = g => g.art.img ? `<img src="${ML.asset(g.art.img)}" alt="">` : ML_GAME_ART[g.art.svg];

  function keep(g) {
    if (filter === "new") return NEW.includes(g.id);
    if (filter === "score") return !!g.rec;
    if (filter === "tool") return !g.rec;
    if (filter === "played") return ML.plays(g.rec) > 0;
    return true;
  }

  function render() {
    const rows = ML_GAMES.filter(keep);
    ML.$("#list").innerHTML = rows.length ? rows.map(g => {
      const best = g.rec ? ML.best(g.rec) : 0, n = ML.plays(g.rec);
      return `<div class="gitem">
        <span class="gthumb">${thumb(g)}</span>
        <span class="ginfo">
          <b>${g.n}${NEW.includes(g.id) ? ' <span class="tag red" style="font-size:9px;padding:2px 8px;vertical-align:2px">新</span>' : ""}</b>
          <p>${g.sub}</p>
          <span class="gmeta">${g.tags.map(t => `<span class="tag ${t.length > 3 ? "pur" : "mint"}">${t}</span>`).join("")}</span>
          <span class="gmeta" style="margin-top:6px">
            <span class="label">${g.time}</span>
            ${g.rec ? (best ? `<span class="tag yel">最佳 ${best}</span>` : '<span class="tag">还没纪录</span>') : '<span class="tag">创作 · 存进收藏</span>'}
            ${n ? `<span class="tag">玩过 ${n} 次</span>` : ""}
          </span>
        </span>
        <a class="go" href="${g.href}">开玩</a>
      </div>`;
    }).join("") : '<div class="empty"><p>这一类还没有游戏。</p><a class="btn small yel" href="#" id="clr">看全部</a></div>';
    const clr = ML.$("#clr");
    if (clr) clr.onclick = e => { e.preventDefault(); set("all"); };
    const scored = ML_GAMES.filter(g => g.rec && ML.best(g.rec) > 0).length;
    ML.$("#tally").textContent = `${ML_GAMES.length} 款可玩 · 已有分数 ${scored} 款`;
  }

  function set(f) {
    filter = f;
    ML.$$("#filters [data-f]").forEach(x => x.classList.toggle("on", x.dataset.f === f));
    render();
  }

  ML.$$("#filters [data-f]").forEach(x => x.onclick = () => { ML.sound.tap(); set(x.dataset.f); });
  ML.$("#sortBtn").onclick = () => {
    ML_GAMES.reverse(); ML.sound.tap(); render();
    ML.$("#sortBtn").style.transform = "rotate(180deg)";
  };
  render();
})();
</script>
</body>
</html>
