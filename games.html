<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<title>游戏大厅</title>
<link rel="stylesheet" href="css/app.css?v=100">
<script src="js/icons.js?v=100" defer></script>
<script src="js/core.js?v=100" defer></script>
<script src="js/games.js?v=100" defer></script>
</head>
<body data-page="games" data-tabbar="on">
<div class="app">
  <div class="sect"><h2>游戏大厅</h2><span class="mut small" id="sum"></span></div>
  <p class="mut small" style="margin-top:-4px">
    这一页整个列表是从 <code>js/games.js</code> 那一份数据渲染出来的，不是手写六个链接。
    所以列表里不可能出现点进去 404 的按钮；封面也都是真猫合成图。
  </p>

  <div class="pill-row" id="stats" style="margin-top:10px"></div>

  <div id="list" style="display:flex;flex-direction:column;gap:12px;margin-top:8px"></div>

  <div class="card" style="margin-top:18px;background:var(--paper2)">
    <b>为什么只有 6 款</b>
    <p class="small mut" style="margin-top:6px">
      之前这里堆了 17 款，每款都把循环、触屏、计分、结算复制粘贴一遍，单文件 40–70 KB，改一处要改十七处。
      现在这 6 款是手机上真的好玩、而且只用一张真猫抠图能做得真的那些；
      公共部分全部抽到 <code>js/game.js</code>，每款只剩自己的玩法。
      跑酷、弹弓、静电吸毛、拆家现场这些要额外的动作分件才做得像，就先不放了。
    </p>
  </div>
</div>

<script src="js/p/games.js?v=100" defer></script>
</body>
</html>
