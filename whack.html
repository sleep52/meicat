<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>别摸鱼了，打工猫！</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 2.5vw, 18px);
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }
  .hole {
    position: relative;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 38%, #3a2f1d 0 58%, #241c10 60%, #17110a 100%);
    box-shadow: inset 0 -10px 18px #00000090, 0 6px 14px #00000060;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .hole::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 26%;
    border-radius: 50% / 90% 90% 0 0;
    background: #241a0d;
    z-index: 3;
  }
  .mole {
    position: absolute;
    left: 8%; right: 8%; bottom: 6%;
    aspect-ratio: 1;
    z-index: 2;
    transform: translateY(112%);
    transition: transform 0.14s cubic-bezier(.2,1.4,.6,1);
    pointer-events: none;
  }
  .mole img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #00000055;
    filter: drop-shadow(0 4px 6px #00000088);
  }
  .hole.up .mole { transform: translateY(0); }
  .mole-name {
    position: absolute;
    left: 0; right: 0; top: -2px;
    text-align: center;
    font-size: clamp(10px, 2.6vw, 13px);
    color: #ffe9c0;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
    z-index: 4;
    pointer-events: none;
  }
  .hole.up:active .mole img { filter: brightness(1.25); }
  .hole.hit .mole { animation: squash 0.22s ease-out forwards; }
  @keyframes squash {
    0%   { transform: translateY(0) scale(1); }
    40%  { transform: translateY(6%) scale(1.18, 0.72); }
    100% { transform: translateY(112%) scale(1); }
  }
  .board.fever { animation: feverGlow 0.5s ease-in-out infinite alternate; }
  @keyframes feverGlow { to { filter: brightness(1.12) saturate(1.3); } }
  .fever-bar {
    height: 6px; border-radius: 3px; background: #ffffff18;
    width: min(560px, 100%); margin: 0 auto 10px; overflow: hidden;
  }
  .fever-bar i { display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 合集</a>
    <h1 class="page-title">别摸鱼了，打工猫！</h1>
    <button class="btn ghost" id="muteBtn">🔊</button>
  </div>

  <div class="hud">
    <span>时间<b id="timeVal">30</b></span>
    <span class="accent">得分<b id="scoreVal">0</b></span>
    <span>连击<b id="comboVal">0</b></span>
    <span>最高<b id="bestVal">0</b></span>
  </div>
  <div class="fever-bar"><i id="feverFill"></i></div>

  <div class="stage">
    <div class="board" id="board"></div>
    <div class="overlay" id="startOverlay">
      <h2>🔨 别摸鱼了，打工猫！</h2>
      <p>30 秒内点冒头的猫。普通猫 +10，稀有变装分更高；<br>
         点到<b style="color:#4dc3ff">饿了么头盔猫</b>触发 5 秒<b style="color:var(--accent)">金色狂热</b>，得分翻倍！<br>
         连击越高倍率越大（最高 ×3），点空了连击清零。</p>
      <button class="btn" id="startBtn">上班！</button>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <h2 id="endTitle">下班了！</h2>
      <div class="big-score" id="endScore">0</div>
      <p id="endComment"></p>
      <button class="btn" id="againBtn">再来一天</button>
    </div>
  </div>

<script src="js/audio.js"></script>
<script src="js/whack.js"></script>
</body>
</html>
