<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>宠物小游戏乐园</title>
<link rel="stylesheet" href="css/pet.css">

      <span class="deco-star" style="top:5px;right:30px;">⭐</span>
      <span class="deco-paw" style="top:60px;right:10px;">🌸</span>
      <h1 class="home-title">宠物小游戏乐园</h1>

      <div style="position:relative;display:inline-block;">

    <div class="game-grid">

      <a class="game-btn" href="pet-feed.html">

      <a class="game-btn" href="pet-fish.html">
        <span class="icon">🎣</span>

      </a>
      <a class="game-btn" href="pet-quiz.html">
        <span class="icon"></span>
        <span class="label">性格测试</span>

    <div class="home-cta">
      <span>🐾</span>
      <span>和我一起开启快乐时光吧！</span>
      <span>🐱</span>
    </div>
  </div>
