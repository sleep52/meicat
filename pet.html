<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>宠物小游戏乐园</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  body { background: linear-gradient(180deg, #ffd6e0 0%, #ffe8ee 50%, #fff0f3 100%); }
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 16px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top {
    height: 24px; background: var(--white);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    margin: 0 -10px; position: relative;
  }
  .cloud-top::before {
    content: ""; position: absolute; bottom: -8px; left: 0; right: 0; height: 16px;
    background: radial-gradient(ellipse 20px 12px at 20px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 50px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 80px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 110px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 140px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 170px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 200px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 230px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 260px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 290px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 320px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 350px 0, var(--white) 70%, transparent 71%),
                radial-gradient(ellipse 20px 12px at 380px 0, var(--white) 70%, transparent 71%);
  }
  .home-topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 4px; }
  .home-icon-btn {
    width: 42px; height: 42px; background: var(--white); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 2px 8px #e8899a20;
  }
  .home-flower { width: 34px; }
  .home-hero { text-align: center; padding: 4px 16px 10px; position: relative; }
  .home-title {
    font-size: 28px; font-weight: 900; color: #ff7fa3;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #ffd0dd, 1px -1px 0 #ffd0dd, -1px 1px 0 #ffd0dd;
    margin-bottom: 8px; letter-spacing: 1px; transform: rotate(-2deg);
  }
  .home-subtitle {
    background: linear-gradient(90deg, #ffe4a0, #ffd680);
    display: inline-block; padding: 6px 18px; border-radius: 14px;
    font-size: 13px; font-weight: 700; color: #6b4c3b;
    box-shadow: 0 2px 6px #00000010; transform: rotate(-1deg); position: relative;
  }
  .home-subtitle .crown { position: absolute; left: -16px; top: -14px; font-size: 18px; }
  .home-cat-wrap { position: relative; display: inline-block; margin: 12px auto 8px; }
  .home-cat-frame {
    width: 220px; height: 200px; border-radius: 20px; overflow: hidden;
    border: 5px solid var(--white); box-shadow: 0 6px 20px #e8899a25;
    position: relative;
  }
  .home-cat-frame img { width: 100%; height: 100%; object-fit: cover; }
  .home-speech {
    position: absolute; right: -50px; top: 30px;
    background: var(--white); padding: 12px 14px; border-radius: 18px;
    font-size: 13px; font-weight: 700; color: var(--ink);
    box-shadow: 0 3px 12px #00000012; max-width: 130px; line-height: 1.6;
    z-index: 2;
  }
  .home-speech::after {
    content: ""; position: absolute; left: -8px; top: 22px;
    border: 8px solid transparent; border-right-color: var(--white);
  }
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 16px; }
  .game-btn {
    border-radius: 20px; padding: 14px 10px 12px; text-align: center;
    box-shadow: 0 3px 10px #e8899a12; border: 2.5px solid;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: transform 0.12s;
  }
  .game-btn:active { transform: scale(0.95); }
  .game-btn .cat {
    width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
    border: 2.5px solid #fff; box-shadow: 0 2px 6px #00000012;
  }
  .game-btn .icon { font-size: 22px; line-height: 1; }
  .game-btn .label { font-size: 15px; font-weight: 800; color: var(--ink); }
  .game-btn:nth-child(1) { background: #fff8e7; border-color: #ffe4a0; }
  .game-btn:nth-child(2) { background: #e8f4f8; border-color: #a8d8ea; }
  .game-btn:nth-child(3) { background: #f3e8f5; border-color: #d4a5d8; }
  .game-btn:nth-child(4) { background: #fff0f3; border-color: #ffb6c1; }
  .home-cta {
    background: linear-gradient(90deg, #ffb6c1, #ff9fb3);
    color: var(--white); padding: 14px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 700; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 3px 12px #e8899a25; margin: 8px 16px 0; position: relative;
  }
  .home-cta .paw { font-size: 22px; }
  .home-cta img.cta-cat { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; position: absolute; right: 8px; bottom: -6px; }
  .deco { position: absolute; pointer-events: none; opacity: 0.5; }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="home-topbar">
    <div class="home-icon-btn">🏠</div>
    <img class="home-flower" src="assets/pet-flower-deco_1794193833335_ca791ebb.png" alt="">
  </div>
  <div class="home-hero">
    <img class="deco" src="assets/pet-paw-deco_1794193917877_4a1496ce.png" style="width:30px;top:0;left:0;">
    <img class="deco" src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:24px;top:40px;left:10px;">
    <img class="deco" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:22px;bottom:60px;left:5px;">
    <img class="deco" src="assets/pet-paw-deco_1794193917877_4a1496ce.png" style="width:26px;bottom:60px;right:5px;">
    <h1 class="home-title">宠物小游戏乐园</h1>
    <div class="home-subtitle"><span class="crown">👑</span>和可爱的毛孩子们一起玩耍吧！</div>
    <div class="home-cat-wrap">
      <div class="home-cat-frame">
        <img src="assets/pet-white-kitten_1794193772792_999ded05.png" alt="猫咪">
      </div>
      <div class="home-speech">欢迎来到<br>喵星人俱乐部♥</div>
    </div>
  </div>
  <div class="game-grid">
    <a class="game-btn" href="pet-pet.html">
      <img class="cat" src="assets/pet-yellow-kitten_1794207173152_42c7472b.png" alt="">
      <span class="icon">🐾</span>
      <span class="label">摸摸乐</span>
    </a>
    <a class="game-btn" href="pet-feed.html">
      <img class="cat" src="assets/pet-black-cat_1794193784406_68681628.png" alt="">
      <span class="icon">🐟</span>
      <span class="label">喂食屋</span>
    </a>
    <a class="game-btn" href="pet-fish.html">
      <img class="cat" src="assets/pet-tabby-cat_1794193799191_6e955d81.png" alt="">
      <span class="icon">☁️</span>
      <span class="label">接鱼挑战</span>
    </a>
    <a class="game-btn" href="pet-quiz.html">
      <img class="cat" src="assets/pet-white-kitten_1794193772792_999ded05.png" alt="">
      <span class="icon">⭐</span>
      <span class="label">性格测试</span>
    </a>
  </div>
  <div class="home-cta">
    <span class="paw">🐾</span>
    <span>更多有趣玩法等你来探索~</span>
    <img class="cta-cat" src="assets/pet-lying-cat_1794207160537_687666be.png" alt="">
  </div>
</div>
<script src="js/pet-cut.js"></script>
</body>
</html>
