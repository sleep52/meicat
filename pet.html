<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>宠物小游戏乐园</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .home-topbar {
    display: flex; justify-content: space-between; padding: 8px 0;
  }
  .home-icon-btn {
    width: 40px; height: 40px; background: var(--white); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; box-shadow: 0 2px 8px #00000010;
  }
  .home-cat-wrap {
    position: relative; display: inline-block; margin: 10px auto;
  }
  .home-cat-wrap .home-cat {
    width: 220px; height: 220px; margin: 0;
  }
  .home-speech {
    right: -30px; top: 30px; font-size: 14px; max-width: 130px;
    padding: 12px 14px;
  }
  .game-btn .icon { font-size: 36px; }
  .game-btn .label { font-size: 16px; }
  .home-cta { position: relative; }
  .home-cta-cat {
    position: absolute; right: 12px; bottom: -8px; font-size: 36px;
  }
  .deco-corner { position: absolute; font-size: 22px; opacity: 0.35; pointer-events: none; }
</style>
</head>
<body>
  <div class="pet-container">
    <div class="home-topbar">
      <div class="home-icon-btn"></div>
      <div class="home-icon-btn">⚙️</div>
    </div>

    <div class="home-hero">
      <span class="deco-corner" style="top:0;left:0;">🐾</span>
      <span class="deco-corner" style="top:0;right:0;">🌸</span>
      <span class="deco-corner" style="top:50px;left:20px;">⭐</span>
      <span class="deco-corner" style="top:40px;right:20px;">🌼</span>
      <span class="deco-corner" style="bottom:10px;left:10px;">🌸</span>
      <span class="deco-corner" style="bottom:10px;right:10px;">🐾</span>

      <h1 class="home-title">宠物小游戏乐园</h1>
      <div class="home-subtitle">和可爱的毛孩子一起玩耍吧！</div>

      <div class="home-cat-wrap">
        <img class="home-cat" src="assets/sleep_s.jpg" alt="猫咪">
        <div class="home-speech">欢迎来到<br>我的小乐园~💕</div>
      </div>
    </div>

    <div class="game-grid">
      <a class="game-btn" href="pet-pet.html">
        <span class="icon">🐾</span>
        <span class="label">摸摸乐</span>
      </a>
      <a class="game-btn" href="pet-feed.html">
        <span class="icon">🐟</span>
        <span class="label">喂食屋</span>
      </a>
      <a class="game-btn" href="pet-fish.html">
        <span class="icon"></span>
        <span class="label">摸鱼挑战</span>
      </a>
      <a class="game-btn" href="pet-quiz.html">
        <span class="icon">📋</span>
        <span class="label">性格测试</span>
      </a>
    </div>

    <div class="home-cta">
      <span>🐾</span>
      <span>和我一起<br>开启快乐时光吧！</span>
      <span class="home-cta-cat">🐱</span>
    </div>
  </div>
</body>
</html>
