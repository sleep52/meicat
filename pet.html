<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>宠物小游戏乐园</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  body { background: linear-gradient(180deg, #ffd6e0 0%, #ffe8ee 50%, #fff0f3 100%); }
  .home-topbar { display: flex; justify-content: space-between; padding: 10px 4px; }
  .home-icon-btn {
    width: 42px; height: 42px; background: var(--white); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 2px 8px #e8899a20;
  }
  .home-hero { text-align: center; padding: 0 0 10px; position: relative; }
  .home-title {
    font-size: 30px; font-weight: 900; color: #6b4c3b;
    text-shadow: 2px 2px 0 #ffe4a0, -1px -1px 0 #fff;
    margin-bottom: 8px; letter-spacing: 2px;
  }
  .home-subtitle {
    background: linear-gradient(90deg, #ffe4a0, #ffd680);
    display: inline-block; padding: 6px 20px; border-radius: 14px;
    font-size: 14px; font-weight: 700; color: #6b4c3b;
    box-shadow: 0 2px 6px #00000010;
  }
  .home-cat-wrap { position: relative; display: inline-block; margin: 14px auto 10px; }
  .home-cat-wrap .home-cat {
    width: 240px; height: 240px; margin: 0;
    border: 6px solid var(--white); box-shadow: 0 8px 28px #e8899a30;
  }
  .home-speech {
    position: absolute; right: -40px; top: 40px;
    background: var(--white); padding: 12px 16px; border-radius: 18px;
    font-size: 14px; font-weight: 700; color: var(--ink);
    box-shadow: 0 3px 12px #00000012; max-width: 140px; line-height: 1.6;
  }
  .home-speech::after {
    content: ""; position: absolute; left: -10px; top: 24px;
    border: 10px solid transparent; border-right-color: var(--white);
  }
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
  .game-btn {
    border-radius: 22px; padding: 22px 12px; text-align: center;
    box-shadow: 0 4px 14px #e8899a15; border: 2.5px solid;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: transform 0.12s;
  }
  .game-btn:active { transform: scale(0.95); }
  .game-btn .icon { width: 48px; height: 48px; object-fit: contain; }
  .game-btn .label { font-size: 17px; font-weight: 800; color: var(--ink); }
  .game-btn:nth-child(1) { background: #fff8e7; border-color: #ffe4a0; }
  .game-btn:nth-child(2) { background: #e8f4f8; border-color: #a8d8ea; }
  .game-btn:nth-child(3) { background: #f3e8f5; border-color: #d4a5d8; }
  .game-btn:nth-child(4) { background: #fff0f3; border-color: #ffb6c1; }
  .home-cta {
    background: linear-gradient(90deg, #ffb6c1, #ff9fb3);
    color: var(--white); padding: 16px 24px; border-radius: 26px;
    font-size: 15px; font-weight: 700; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 14px #e8899a30; margin-top: 10px; position: relative;
  }
  .home-cta img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
  .deco-img { position: absolute; pointer-events: none; opacity: 0.4; }
</style>
</head>
<body>
  <div class="pet-container">
    <div class="home-topbar">
      <div class="home-icon-btn">🏠</div>
      <div class="home-icon-btn">⚙️</div>
    </div>

    <div class="home-hero">
      <img class="deco-img" src="assets/pet-paw-deco_1794193917877_4a1496ce.png" style="width:36px;top:0;left:0;">
      <img class="deco-img" src="assets/pet-flower-deco_1794193833335_ca791ebb.png" style="width:32px;top:0;right:0;">
      <img class="deco-img" src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:28px;top:50px;left:16px;">
      <img class="deco-img" src="assets/pet-flower-deco_1794193833335_ca791ebb.png" style="width:28px;top:40px;right:16px;">
      <img class="deco-img" src="assets/pet-paw-deco_1794193917877_4a1496ce.png" style="width:30px;bottom:0;left:8px;">
      <img class="deco-img" src="assets/pet-flower-deco_1794193833335_ca791ebb.png" style="width:30px;bottom:0;right:8px;">

      <h1 class="home-title">宠物小游戏乐园</h1>
      <div class="home-subtitle">和可爱的毛孩子一起玩耍吧！</div>

      <div class="home-cat-wrap">
        <img class="home-cat" src="assets/sleep_s.jpg" alt="猫咪">
        <div class="home-speech">欢迎来到<br>我的小乐园~💕</div>
      </div>
    </div>

    <div class="game-grid">
      <a class="game-btn" href="pet-pet.html">
        <img class="icon" src="assets/pet-paw-icon_1794193697097_52c6b9ba.png" alt="">
        <span class="label">摸摸乐</span>
      </a>
      <a class="game-btn" href="pet-feed.html">
        <img class="icon" src="assets/pet-fish-icon_1794193709959_215f0368.png" alt="">
        <span class="label">喂食屋</span>
      </a>
      <a class="game-btn" href="pet-fish.html">
        <img class="icon" src="assets/pet-fishing-icon_1794193723696_11735ca7.png" alt="">
        <span class="label">摸鱼挑战</span>
      </a>
      <a class="game-btn" href="pet-quiz.html">
        <img class="icon" src="assets/pet-clipboard-icon_1794193734880_df4bc219.png" alt="">
        <span class="label">性格测试</span>
      </a>
    </div>

    <div class="home-cta">
      <span style="font-size:22px;">🐾</span>
      <span>和我一起<br>开启快乐时光吧！</span>
      <img src="assets/sit_s.jpg" alt="">
    </div>
  </div>
</body>
</html>
