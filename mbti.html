<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>猫咪MBTI测试</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .quiz-wrap {
    width: 100%;
    max-width: 480px;
    padding: 0 4px 40px;
  }

  /* ===== 进度条 ===== */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .progress-bar {
    flex: 1;
    height: 10px;
    background: #ffffff12;
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 5px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }
  .progress-text {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 42px;
    text-align: right;
  }

  /* ===== 开始页 ===== */
  .start-screen {
    text-align: center;
    padding: 20px 0 30px;
  }
  .start-avatar {
    width: 150px; height: 150px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    box-shadow: 0 0 40px #ffb83033, 0 12px 32px #00000066;
    object-fit: cover;
    margin-bottom: 20px;
    animation: bob 2.8s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
  .start-screen h2 {
    font-size: 26px;
    margin: 0 0 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .start-screen .subtitle {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
    margin: 0 0 28px;
  }
  .start-screen .subtitle b { color: var(--ink); }

  /* ===== 题目卡片 ===== */
  .q-card {
    background: var(--card);
    border: 1px solid #ffffff14;
    border-radius: var(--radius);
    padding: 28px 22px;
    animation: cardIn 0.35s cubic-bezier(.4,0,.2,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  .q-dim {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
    background: #ffb83018;
    border-radius: 6px;
    padding: 3px 10px;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 22px;
    line-height: 1.5;
  }
  .q-options { display: flex; flex-direction: column; gap: 12px; }
  .q-opt {
    background: #ffffff08;
    border: 2px solid #ffffff18;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    line-height: 1.5;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .q-opt .opt-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: #ffffff10;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .q-opt:active { transform: scale(0.97); }
  .q-opt:hover { border-color: #ffffff30; background: #ffffff10; }
  .q-opt.selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, #ffb83022, #ff7a5918);
  }
  .q-opt.selected .opt-icon {
    background: var(--accent);
    color: #2a1c00;
  }

  /* ===== 结果页 ===== */
  .result-screen {
    text-align: center;
    animation: resultIn 0.6s cubic-bezier(.4,0,.2,1);
  }
  @keyframes resultIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: none; }
  }
  .result-avatar {
    width: 170px; height: 170px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    box-shadow: 0 0 50px #ffb83033, 0 14px 36px #00000077;
    object-fit: cover;
    margin-bottom: 18px;
    animation: bob 2.8s ease-in-out infinite;
  }
  .result-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    background: #ffb83018;
    border: 1px solid #ffb83040;
    border-radius: 8px;
    padding: 4px 14px;
    margin-bottom: 8px;
  }
  .result-type {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 4px;
    margin: 0 0 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 18px;
    color: var(--ink);
  }
  .result-desc {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.9;
    margin: 0 0 22px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 18px;
    border: 1px solid #ffffff14;
    text-align: left;
  }
  .result-dims {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .dim-bar {
    background: var(--card);
    border: 1px solid #ffffff14;
    border-radius: 14px;
    padding: 14px 14px 12px;
    text-align: left;
  }
  .dim-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .dim-val {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .dim-track {
    height: 6px;
    background: #ffffff12;
    border-radius: 3px;
    overflow: hidden;
  }
  .dim-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(.4,0,.2,1);
  }
  .result-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 合集</a>
    <h1 class="page-title">猫咪 MBTI</h1>
    <button class="btn ghost" id="muteBtn">🔊</button>
  </div>

  <div class="quiz-wrap">
    <div id="startScreen" class="start-screen">
      <img class="start-avatar" src="assets/sleep_s.jpg" alt="猫咪MBTI">
      <h2>你是哪只猫？</h2>
      <p class="subtitle">
        <b>12 道</b>猫咪情境题，测出你的猫咪人格<br>
        看看你是策略猫、治愈猫、还是红唇猫！
      </p>
      <button class="btn" id="startBtn">开始测试</button>
    </div>

    <div id="quizScreen" class="hidden">
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">1/12</div>
      </div>
      <div class="q-card" id="qCard">
        <div class="q-dim" id="qDim"></div>
        <p class="q-text" id="qText"></p>
        <div class="q-options" id="qOptions"></div>
      </div>
    </div>

    <div id="resultScreen" class="hidden result-screen"></div>
  </div>

<script src="js/audio.js"></script>
<script src="js/mbti.js"></script>
</body>
</html>
