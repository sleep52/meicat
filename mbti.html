<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>猫咪MBTI测试</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .quiz-wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  .progress-bar {
    width: 100%;
    height: 8px;
    background: #ffffff18;
    border-radius: 4px;
    margin: 12px 0 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.35s ease;
    width: 0%;
  }
  .q-card {
    background: var(--card);
    border: 1px solid #ffffff18;
    border-radius: var(--radius);
    padding: 24px 20px;
    text-align: center;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .q-num {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 22px;
    line-height: 1.5;
  }
  .q-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .q-opt {
    background: #ffffff0d;
    border: 2px solid #ffffff22;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 15px;
    color: #fff;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    text-align: left;
    line-height: 1.5;
  }
  .q-opt:active { transform: scale(0.97); }
  .q-opt:hover, .q-opt:focus { border-color: var(--accent); background: #ffffff14; outline: none; }
  .q-opt.selected { border-color: var(--accent); background: var(--accent); color: #1a1000; font-weight: 600; }

  /* start screen */
  .start-screen {
    text-align: center;
    padding: 30px 0;
  }
  .start-screen img {
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    box-shadow: 0 8px 24px #00000066;
    object-fit: cover;
    margin-bottom: 18px;
  }
  .start-screen h2 { margin: 0 0 8px; font-size: 24px; }
  .start-screen p { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0 0 24px; }

  /* result screen */
  .result-screen {
    text-align: center;
    animation: fadeIn 0.5s ease;
  }
  .result-screen img {
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    box-shadow: 0 10px 30px #00000088;
    object-fit: cover;
    margin-bottom: 16px;
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
  .result-type {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 3px;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .result-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 16px;
    color: #fff;
  }
  .result-desc {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.8;
    margin: 0 0 20px;
    padding: 0 8px;
    text-align: left;
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 16px;
    border: 1px solid #ffffff18;
  }
  .result-dims {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 22px;
  }
  .dim-bar {
    background: var(--card);
    border: 1px solid #ffffff18;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    text-align: left;
  }
  .dim-bar .label { color: var(--muted); margin-bottom: 4px; }
  .dim-bar .bar { height: 6px; background: #ffffff18; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .dim-bar .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .dim-bar .val { font-weight: 700; font-size: 14px; }
  .result-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 合集</a>
    <h1 class="page-title">猫咪 MBTI</h1>
    <button class="btn ghost" id="muteBtn">🔊</button>
  </div>

  <div class="quiz-wrap">
    <div id="startScreen" class="start-screen">
      <img src="assets/sleep_s.jpg" alt="猫咪MBTI">
      <h2>你是哪只猫？</h2>
      <p>12 道猫咪情境题，测出你的猫咪 MBTI 人格。<br>看看你是策略猫、治愈猫、还是红唇猫！</p>
      <button class="btn" id="startBtn">开始测试</button>
    </div>

    <div id="quizScreen" class="hidden">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="q-card" id="qCard">
        <div class="q-num" id="qNum"></div>
        <p class="q-text" id="qText"></p>
        <div class="q-options" id="qOptions"></div>
      </div>
    </div>

    <div id="resultScreen" class="hidden result-screen"></div>
  </div>

<script src="js/audio.js"></script>
<script src="js/mbti.js"></script>
</body>
</html>
