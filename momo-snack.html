<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF8ED">
<title>零食大逃亡 · momo lab</title>
<link rel="stylesheet" href="css/momo.css">
</head>
<body>
<div class="shell game">
  <div class="topbar">
    <a class="icon-btn" href="momo.html" data-icon="back" aria-label="返回"></a>
    <div class="title">零食大逃亡</div>
    <button class="icon-btn" id="pauseBtn" data-icon="pause" aria-label="暂停"></button>
  </div>

  <div class="card status-card">
    <span>SCORE <b id="score">0</b></span>
    <span>倒计时 <b class="rednum" id="time">30秒</b></span>
  </div>

  <div class="canvas-wrap" id="wrap">
    <canvas id="gameCanvas"></canvas>
  </div>
  <p class="hint">↔ 左右滑动移动篮子 · 臭袜子扣分！</p>

  <div class="overlay" id="overlay">
    <h2 id="ovTitle">准备好接零食了吗？</h2>
    <p id="ovText">左右滑动移动篮子，接住鱼干 +10、饼干 +15、肉肉 +20；接到臭袜子 -30！</p>
    <button class="btn red" id="ovBtn">开始接零食</button>
  </div>
</div>

<script src="js/momo-icons.js"></script>
<script src="js/momo.js"></script>
<script>
(() => {
  const wrap = document.getElementById("wrap");
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovBtn = document.getElementById("ovBtn");

  let W, H;
  function fit() { W = canvas.width = wrap.clientWidth; H = canvas.height = wrap.clientHeight; }
  fit();
  window.addEventListener("resize", fit);

  const VAL = { fish: 10, cookie: 15, meat: 20, sock: -30 };
  let imgs = {}, petCanvas = null;
  let items = [], floaters = [];
  let score = 0, t = 30, spawn = 0, basketX = 0;
  let running = false, paused = false, ended = false, last = 0, flash = 0;

  const showOv = (title, text, label, cb) => {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = label;
    ovBtn.onclick = cb;
    overlay.classList.remove("hidden");
  };

  Promise.all([
    ...["fish", "cookie", "meat", "sock"].map((n) => new Promise((res) => {
      const im = momoIconImage(n, 64);
      if (im.complete && im.naturalWidth) res([n, im]);
      else im.onload = () => res([n, im]);
    })),
    momoLoadCut("assets/momo-cat-mischief.png").then((c) => ["pet", c]),
  ]).then((pairs) => {
    pairs.forEach(([n, im]) => { imgs[n] = im; });
    petCanvas = imgs.pet;
    basketX = W / 2;
    requestAnimationFrame(loop);
  });

  function spawnItem() {
    const r = Math.random();
    const type = r < 0.3 ? "fish" : r < 0.55 ? "cookie" : r < 0.85 ? "meat" : "sock";
    items.push({
      type,
      x: 26 + Math.random() * (W - 52),
      y: -30,
      v: 120 + Math.random() * 120 + (30 - t) * 3,
    });
  }

  function update(dt) {
    spawn += dt;
    if (spawn > 0.55) { spawnItem(); spawn = 0; }
    flash = Math.max(0, flash - dt);
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.v * dt;
      if (it.y > H - 84 && it.y < H - 40 && Math.abs(it.x - basketX) < 50) {
        score = Math.max(0, score + VAL[it.type]);
        scoreEl.textContent = score;
        floaters.push({ x: it.x, y: H - 90, text: (VAL[it.type] > 0 ? "+" : "") + VAL[it.type], bad: VAL[it.type] < 0, age: 0 });
        if (VAL[it.type] < 0) { flash = 0.3; momoVibe(60); } else momoVibe(15);
        items.splice(i, 1);
        continue;
      }
      if (it.y > H + 30) items.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      floaters[i].age += dt;
      if (floaters[i].age > 0.8) floaters.splice(i, 1);
    }
    t -= dt;
    if (t <= 0) {
      t = 0;
      ended = true;
      running = false;
      timeEl.textContent = "0秒";
      const best = momoStats.report(score);
      if (score >= 250) momoStats.addTitle("接食神爪");
      showOv("时间到！", `接住零食得分 ${score}，历史最高 ${best}。臭袜子就别接了。`, "再接一次", () => location.reload());
    } else {
      timeEl.textContent = Math.ceil(t) + "秒";
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#FFF8ED";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#F4E3C8";
    ctx.fillRect(0, H - 46, W, 46);
    ctx.strokeStyle = "#252525";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H - 46); ctx.lineTo(W, H - 46); ctx.stroke();
    for (const it of items) {
      if (imgs[it.type]) ctx.drawImage(imgs[it.type], it.x - 20, it.y - 20, 40, 40);
    }
    if (petCanvas) ctx.drawImage(petCanvas, basketX - 56, H - 168, 112, 112);
    ctx.lineWidth = 3;
    ctx.fillStyle = "#FFE66D";
    ctx.beginPath();
    ctx.moveTo(basketX - 46, H - 64);
    ctx.lineTo(basketX + 46, H - 64);
    ctx.lineTo(basketX + 36, H - 26);
    ctx.lineTo(basketX - 36, H - 26);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(basketX - 46, H - 56); ctx.lineTo(basketX + 46, H - 56); ctx.stroke();
    ctx.font = "900 16px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    for (const f of floaters) {
      ctx.fillStyle = f.bad ? "#FF5B48" : "#252525";
      ctx.globalAlpha = Math.max(0, 1 - f.age / 0.8);
      ctx.fillText(f.text + (f.bad ? " 臭！" : ""), f.x, f.y - f.age * 40);
      ctx.globalAlpha = 1;
    }
    if (flash > 0) {
      ctx.fillStyle = "#FF5B4830";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(ts) {
    requestAnimationFrame(loop);
    if (!running || paused || ended) { last = ts; draw(); return; }
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    update(dt);
    draw();
  }

  let dragging = false;
  const setX = (e) => {
    const rect = canvas.getBoundingClientRect();
    basketX = Math.max(50, Math.min(W - 50, (e.clientX - rect.left) * (W / rect.width)));
  };
  canvas.addEventListener("pointerdown", (e) => { dragging = true; setX(e); });
  canvas.addEventListener("pointermove", (e) => { if (dragging) setX(e); });
  canvas.addEventListener("pointerup", () => { dragging = false; });
  canvas.addEventListener("pointercancel", () => { dragging = false; });

  document.getElementById("pauseBtn").addEventListener("click", () => {
    if (!running || paused || ended) return;
    paused = true;
    showOv("暂停中", "零食也在天上暂停了。", "继续", () => { paused = false; overlay.classList.add("hidden"); });
  });

  showOv("准备好接零食了吗？", "左右滑动移动篮子，接住鱼干 +10、饼干 +15、肉肉 +20；接到臭袜子 -30！", "开始接零食", () => { running = true; overlay.classList.add("hidden"); });
})();
</script>
</body>
</html>
