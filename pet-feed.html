<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>猫猫喂食屋</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 16px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top { height: 20px; background: var(--white); border-radius: 0 0 50% 50% / 0 0 100% 100%; margin: 0 -10px; }
  .feed-area {
    margin: 0 12px; background: var(--pink-card); border-radius: 20px;
    padding: 12px; position: relative; overflow: hidden; border: 2px solid var(--pink-border);
  }
  .feed-cat-wrap { position: relative; text-align: center; margin-bottom: 12px; }
  .feed-cat-frame {
    width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden;
    border: 4px solid var(--white); box-shadow: 0 4px 16px #e8899a20;
  }
  .feed-cat-frame img { width: 100%; height: 100%; object-fit: cover; }
  .feed-speech {
    position: absolute; right: -4px; top: 16px;
    background: var(--white); padding: 10px 14px; border-radius: 16px;
    font-size: 14px; font-weight: 800; box-shadow: 0 2px 10px #00000010;
    line-height: 1.5; z-index: 2;
  }
  .feed-speech::after {
    content: ""; position: absolute; left: -8px; top: 18px;
    border: 8px solid transparent; border-right-color: var(--white);
  }
  .feed-fish-deco { position: absolute; left: 12px; top: 10px; font-size: 28px; z-index: 2; }
  .food-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .food-btn {
    background: var(--white); border: 2px solid var(--pink-border);
    border-radius: 16px; padding: 12px 6px; text-align: center;
    transition: transform 0.1s, border-color 0.15s;
  }
  .food-btn:active { transform: scale(0.93); }
  .food-btn.selected { border-color: var(--pink-accent); background: var(--pink-light); }
  .food-btn .food-icon { width: 40px; height: 40px; object-fit: contain; margin: 0 auto 6px; display: block; }
  .food-btn .food-emoji { font-size: 34px; display: block; margin-bottom: 4px; }
  .food-btn .food-name { font-size: 12px; font-weight: 800; color: var(--ink); }
  .feed-reaction { text-align: center; font-size: 13px; color: var(--pink-dark); font-weight: 700; margin-top: 10px; min-height: 20px; }
  @keyframes decoFloat { 0%,100%{transform:translateY(0);opacity:0.5;} 50%{transform:translateY(-8px);opacity:0.8;} }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="pet-topbar">
    <a class="pet-back" href="pet.html">←</a>
    <div class="pet-title">猫猫喂食屋</div>
    <div class="pet-score">🐟 <span id="loveCount">8</span></div>
  </div>
  <div class="feed-area">
    <img src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:24px;position:absolute;top:8px;left:12px;opacity:0.5;animation:decoFloat 3s ease-in-out infinite;">
    <img src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:20px;position:absolute;top:16px;right:50px;opacity:0.5;animation:decoFloat 3s ease-in-out infinite 0.5s;">
    <span class="feed-fish-deco">🐟</span>
    <div class="feed-cat-wrap">
      <div class="feed-cat-frame">
        <img id="catImg" src="assets/pet-black-cat_1794193784406_68681628.png" alt="猫咪">
      </div>
      <div class="feed-speech">好耶♥</div>
    </div>
    <div class="food-grid">
      <button class="food-btn" data-food="fish" data-love="3">
        <img class="food-icon" src="assets/pet-food-fish_1794193845972_3e4b9844.png" alt="">
        <div class="food-name">小鱼</div>
      </button>
      <button class="food-btn" data-food="shrimp" data-love="4">
        <img class="food-icon" src="assets/pet-food-shrimp_1794207186349_ca7c9ee8.png" alt="">
        <div class="food-name">虾虾</div>
      </button>
    </div>
    <div class="feed-reaction" id="reaction"></div>
  </div>
  <div class="game-hint" style="margin:12px 12px 0;">
    <img src="assets/pet-paw-icon_1794193697097_52c6b9ba.png" alt="">
    <span>选择食物喂给我吧~</span>
    <img src="assets/pet-paw-icon_1794193697097_52c6b9ba.png" alt="">
  </div>
</div>
<script src="js/pet-cut.js"></script>
<script>
(() => {
  const loveCount = document.getElementById("loveCount");
  const reaction = document.getElementById("reaction");
  let love = 8;
  const reactions = {
    fish: ["喵~ 小鱼好好吃！😻", "鱼鱼！最爱了！🐟💕", "咕噜咕噜~ 幸福！✨"],
    shrimp: ["虾虾！鲜掉眉毛！🦐😋", "Q弹虾肉！开心到转圈！💕", "喵~ 还要还要！✨"],
  };
  document.querySelectorAll(".food-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const food = btn.dataset.food;
      const pts = +btn.dataset.love;
      love += pts;
      loveCount.textContent = love;
      document.querySelectorAll(".food-btn").forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
      const msgs = reactions[food];
      reaction.textContent = msgs[Math.floor(Math.random() * msgs.length)];
      for (let i = 0; i < pts; i++) {
        setTimeout(() => {
          const h = document.createElement("span");
          h.className = "heart-float";
          h.textContent = "❤️";
          h.style.left = (60 + Math.random() * 140) + "px";
          h.style.top = (40 + Math.random() * 80) + "px";
          h.style.fontSize = (16 + Math.random() * 12) + "px";
          document.querySelector(".feed-area").appendChild(h);
          setTimeout(() => h.remove(), 1000);
        }, i * 100);
      }
    });
  });
})();
</script>
</body>
</html>
