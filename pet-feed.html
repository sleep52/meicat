<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>眉姐姐·节奏投喂</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 18px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top { height: 20px; background: var(--white); border-radius: 0 0 50% 50% / 0 0 100% 100%; margin: 0 -10px; }
  .feed-hud { display: flex; justify-content: center; gap: 10px; margin: 12px 12px 6px; }
  .feed-hud .pill {
    background: var(--white); padding: 8px 16px; border-radius: 16px;
    font-size: 15px; font-weight: 800; box-shadow: 0 2px 8px #00000010; display: flex; gap: 6px; align-items: center;
  }
  .combo-pill b { color: #ff6f91; }

  .feed-stage {
    position: relative; margin: 8px 12px; background: var(--pink-card); border-radius: 22px;
    padding: 14px; border: 3px solid var(--pink-border); overflow: hidden; touch-action: manipulation;
  }
  .cat-seat { text-align: center; position: relative; }
  .cat-photo {
    width: 140px; height: 140px; border-radius: 50%; overflow: hidden; border: 6px solid #fff;
    box-shadow: 0 6px 18px #e8899a25; margin: 0 auto; position: relative;
  }
  .cat-photo img { width: 100%; height: 100%; object-fit: cover; }
  .cat-mouth {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 10px; background: #ff7e9c; border-radius: 0 0 18px 18px;
    box-shadow: inset 0 -3px 0 #e0557a; transition: height 0.08s, width 0.08s;
  }
  .cat-mouth.open { height: 26px; width: 40px; background: #d63b63; }
  .cat-mouth.shake { animation: shake 0.3s; }
  @keyframes shake { 0%,100%{transform:translateX(-50%);} 25%{transform:translateX(-58%);} 75%{transform:translateX(-42%);} }

  .beat-track {
    position: relative; height: 90px; margin: 18px 0 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .beat-target {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    border: 3px dashed #ffb0c0; background: #fff0f4; z-index: 1;
  }
  .beat-target::after { content:"张嘴!"; position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:800; color:#ff8fa3; }
  .beat-ring {
    position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; border-radius: 50%;
    border: 4px solid #ff6f91; transform: translate(-50%,-50%) scale(0.4); z-index: 2;
    pointer-events: none;
  }
  .feed-bar { height: 12px; background: #ffe3ea; border-radius: 8px; overflow: hidden; margin: 6px 0 2px; }
  .feed-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#ffd36e,#ff9fb3); transition: width 0.2s; }
  .feed-bar-label { font-size: 11px; color: var(--muted); font-weight: 700; }

  .fly-food { position: absolute; font-size: 30px; z-index: 5; pointer-events: none; transition: left 0.25s ease-in, top 0.25s ease-in; }
  .popup {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%);
    font-size: 26px; font-weight: 900; z-index: 8; pointer-events: none; text-shadow: 0 2px 6px #00000025;
    animation: popUp 0.7s ease-out forwards;
  }
  @keyframes popUp { 0%{opacity:0;transform:translate(-50%,-30%) scale(0.5);} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.15);} 100%{opacity:0;transform:translate(-50%,-90%) scale(1);} }

  .feed-start, .feed-over {
    position: absolute; inset: 0; background: #00000050; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; z-index: 20; gap: 12px; text-align: center; padding: 20px;
  }
  .feed-start.hide, .feed-over.hide { display: none; }
  .big-btn {
    background: linear-gradient(90deg,#ff9fb3,#ff7f9e); color: #fff; font-size: 18px; font-weight: 900;
    padding: 14px 34px; border-radius: 24px; box-shadow: 0 4px 14px #e8899a40;
  }
  .big-btn:active { transform: scale(0.96); }
  .over-title { font-size: 24px; font-weight: 900; }
  .over-score { font-size: 42px; font-weight: 900; color: #ffd36e; }
  .over-sub { font-size: 14px; opacity: 0.9; }
  .mute-btn {
    position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; z-index: 21;
    background: #ffffffcc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .game-hint { margin: 14px 16px 0; line-height: 1.6; }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="pet-topbar">
    <a class="pet-back" href="pet.html">←</a>
    <div class="pet-title">眉姐姐·节奏投喂</div>
    <div style="width:40px;"></div>
  </div>

  <div class="feed-hud">
    <div class="pill">🍽 得分 <span id="score">0</span></div>
    <div class="pill combo-pill">🔥 连击 x<span id="combo">0</span></div>
    <div class="pill">⏱ <span id="timer">30</span>s</div>
  </div>

  <div class="feed-stage" id="stage">
    <div class="mute-btn" id="mute">🔊</div>
    <div class="cat-seat">
      <div class="cat-photo">
        <img src="assets/meijiejie.jpg" alt="眉姐姐">
        <div class="cat-mouth" id="mouth"></div>
      </div>
    </div>

    <div class="beat-track">
      <div class="beat-target"></div>
      <div class="beat-ring" id="ring"></div>
    </div>

    <div class="feed-bar"><div class="feed-fill" id="feedFill"></div></div>
    <div class="feed-bar-label" id="feedLabel">饱食度 0%</div>

    <div class="feed-start" id="startScreen">
      <div style="font-size:28px;">🎵🐱🍗</div>
      <div style="font-size:17px;font-weight:800;">跟着节奏点屏幕投喂！</div>
      <div style="font-size:13px;opacity:0.9;max-width:240px;">圆圈缩到最小、正好套住「张嘴」时点击 = Perfect！连击越多分越高。</div>
      <button class="big-btn" id="startBtn">开始投喂</button>
    </div>

    <div class="feed-over hide" id="overScreen">
      <div class="over-title">投喂结束！</div>
      <div class="over-score" id="finalScore">0</div>
      <div class="over-sub" id="overSub">最高 0</div>
      <button class="big-btn" id="againBtn">再喂一次</button>
    </div>
  </div>

  <div class="game-hint">
    🎵 在<b>圆圈缩到最小</b>套住「张嘴」的瞬间点屏幕＝Perfect<br>
    🔥 连续命中累积连击倍率，分数翻倍涨！
  </div>
</div>

<script src="js/sfx.js"></script>
<script>
(() => {
  const stage = document.getElementById("stage");
  const ring = document.getElementById("ring");
  const mouth = document.getElementById("mouth");
  const scoreEl = document.getElementById("score");
  const comboEl = document.getElementById("combo");
  const timerEl = document.getElementById("timer");
  const feedFill = document.getElementById("feedFill");
  const feedLabel = document.getElementById("feedLabel");
  const startScreen = document.getElementById("startScreen");
  const overScreen = document.getElementById("overScreen");
  const startBtn = document.getElementById("startBtn");
  const againBtn = document.getElementById("againBtn");
  const finalScore = document.getElementById("finalScore");
  const overSub = document.getElementById("overSub");
  const muteBtn = document.getElementById("mute");

  const beatMs = 680;
  const foods = ["🐟", "🦐", "🍗"];
  let running = false, startT = 0, score = 0, combo = 0, best = +(localStorage.getItem("mj_feed_best") || 0);
  let timeLeft = 30, feed = 0, full = false, rafId = null, timerId = null, foodIdx = 0;

  function showPopup(txt, color) {
    const p = document.createElement("div");
    p.className = "popup"; p.textContent = txt; p.style.color = color || "#fff";
    stage.appendChild(p); setTimeout(() => p.remove(), 700);
  }
  function flyFood() {
    const cat = stage.querySelector(".cat-photo").getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "fly-food";
    f.textContent = foods[foodIdx % foods.length]; foodIdx++;
    const startX = 24, startY = sr.height - 30;
    f.style.left = startX + "px"; f.style.top = startY + "px";
    stage.appendChild(f);
    requestAnimationFrame(() => {
      f.style.left = (cat.left - sr.left + cat.width / 2 - 15) + "px";
      f.style.top = (cat.top - sr.top + cat.height / 2 - 15) + "px";
    });
    setTimeout(() => f.remove(), 300);
  }
  function addFeed(n) {
    feed = Math.min(100, feed + n);
    feedFill.style.width = feed + "%";
    feedLabel.textContent = "饱食度 " + Math.round(feed) + "%";
    if (feed >= 100 && !full) { full = true; feedLabel.textContent = "撑到了…缓缓"; }
    if (feed < 100) full = false;
  }
  function hit(kind) {
    const base = kind === "perfect" ? 100 : 50;
    combo++;
    const mult = 1 + Math.floor((combo - 1) / 3) * 0.5;
    const gained = Math.round(base * mult);
    score += gained;
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    showPopup(kind === "perfect" ? "PERFECT! +" + gained : "GOOD +" + gained, kind === "perfect" ? "#ffd36e" : "#9be15d");
    flyFood();
    mouth.classList.add("open");
    setTimeout(() => mouth.classList.remove("open"), 160);
    if (kind === "perfect") SFX.perfect(); else SFX.good();
    addFeed(kind === "perfect" ? 6 : 4);
  }
  function miss() {
    combo = 0; comboEl.textContent = 0;
    SFX.miss();
    mouth.classList.add("shake");
    setTimeout(() => mouth.classList.remove("shake"), 300);
    showPopup("MISS", "#ff6b6b");
  }
  function tap() {
    if (!running) return;
    SFX.resume();
    const now = performance.now();
    const elapsed = now - startT;
    const nearest = Math.round(elapsed / beatMs) * beatMs;
    const off = Math.abs(elapsed - nearest);
    if (off <= 95) hit("perfect");
    else if (off <= 185) hit("good");
    else miss();
  }

  function loop(now) {
    if (!running) return;
    const elapsed = now - startT;
    const phase = (elapsed % beatMs) / beatMs; // 0..1, beat at 0
    const scale = 0.4 + phase * 1.0;
    ring.style.transform = `translate(-50%,-50%) scale(${scale})`;
    ring.style.opacity = phase < 0.5 ? "1" : "0.45";
    const open = phase < 0.16 || phase > 0.86;
    mouth.classList.toggle("open", open && !mouth.classList.contains("shake"));
    rafId = requestAnimationFrame(loop);
  }
  function end() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (timerId) clearInterval(timerId);
    if (score > best) { best = score; localStorage.setItem("mj_feed_best", best); }
    finalScore.textContent = score;
    overSub.textContent = "最高 " + best + " · 连击峰值 " + maxCombo;
    overScreen.classList.remove("hide");
  }
  let maxCombo = 0;
  function start() {
    running = true; startT = performance.now(); score = 0; combo = 0; maxCombo = 0;
    timeLeft = 30; feed = 0; full = false;
    scoreEl.textContent = 0; comboEl.textContent = 0; timerEl.textContent = 30;
    feedFill.style.width = "0%"; feedLabel.textContent = "饱食度 0%";
    startScreen.classList.add("hide"); overScreen.classList.add("hide");
    mouth.classList.remove("open", "shake");
    rafId = requestAnimationFrame(loop);
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--; timerEl.textContent = timeLeft;
      if (combo > maxCombo) maxCombo = combo;
      if (timeLeft <= 0) end();
    }, 1000);
  }

  stage.addEventListener("pointerdown", (e) => {
    if (e.target === muteBtn) return;
    if (running) tap();
  });
  startBtn.addEventListener("click", () => { SFX.resume(); start(); });
  againBtn.addEventListener("click", () => { SFX.resume(); start(); });
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const on = SFX.toggle();
    muteBtn.textContent = on ? "🔊" : "🔇";
  });
})();
</script>
</body>
</html>
