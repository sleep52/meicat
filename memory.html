<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>变装连连看 · 记忆翻牌</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(6px, 1.8vw, 12px);
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
  }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(4, 1fr); max-width: 340px; } }
  .card { aspect-ratio: 1; perspective: 700px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.38s cubic-bezier(.4,1.3,.6,1);
  }
  .card.open .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    overflow: hidden;
  }
  .face.back {
    background:
      repeating-linear-gradient(45deg, #2b2440 0 14px, #241f36 14px 28px);
    border: 2px solid #ffffff20;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(22px, 6vw, 34px);
  }
  .face.front { transform: rotateY(180deg); border: 2px solid var(--accent); }
  .face.front img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.done .face.front { border-color: var(--good); filter: saturate(1.05); }
  .card.done { animation: pop 0.35s ease-out; }
  @keyframes pop { 50% { transform: scale(1.08); } }
  .card.wrong .face.front { border-color: var(--bad); animation: nope 0.3s; }
  @keyframes nope { 25% { transform: translateX(-6px) rotateY(180deg); } 75% { transform: translateX(6px) rotateY(180deg); } }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 合集</a>
    <h1 class="page-title">变装连连看</h1>
    <button class="btn ghost" id="muteBtn">🔊</button>
  </div>

  <div class="hud">
    <span>时间<b id="timeVal">0</b></span>
    <span>步数<b id="moveVal">0</b></span>
    <span class="accent">配对<b id="pairVal">0/10</b></span>
    <span>最少纪录<b id="bestVal">-</b></span>
  </div>

  <div class="stage" style="max-width:540px">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="startOverlay">
      <h2>🧠 变装连连看</h2>
      <p>10 对名场面表情牌扣在桌上。<br>每次翻两张，相同即消除，不同则扣回。<br>用最少的步数集齐全部喵星人。</p>
      <button class="btn" id="startBtn">洗牌开局</button>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <h2>🎉 全部找回！</h2>
      <div class="big-score" id="endMoves">0 步</div>
      <p id="endComment"></p>
      <button class="btn" id="againBtn">再来一局</button>
    </div>
  </div>

<script src="js/audio.js"></script>
<script src="js/memory.js"></script>
</body>
</html>
