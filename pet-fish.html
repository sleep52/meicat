<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>眉姐姐·接鱼挑战</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 16px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top { height: 20px; background: var(--white); border-radius: 0 0 50% 50% / 0 0 100% 100%; margin: 0 -10px; }
  .fish-hud { display: flex; justify-content: center; gap: 10px; margin: 0 12px 10px; }
  .fish-hud-item {
    background: var(--white); padding: 8px 16px; border-radius: 16px;
    font-size: 15px; font-weight: 800; box-shadow: 0 2px 8px #00000010; display: flex; gap: 6px; align-items: center;
  }
  .fish-canvas-wrap {
    margin: 0 12px; height: 420px; border-radius: 20px; overflow: hidden;
    border: 4px solid var(--white); box-shadow: 0 4px 16px #e8899a20; position: relative;
  }
  .fish-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .fish-canvas-wrap.shake { animation: scrShake 0.3s; }
  @keyframes scrShake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-6px,3px);} 40%{transform:translate(6px,-3px);} 60%{transform:translate(-4px,2px);} 80%{transform:translate(4px,-2px);} }
  .combo-pop {
    position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%);
    font-size: 30px; font-weight: 900; z-index: 6; pointer-events: none; color: #ffd36e;
    text-shadow: 0 2px 6px #00000035; animation: popUp 0.7s ease-out forwards;
  }
  @keyframes popUp { 0%{opacity:0;transform:translate(-50%,-30%) scale(0.5);} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.2);} 100%{opacity:0;transform:translate(-50%,-90%) scale(1);} }
  .mute-btn {
    position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; z-index: 7;
    background: #ffffffcc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .fish-over {
    position: absolute; inset: 0; background: #00000060; display: none; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; z-index: 10; gap: 12px; text-align: center;
  }
  .fish-over.show { display: flex; }
  .fish-over .ot { font-size: 26px; font-weight: 900; }
  .fish-over .os { font-size: 40px; font-weight: 900; color: #ffd36e; }
  .fish-over .ob { font-size: 14px; opacity: 0.9; }
  .big-btn {
    background: linear-gradient(90deg,#ff9fb3,#ff7f9e); color: #fff; font-size: 18px; font-weight: 900;
    padding: 14px 34px; border-radius: 24px; box-shadow: 0 4px 14px #e8899a40;
  }
  .big-btn:active { transform: scale(0.96); }
  .game-hint { margin: 14px 16px 0; line-height: 1.6; }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="pet-topbar">
    <a class="pet-back" href="pet.html">←</a>
    <div class="pet-title">眉姐姐·接鱼挑战 🐟</div>
    <div style="width:40px;"></div>
  </div>

  <div class="fish-hud">
    <div class="fish-hud-item">❤️ <span id="lives">3</span></div>
    <div class="fish-hud-item">🐟 <span id="score">0</span></div>
    <div class="fish-hud-item">🏅 Lv.<span id="level">1</span></div>
  </div>

  <div class="fish-canvas-wrap" id="wrap">
    <div class="mute-btn" id="mute">🔊</div>
    <canvas class="fish-canvas" id="gameCanvas"></canvas>
    <div class="fish-over" id="over">
      <div class="ot">游戏结束</div>
      <div class="os" id="finalScore">0</div>
      <div class="ob" id="overSub">最高 0</div>
      <button class="big-btn" id="againBtn">再来一局</button>
    </div>
  </div>

  <div class="game-hint">
    🐟 拖动眉姐姐的碗接住下落的小鱼，<b>连击</b>越高分越多！<br>
    🌟 金鱼 +3 倍分 · 💣 河豚千万别接（会扣命）· 每接 12 条升一级加速！
  </div>
</div>

<script src="js/sfx.js"></script>
<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const levelEl = document.getElementById("level");
  const wrap = document.getElementById("wrap");
  const over = document.getElementById("over");
  const finalScore = document.getElementById("finalScore");
  const overSub = document.getElementById("overSub");
  const againBtn = document.getElementById("againBtn");
  const muteBtn = document.getElementById("mute");

  let W, H;
  function resize() {
    const w = canvas.parentElement;
    W = canvas.width = w.clientWidth;
    H = canvas.height = w.clientHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  let basketX = W / 2, fishes = [], particles = [];
  let score = 0, lives = 3, level = 1, catches = 0, combo = 0, bestCombo = 0;
  let running = false, gameOver = false, spawnTimer = 0, lastTime = 0, best = +(localStorage.getItem("mj_fish_best") || 0);

  const fishEmojis = ["🐟", "🐠", "🐡"];
  function spawnInterval() { return Math.max(0.34, 0.72 - level * 0.05); }

  function spawnFish() {
    const isGold = Math.random() < 0.12;
    const isBomb = !isGold && Math.random() < 0.16;
    fishes.push({
      x: 30 + Math.random() * (W - 60),
      y: -30,
      speed: (1.8 + Math.random() * 1.4 + level * 0.35),
      emoji: isBomb ? "💣" : isGold ? "🌟" : fishEmojis[Math.floor(Math.random() * 2)],
      size: isBomb ? 30 : 24 + Math.random() * 12,
      wobble: Math.random() * Math.PI * 2,
      gold: isGold, bomb: isBomb,
    });
  }

  // 猫 + 碗 抠图
  const catCanvas = document.createElement("canvas"); let catReady = false;
  const catSrc = new Image();
  catSrc.onload = () => {
    const N = catSrc.naturalWidth; catCanvas.width = N; catCanvas.height = N;
    const c = catCanvas.getContext("2d"); c.drawImage(catSrc, 0, 0);
    const img = c.getImageData(0, 0, N, N); const d = img.data; const k = N / 1024;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = (y * N + x) * 4; const blue = d[i + 2] - d[i]; let a = 255;
      if (blue > 25) a = 0; else if (blue > 10) a = Math.round(((25 - blue) / 15) * 255);
      if (y > 650 * k) { const inPaw = (x > 340 * k && x < 480 * k) || (x > 545 * k && x < 690 * k); if (!inPaw || y > 775 * k) a = 0; }
      d[i + 3] = a;
    }
    c.putImageData(img, 0, 0); catReady = true;
  };
  catSrc.src = "assets/pet-fish-fence-cat_1794195506768_c6682585.png";

  const bowlCanvas = document.createElement("canvas"); let bowlReady = false;
  const bowlSrc = new Image();
  bowlSrc.onload = () => {
    const N = bowlSrc.naturalWidth; bowlCanvas.width = N; bowlCanvas.height = N;
    const c = bowlCanvas.getContext("2d"); c.drawImage(bowlSrc, 0, 0);
    const id = c.getImageData(0, 0, N, N); const d = id.data;
    for (let i = 0; i < d.length; i += 4) { const blue = d[i + 2] - d[i]; if (blue > 25) d[i + 3] = 0; else if (blue > 10) d[i + 3] = Math.round(((25 - blue) / 15) * 255); }
    c.putImageData(id, 0, 0); bowlReady = true;
  };
  bowlSrc.src = "assets/pet-fish-bowl_1794207197802_342a23ed.png";

  function bowlSize() { const bw = Math.min(W * 0.3, 110); return { bw, bh: bw * 0.77 }; }
  function catSize() { return Math.min(W * 0.95, 340); }
  function beamY() { return H - 110; }

  function drawFence() {
    const by = beamY(); ctx.fillStyle = "#d9b98c";
    for (let i = 10; i < W; i += 34) ctx.fillRect(i, by + 12, 8, H - by - 12);
    ctx.fillStyle = "#e3c49a"; ctx.fillRect(0, by, W, 12); ctx.fillRect(0, by + 45, W, 8);
  }
  function drawCat() { if (!catReady) return; const S = catSize(); ctx.drawImage(catCanvas, basketX - S / 2, beamY() - (650 / 1024) * S, S, S); }
  function drawBowl() { if (!bowlReady) return; const { bw, bh } = bowlSize(); ctx.drawImage(bowlCanvas, 120, 220, 780, 600, basketX - bw / 2, H - bh - 4, bw, bh); }

  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1, color });
    }
  }
  function comboPop(txt) {
    const p = document.createElement("div"); p.className = "combo-pop"; p.textContent = txt;
    wrap.appendChild(p); setTimeout(() => p.remove(), 700);
  }
  function shake() { wrap.classList.add("shake"); setTimeout(() => wrap.classList.remove("shake"), 300); }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#92cfe8"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff88"; ctx.font = "30px sans-serif";
    ctx.fillText("☁️", 50, 50); ctx.fillText("☁️", W - 80, 80);
    drawFence(); drawCat();
    for (const f of fishes) {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(Math.sin(f.wobble) * 0.2);
      if (f.gold) { ctx.shadowColor = "#ffd36e"; ctx.shadowBlur = 16; }
      ctx.font = f.size + "px sans-serif"; ctx.textAlign = "center"; ctx.fillText(f.emoji, 0, 0); ctx.restore();
    }
    drawBowl();
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function addCombo(n) {
    combo += n; if (combo > bestCombo) bestCombo = combo;
    if (combo > 0 && combo % 5 === 0) comboPop("COMBO x" + combo + "!");
  }

  function update(dt) {
    if (!running) return;
    spawnTimer += dt;
    if (spawnTimer > spawnInterval()) { spawnFish(); spawnTimer = 0; }
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i]; f.y += f.speed; f.wobble += dt * 3; f.x += Math.sin(f.wobble) * 0.5;
      const { bw, bh } = bowlSize();
      if (f.y > H - bh - 24 && f.y < H - 8 && Math.abs(f.x - basketX) < bw / 2 + 6) {
        if (f.bomb) {
          lives--; livesEl.textContent = lives; combo = 0; SFX.bomb(); shake(); burst(f.x, f.y, "#ff6b6b", 14);
          if (lives <= 0) return endGame();
        } else {
          const mult = 1 + Math.floor(combo / 4) * 0.5;
          const base = f.gold ? 30 : 10;
          score += Math.round(base * mult); scoreEl.textContent = score;
          addCombo(1); catches++;
          burst(f.x, f.y, f.gold ? "#ffd36e" : "#7fd0ff", f.gold ? 16 : 10);
          if (f.gold) { SFX.win(); comboPop("金鱼! +" + Math.round(base * mult)); } else SFX.catchFish();
          if (catches % 12 === 0) { level++; levelEl.textContent = level; SFX.levelup(); comboPop("LEVEL UP!"); }
        }
        fishes.splice(i, 1); continue;
      }
      if (f.y > H + 30) {
        if (!f.bomb) { combo = 0; } // 漏接普通鱼断连击
        fishes.splice(i, 1);
      }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt * 1.6;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTime) / 1000); lastTime = ts;
    update(dt); draw(); requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0; lives = 3; level = 1; catches = 0; combo = 0; bestCombo = 0;
    fishes = []; particles = []; running = true; gameOver = false;
    scoreEl.textContent = "0"; livesEl.textContent = "3"; levelEl.textContent = "1";
    basketX = W / 2; over.classList.remove("show");
  }
  function endGame() {
    running = false; gameOver = true;
    if (score > best) { best = score; localStorage.setItem("mj_fish_best", best); }
    finalScore.textContent = score; overSub.textContent = "最高 " + best + " · 最高连击 x" + bestCombo;
    over.classList.add("show");
  }

  let dragging = false;
  function getX(e) { const r = canvas.getBoundingClientRect(); const cx = e.touches ? e.touches[0].clientX : e.clientX; return (cx - r.left) * (W / r.width); }
  canvas.addEventListener("pointerdown", (e) => { SFX.resume(); if (gameOver) { startGame(); return; } dragging = true; basketX = Math.max(40, Math.min(W - 40, getX(e))); });
  canvas.addEventListener("pointermove", (e) => { if (!dragging || !running) return; basketX = Math.max(40, Math.min(W - 40, getX(e))); });
  canvas.addEventListener("pointerup", () => dragging = false);
  canvas.addEventListener("pointercancel", () => dragging = false);

  againBtn.addEventListener("click", () => { SFX.resume(); startGame(); });
  muteBtn.addEventListener("click", (e) => { e.stopPropagation(); const on = SFX.toggle(); muteBtn.textContent = on ? "🔊" : "🔇"; });

  startGame();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
