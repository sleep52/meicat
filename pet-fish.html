<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>摸鱼挑战</title>
<link rel="stylesheet" href="css/pet.css">
</head>
<body>
  <div class="pet-container">
    <div class="pet-topbar">
      <a class="pet-back" href="pet.html">←</a>
      <div class="pet-title">接鱼挑战 <span style="font-size:14px;">🐟</span></div>
      <div style="width:40px;"></div>
    </div>

    <div class="fish-hud">
      <div class="fish-hud-item">得分：<span id="score">0</span></div>
      <div class="fish-hud-item">⏱ <span id="timer">00:30</span></div>
    </div>

    <div class="fish-canvas-wrap">
      <canvas class="fish-canvas" id="gameCanvas"></canvas>
    </div>

    <div class="game-hint">
      <span>🐾</span>
      <span>🎮</span>
      <span>左右滑动，接住小鱼吧！</span>
      <span>🐾</span>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const timerEl = document.getElementById("timer");

  let W, H;
  function resize() {
    const wrap = canvas.parentElement;
    W = canvas.width = wrap.clientWidth;
    H = canvas.height = wrap.clientHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  let basketX = W / 2;
  const basketW = 70, basketH = 40;
  let score = 0, timeLeft = 30, running = false, gameOver = false;
  let fishes = [];
  let spawnTimer = 0;
  let lastTime = 0;
  let timerInterval = null;

  const fishEmojis = ["🐟", "", "🐡", "🦐"];
  const fishColors = ["#ff9f43", "#54a0ff", "#ff6b6b", "#ffa502"];

  function spawnFish() {
    fishes.push({
      x: 30 + Math.random() * (W - 60),
      y: -30,
      speed: 1.5 + Math.random() * 2 + (30 - timeLeft) * 0.05,
      emoji: fishEmojis[Math.floor(Math.random() * fishEmojis.length)],
      size: 24 + Math.random() * 12,
      wobble: Math.random() * Math.PI * 2,
    });
  }

  function drawBasket(x) {
    // Basket body
    ctx.fillStyle = "#d4a574";
    ctx.beginPath();
    ctx.moveTo(x - basketW / 2, H - basketH - 10);
    ctx.lineTo(x - basketW / 2 + 8, H - 10);
    ctx.lineTo(x + basketW / 2 - 8, H - 10);
    ctx.lineTo(x + basketW / 2, H - basketH - 10);
    ctx.closePath();
    ctx.fill();

    // Basket rim
    ctx.fillStyle = "#c4956a";
    ctx.fillRect(x - basketW / 2 - 3, H - basketH - 14, basketW + 6, 8);

    // Basket lines
    ctx.strokeStyle = "#b8855a";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const lx = x - basketW / 2 + 12 + i * 14;
      ctx.beginPath();
      ctx.moveTo(lx, H - basketH - 6);
      ctx.lineTo(lx + 3, H - 14);
      ctx.stroke();
    }

    // Paw print on basket
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🐾", x, H - 22);
  }

  const catImg = new Image();
  catImg.src = "assets/sit_s.jpg";

  function drawCat() {
    const cx = basketX, cy = H - basketH - 70;
    if (catImg.complete) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, 35, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(catImg, cx - 35, cy - 35, 70, 70);
      ctx.restore();
      ctx.strokeStyle = "#ffffff88";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, 35, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.font = "40px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🐱", cx, cy);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#87ceeb");
    sky.addColorStop(0.6, "#b8e4f0");
    sky.addColorStop(1, "#d4f0d4");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Clouds
    ctx.fillStyle = "#ffffff88";
    ctx.font = "30px sans-serif";
    ctx.fillText("☁️", 50, 50);
    ctx.fillText("☁️", W - 80, 80);

    // Stars
    ctx.font = "16px sans-serif";
    ctx.fillText("⭐", 30, 120);
    ctx.fillText("✨", W - 40, 150);

    // Fence
    ctx.fillStyle = "#c4956a";
    for (let i = 0; i < W; i += 40) {
      ctx.fillRect(i, H - 60, 6, 50);
    }
    ctx.fillRect(0, H - 50, W, 6);
    ctx.fillRect(0, H - 30, W, 6);

    // Fishes
    for (const f of fishes) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(Math.sin(f.wobble) * 0.2);
      ctx.font = `${f.size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(f.emoji, 0, 0);
      ctx.restore();
    }

    // Cat + basket
    drawCat();
    drawBasket(basketX);

    // Game over overlay
    if (gameOver) {
      ctx.fillStyle = "#00000066";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("时间到！", W / 2, H / 2 - 30);
      ctx.font = "bold 22px sans-serif";
      ctx.fillStyle = "#ffb830";
      ctx.fillText(`得分：${score}`, W / 2, H / 2 + 10);
      ctx.font = "16px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText("点击重新开始", W / 2, H / 2 + 50);
    }

    if (!running && !gameOver) {
      ctx.fillStyle = "#00000044";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("点击开始", W / 2, H / 2);
      ctx.font = "14px sans-serif";
      ctx.fillText("左右滑动接住小鱼！", W / 2, H / 2 + 30);
    }
  }

  function update(dt) {
    if (!running) return;

    spawnTimer += dt;
    if (spawnTimer > 0.6) {
      spawnFish();
      spawnTimer = 0;
    }

    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      f.y += f.speed;
      f.wobble += dt * 3;
      f.x += Math.sin(f.wobble) * 0.5;

      // Catch check
      if (f.y > H - basketH - 20 && f.y < H - 10 &&
          Math.abs(f.x - basketX) < basketW / 2 + 10) {
        score += 10;
        scoreEl.textContent = score;
        fishes.splice(i, 1);
        continue;
      }

      // Miss
      if (f.y > H + 30) {
        fishes.splice(i, 1);
      }
    }
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0;
    timeLeft = 30;
    fishes = [];
    running = true;
    gameOver = false;
    scoreEl.textContent = "0";
    timerEl.textContent = "00:30";
    basketX = W / 2;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
      const s = String(timeLeft % 60).padStart(2, "0");
      timerEl.textContent = `${m}:${s}`;
      if (timeLeft <= 0) {
        running = false;
        gameOver = true;
        clearInterval(timerInterval);
      }
    }, 1000);
  }

  // Touch/mouse controls
  let dragging = false;
  function getX(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (gameOver || !running) {
      startGame();
      return;
    }
    dragging = true;
    basketX = Math.max(basketW / 2, Math.min(W - basketW / 2, getX(e)));
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging || !running) return;
    basketX = Math.max(basketW / 2, Math.min(W - basketW / 2, getX(e)));
  });
  canvas.addEventListener("pointerup", () => { dragging = false; });
  canvas.addEventListener("pointercancel", () => { dragging = false; });

  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
