<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>摸鱼挑战</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 16px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top { height: 20px; background: var(--white); border-radius: 0 0 50% 50% / 0 0 100% 100%; margin: 0 -10px; }
  .fish-hud { display: flex; justify-content: center; gap: 12px; margin: 0 12px 10px; }
  .fish-hud-item {
    background: var(--white); padding: 8px 18px; border-radius: 16px;
    font-size: 15px; font-weight: 800; box-shadow: 0 2px 8px #00000010;
  }
  .fish-canvas-wrap {
    margin: 0 12px; height: 420px; border-radius: 20px; overflow: hidden;
    border: 4px solid var(--white); box-shadow: 0 4px 16px #e8899a20;
  }
  .fish-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .game-hint { margin: 12px 12px 0; }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="pet-container">
    <div class="pet-topbar">
      <a class="pet-back" href="pet.html">←</a>
      <div class="pet-title">接鱼挑战 <span style="font-size:14px;">🐟</span></div>
      <div style="width:40px;"></div>
    </div>

    <div class="fish-hud">
      <div class="fish-hud-item">得分：<span id="score">0</span></div>
      <div class="fish-hud-item">⏱ <span id="timer">00:30</span></div>
    </div>

    <div class="fish-canvas-wrap">
      <canvas class="fish-canvas" id="gameCanvas"></canvas>
    </div>

    <div class="game-hint">
      <span>🐾</span>
      <span>🎮</span>
      <span>左右滑动，接住小鱼吧！</span>
      <span>🐾</span>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const timerEl = document.getElementById("timer");

  let W, H;
  function resize() {
    const wrap = canvas.parentElement;
    W = canvas.width = wrap.clientWidth;
    H = canvas.height = wrap.clientHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  let basketX = W / 2;
  const basketW = 70;
  let score = 0, timeLeft = 30, running = false, gameOver = false;
  let fishes = [];
  let spawnTimer = 0;
  let lastTime = 0;
  let timerInterval = null;

  const fishEmojis = ["🐟", "🐠", "🐡", "🦐"];
  const fishColors = ["#ff9f43", "#54a0ff", "#ff6b6b", "#ffa502"];

  function spawnFish() {
    fishes.push({
      x: 30 + Math.random() * (W - 60),
      y: -30,
      speed: 1.5 + Math.random() * 2 + (30 - timeLeft) * 0.05,
      emoji: fishEmojis[Math.floor(Math.random() * fishEmojis.length)],
      size: 24 + Math.random() * 12,
      wobble: Math.random() * Math.PI * 2,
    });
  }

  const catImg = new Image();
  catImg.src = "assets/pet-fish-fence-cat_1794195506768_c6682585.png";

  function catSize() { return Math.min(W * 0.6, 230); }
  function railY() { return H + 20 - catSize() * 0.36; }

  function drawFence() {
    const ry = railY();
    ctx.fillStyle = "#d9b98c";
    for (let i = 10; i < W; i += 40) {
      ctx.fillRect(i, ry, 7, H - ry);
    }
    ctx.fillStyle = "#e3c49a";
    ctx.fillRect(0, ry, W, 8);
    ctx.fillRect(0, ry + 26, W, 6);
  }

  function drawCat() {
    if (!catImg.complete) return;
    const size = catSize();
    const x = basketX - size / 2;
    const yTop = H + 20 - size;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, yTop, size, size * 0.78);
    ctx.clip();
    ctx.drawImage(catImg, x, yTop, size, size);
    ctx.restore();
    const fade = ctx.createLinearGradient(0, yTop, 0, yTop + 45);
    fade.addColorStop(0, "#92cfe8");
    fade.addColorStop(1, "#92cfe800");
    ctx.fillStyle = fade;
    ctx.fillRect(x, yTop, size, 45);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Sky
    ctx.fillStyle = "#92cfe8";
    ctx.fillRect(0, 0, W, H);

    // Clouds
    ctx.fillStyle = "#ffffff88";
    ctx.font = "30px sans-serif";
    ctx.fillText("☁️", 50, 50);
    ctx.fillText("☁️", W - 80, 80);

    // Stars
    ctx.font = "16px sans-serif";
    ctx.fillText("⭐", 30, 120);
    ctx.fillText("✨", W - 40, 150);

    // Fence + cat
    drawFence();
    drawCat();

    // Fishes
    for (const f of fishes) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(Math.sin(f.wobble) * 0.2);
      ctx.font = `${f.size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(f.emoji, 0, 0);
      ctx.restore();
    }

    // Game over overlay
    if (gameOver) {
      ctx.fillStyle = "#00000066";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("时间到！", W / 2, H / 2 - 30);
      ctx.font = "bold 22px sans-serif";
      ctx.fillStyle = "#ffb830";
      ctx.fillText(`得分：${score}`, W / 2, H / 2 + 10);
      ctx.font = "16px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText("点击重新开始", W / 2, H / 2 + 50);
    }

    if (!running && !gameOver) {
      ctx.fillStyle = "#00000044";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("点击开始", W / 2, H / 2);
      ctx.font = "14px sans-serif";
      ctx.fillText("左右滑动接住小鱼！", W / 2, H / 2 + 30);
    }
  }

  function update(dt) {
    if (!running) return;

    spawnTimer += dt;
    if (spawnTimer > 0.6) {
      spawnFish();
      spawnTimer = 0;
    }

    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      f.y += f.speed;
      f.wobble += dt * 3;
      f.x += Math.sin(f.wobble) * 0.5;

      // Catch check
      const ry = railY();
      if (f.y > ry - 40 && f.y < ry + 20 &&
          Math.abs(f.x - basketX) < catSize() * 0.35) {
        score += 10;
        scoreEl.textContent = score;
        fishes.splice(i, 1);
        continue;
      }

      // Miss
      if (f.y > H + 30) {
        fishes.splice(i, 1);
      }
    }
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0;
    timeLeft = 30;
    fishes = [];
    running = true;
    gameOver = false;
    scoreEl.textContent = "0";
    timerEl.textContent = "00:30";
    basketX = W / 2;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
      const s = String(timeLeft % 60).padStart(2, "0");
      timerEl.textContent = `${m}:${s}`;
      if (timeLeft <= 0) {
        running = false;
        gameOver = true;
        clearInterval(timerInterval);
      }
    }, 1000);
  }

  // Touch/mouse controls
  let dragging = false;
  function getX(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (gameOver || !running) {
      startGame();
      return;
    }
    dragging = true;
    basketX = Math.max(basketW / 2, Math.min(W - basketW / 2, getX(e)));
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging || !running) return;
    basketX = Math.max(basketW / 2, Math.min(W - basketW / 2, getX(e)));
  });
  canvas.addEventListener("pointerup", () => { dragging = false; });
  canvas.addEventListener("pointercancel", () => { dragging = false; });

  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
