<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>脆薯饼猫大冒险</title>
<link rel="stylesheet" href="css/style.css">
<style>
  canvas {
    display: block;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    border-radius: var(--radius);
    background: #0e1726;
    touch-action: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 合集</a>
    <h1 class="page-title">脆薯饼猫大冒险</h1>
    <button class="btn ghost" id="muteBtn">🔊</button>
  </div>

  <div class="hud">
    <span class="accent">距离<b id="scoreVal">0</b></span>
    <span>纪录<b id="bestVal">0</b></span>
    <span>提示：点击屏幕 / 空格 起飞</span>
  </div>

  <div class="stage" style="max-width:460px">
    <canvas id="game" width="400" height="600"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>🍟 脆薯饼猫大冒险</h2>
      <p>一只被装进脆薯饼袋的猫漂在了海上。<br>点一下跳一格，穿过黄椒和哈密瓜的缝隙，<br>别撞上礁石，也别沉进海里。</p>
      <button class="btn" id="startBtn">出发！</button>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <h2 id="endTitle">翻船了！</h2>
      <div class="big-score" id="endScore">0</div>
      <p id="endComment"></p>
      <button class="btn" id="againBtn">再漂一次</button>
    </div>
  </div>

<script src="js/audio.js"></script>
<script src="js/flappy.js"></script>
</body>
</html>
