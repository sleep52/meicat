<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>摸摸乐</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 16px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top { height: 20px; background: var(--white); border-radius: 0 0 50% 50% / 0 0 100% 100%; margin: 0 -10px; }
  .pet-game-area {
    margin: 0 12px; background: var(--pink-card); border-radius: 20px;
    padding: 12px; position: relative; overflow: hidden; border: 2px solid var(--pink-border);
  }
  .pet-call-text {
    text-align: center; font-size: 17px; font-weight: 800; color: var(--ink);
    margin-bottom: 8px; position: relative;
  }
  .pet-call-text .exclaim { position: absolute; left: 8px; top: -2px; font-size: 20px; color: #ffb830; }
  .pet-cat-frame {
    width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden;
    border: 4px solid var(--white); box-shadow: 0 4px 16px #e8899a20;
    position: relative; cursor: pointer;
  }
  .pet-cat-frame img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.1s; }
  .pet-cat-frame:active img { transform: scale(0.97); }
  .hand-cursor {
    position: absolute; right: 8px; bottom: 40px; width: 56px; height: 56px;
    object-fit: contain; animation: handBounce 1.5s ease-in-out infinite;
    pointer-events: none; z-index: 5;
  }
  @keyframes handBounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }
  .pet-progress {
    height: 10px; background: #ffffff80; border-radius: 5px;
    margin: 10px 12px 0; overflow: hidden; position: relative;
  }
  .pet-progress-fill { height: 100%; background: var(--white); border-radius: 5px; width: 0%; transition: width 0.3s; }
  .pet-progress::before, .pet-progress::after {
    content: ""; position: absolute; top: -4px; width: 18px; height: 18px;
    background: url('assets/pet-paw-deco_1794193917877_4a1496ce.png') center/contain no-repeat;
    opacity: 0.4;
  }
  .pet-progress::before { left: -2px; }
  .pet-progress::after { right: -2px; }
  .deco-float { position: absolute; pointer-events: none; animation: decoFloat 3s ease-in-out infinite; }
  @keyframes decoFloat {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(-8px); opacity: 0.9; }
  }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="pet-topbar">
    <a class="pet-back" href="pet.html">←</a>
    <div class="pet-title">摸摸乐</div>
    <div class="pet-score">❤️ <span id="heartCount">0</span></div>
  </div>
  <div class="pet-game-area" id="gameArea">
    <img class="deco-float" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:28px;top:8px;left:12px;">
    <img class="deco-float" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:22px;top:20px;right:16px;animation-delay:0.5s;">
    <img class="deco-float" src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:20px;top:50px;left:24px;animation-delay:1s;">
    <img class="deco-float" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:24px;bottom:80px;right:12px;animation-delay:1.5s;">
    <img class="deco-float" src="assets/pet-flower-deco_1794193833335_ca791ebb.png" style="width:20px;bottom:50px;left:16px;animation-delay:0.8s;">
    <img class="deco-float" src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:16px;top:35px;right:40px;animation-delay:2s;">
    <div class="pet-call-text"><span class="exclaim">❗</span>快来摸摸我呀~</div>
    <div class="pet-cat-frame" id="catFrame">
      <img id="catImg" src="assets/pet-white-kitten_1794193772792_999ded05.png" alt="猫咪">
      <img class="hand-cursor" src="assets/pet-hand-cursor_1794193759189_8e5f4056.png" alt="">
    </div>
  </div>
  <div class="game-hint" style="margin:12px 12px 0;">
    <img src="assets/pet-paw-icon_1794193697097_52c6b9ba.png" alt="">
    <span>点击猫咪，收集爱心吧！</span>
  </div>
  <div class="pet-progress"><div class="pet-progress-fill" id="progressFill"></div></div>
</div>
<script src="js/pet-cut.js"></script>
<script>
(() => {
  const catImg = document.getElementById("catImg");
  const catFrame = document.getElementById("catFrame");
  const gameArea = document.getElementById("gameArea");
  const heartCount = document.getElementById("heartCount");
  const progressFill = document.getElementById("progressFill");
  let count = 0;
  const cats = [
    "assets/pet-white-kitten_1794193772792_999ded05.png",
    "assets/pet-black-cat_1794193784406_68681628.png",
    "assets/pet-tabby-cat_1794193799191_6e955d81.png",
  ];
  let catIdx = 0;
  catFrame.addEventListener("click", (e) => {
    count++;
    heartCount.textContent = count;
    progressFill.style.width = (count % 10) * 10 + "%";
    const heart = document.createElement("span");
    heart.className = "heart-float";
    heart.textContent = ["❤️", "💗", "💕", "💖", "💘"][Math.floor(Math.random() * 5)];
    const rect = gameArea.getBoundingClientRect();
    heart.style.left = (e.clientX - rect.left - 12) + "px";
    heart.style.top = (e.clientY - rect.top - 12) + "px";
    gameArea.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
    if (count % 10 === 0) {
      catIdx = (catIdx + 1) % cats.length;
      catImg.src = cats[catIdx];
      progressFill.style.width = "0%";
    }
  });
})();
</script>
</body>
</html>
