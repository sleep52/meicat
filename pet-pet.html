<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>眉姐姐·互动屋</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 18px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top { height: 20px; background: var(--white); border-radius: 0 0 50% 50% / 0 0 100% 100%; margin: 0 -10px; }

  /* TOPBAR */
  .pet-topbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; }
  .pet-back { width: 38px; height: 38px; background: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 2px 8px #00000012; }
  .pet-title { flex: 1; text-align: center; font-size: 17px; font-weight: 900; color: var(--ink); }
  .mute-btn {
    width: 38px; height: 38px; background: var(--white); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 2px 8px #00000012; flex: none;
  }

  /* TABS */
  .mode-tabs { display: flex; gap: 8px; margin: 10px 14px 4px; }
  .mode-tab {
    flex: 1; padding: 10px; border-radius: 16px; font-size: 14px; font-weight: 800;
    background: var(--white); color: var(--muted); border: 2px solid transparent;
    box-shadow: 0 2px 8px #e8899a12; transition: .15s;
  }
  .mode-tab.active { color: #ff6f91; border-color: #ffb6c1; background: #fff0f3; }
  .mode-tab:active { transform: scale(.97); }

  /* ===== 撸猫 ===== */
  .purr-wrap { display: flex; align-items: center; gap: 10px; margin: 12px 16px 6px; }
  .purr-label { font-size: 13px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .purr-bar { flex: 1; height: 14px; background: #ffe3ea; border-radius: 10px; overflow: hidden; box-shadow: inset 0 1px 3px #00000010; }
  .purr-fill { height: 100%; width: 0%; border-radius: 10px; background: linear-gradient(90deg,#ffd36e,#ff9fb3,#ff6f91); background-size: 200% 100%; transition: width 0.12s; box-shadow: 0 0 10px #ff6f9160; }
  .purr-pct { font-size: 13px; font-weight: 800; color: #ff6f91; width: 40px; text-align: right; }
  .cat-stage { position: relative; width: 260px; height: 260px; margin: 14px auto 6px; touch-action: none; user-select: none; }
  .cat-photo {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    border: 7px solid var(--white); box-shadow: 0 10px 30px #e8899a35; background: #fff; transition: transform 0.08s;
  }
  .cat-photo img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .cat-photo.breath { animation: breath 3s ease-in-out infinite; }
  @keyframes breath { 0%,100%{transform:scale(1);} 50%{transform:scale(1.025);} }
  .cat-photo.reward { animation: rewardPop 0.9s cubic-bezier(.2,1.4,.4,1); }
  @keyframes rewardPop { 0%{transform:scale(1) rotate(0);} 30%{transform:scale(1.18) rotate(-8deg);} 60%{transform:scale(1.1) rotate(8deg);} 100%{transform:scale(1) rotate(0);} }
  .mood { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 40px; filter: drop-shadow(0 2px 3px #00000030); pointer-events: none; transition: transform 0.15s; }
  .speech { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--white); padding: 7px 14px; border-radius: 14px; font-size: 13px; font-weight: 800; color: var(--ink); box-shadow: 0 3px 10px #00000018; white-space: nowrap; pointer-events: none; }
  .speech::after { content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:7px solid transparent; border-top-color: var(--white); }
  .spot-hint { position: absolute; font-size: 22px; pointer-events: none; opacity: 0; transition: opacity 0.3s; animation: spotPulse 1.4s ease-in-out infinite; }
  @keyframes spotPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.25);} }
  .glow-ring { position: absolute; inset: -6px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 0 #ffd36e00; transition: box-shadow 0.2s; }
  .glow-ring.hot { box-shadow: 0 0 28px 6px #ffd36eaa; }
  .stat-row { display: flex; justify-content: center; gap: 18px; margin: 8px 0 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .stat-row b { color: #ff6f91; font-size: 16px; }
  .pf-heart, .pf-spark { position: absolute; pointer-events: none; font-size: 22px; z-index: 8; animation: pfUp 0.9s ease-out forwards; }
  .pf-spark { font-size: 18px; }
  @keyframes pfUp { 0%{opacity:1; transform: translate(-50%,-50%) scale(0.6);} 100%{opacity:0; transform: translate(-50%,-160%) scale(1.4);} }
  .pf-confetti { position: absolute; top: -24px; font-size: 22px; z-index: 9; animation: pfFall 1.1s ease-in forwards; }
  @keyframes pfFall { 0%{opacity:1; transform: translateY(0) rotate(0);} 100%{opacity:0; transform: translateY(280px) rotate(360deg);} }

  /* ===== 逗猫棒 ===== */
  .tease-hud { display: flex; justify-content: center; gap: 10px; margin: 12px 12px 6px; }
  .tease-hud .pill { background: var(--white); padding: 8px 16px; border-radius: 16px; font-size: 15px; font-weight: 800; box-shadow: 0 2px 8px #00000010; display: flex; gap: 6px; align-items: center; }
  .tease-stage {
    position: relative; margin: 8px 12px; height: 440px; border-radius: 22px; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #fff6e9, #ffe3ec);
    border: 3px solid var(--white); box-shadow: 0 6px 20px #e8899a25; touch-action: none;
  }
  .tease-floor { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(180deg,#ffe9d2,#ffd9b8); }
  .cat-body { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); width: 150px; text-align: center; transition: transform 0.08s linear; will-change: transform; }
  .cat-body img { width: 100%; border-radius: 20px; pointer-events: none; }
  .cat-body .eyes { font-size: 30px; margin-top: -6px; }
  .paw { position: absolute; font-size: 40px; pointer-events: none; z-index: 4; transition: left 0.05s linear, top 0.05s linear; filter: drop-shadow(0 3px 4px #00000025); }
  .toy { position: absolute; font-size: 38px; pointer-events: none; z-index: 6; filter: drop-shadow(0 3px 5px #00000030); transition: transform 0.05s; }
  .toy.tug { transform: scale(1.3) rotate(-12deg); }
  .trail { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ffd36eaa; pointer-events: none; z-index: 5; animation: trailFade 0.5s ease-out forwards; }
  @keyframes trailFade { 0%{opacity:0.8;transform:scale(1);} 100%{opacity:0;transform:scale(0.2);} }
  .popup { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: 30px; font-weight: 900; z-index: 8; pointer-events: none; text-shadow: 0 2px 6px #00000025; animation: popUp 0.7s ease-out forwards; }
  @keyframes popUp { 0%{opacity:0;transform:translate(-50%,-30%) scale(0.5);} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.1);} 100%{opacity:0;transform:translate(-50%,-90%) scale(1);} }
  .tease-start, .tease-over { position: absolute; inset: 0; background: #00000055; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 20; gap: 14px; text-align: center; padding: 20px; }
  .tease-start.hide, .tease-over.hide { display: none; }
  .big-btn { background: linear-gradient(90deg,#ff9fb3,#ff7f9e); color: #fff; font-size: 18px; font-weight: 900; padding: 14px 34px; border-radius: 24px; box-shadow: 0 4px 14px #e8899a40; }
  .big-btn:active { transform: scale(0.96); }
  .over-title { font-size: 26px; font-weight: 900; }
  .over-score { font-size: 40px; font-weight: 900; color: #ffd36e; }
  .over-sub { font-size: 14px; opacity: 0.9; }

  .game-hint { margin: 14px 16px 0; line-height: 1.6; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="pet-topbar">
    <a class="pet-back" href="pet.html">←</a>
    <div class="pet-title">眉姐姐·互动屋</div>
    <div class="mute-btn" id="mute">🔊</div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tabPet">🐾 撸猫</button>
    <button class="mode-tab" id="tabTease">🪶 逗猫棒</button>
  </div>

  <!-- 撸猫 -->
  <div id="petMode">
    <div class="purr-wrap">
      <span class="purr-label">咕噜度</span>
      <div class="purr-bar"><div class="purr-fill" id="purrFill"></div></div>
      <span class="purr-pct" id="purrPct">0%</span>
    </div>
    <div class="cat-stage" id="stage">
      <div class="glow-ring" id="glow"></div>
      <div class="cat-photo breath" id="catPhoto">
        <img src="assets/meijiejie.jpg" alt="眉姐姐">
        <div class="mood" id="mood">😺</div>
        <div class="speech" id="speech">用手指 rua 我呀～</div>
      </div>
      <div class="spot-hint" id="spotHead" style="top:18%;left:50%;transform:translateX(-50%);">💛</div>
      <div class="spot-hint" id="spotChin" style="bottom:20%;left:50%;transform:translateX(-50%);">💛</div>
    </div>
    <div class="stat-row">
      <div>本次撸了 <b id="petCount">0</b> 下</div>
      <div>累计 <b id="total">0</b> 下</div>
    </div>
    <div class="game-hint">
      👆 手指在眉姐姐身上<b>来回滑动</b>抚摸她<br>
      ✨ 找到头顶和脖子下的<b>痒痒肉</b>，咕噜度翻倍还有惊喜！
    </div>
  </div>

  <!-- 逗猫棒 -->
  <div id="teaseMode" hidden>
    <div class="tease-hud">
      <div class="pill">🐾 抓到 <span id="score">0</span></div>
      <div class="pill">⏱ <span id="timer">30</span>s</div>
      <div class="pill">🏆 <span id="best">0</span></div>
    </div>
    <div class="tease-stage" id="teaseStage">
      <div class="tease-floor"></div>
      <div class="cat-body" id="catBody">
        <img src="assets/meijiejie.jpg" alt="眉姐姐">
        <div class="eyes" id="eyes">👀</div>
      </div>
      <div class="paw" id="paw">🐾</div>
      <div class="toy" id="toy">🧶</div>
      <div class="tease-start" id="startScreen">
        <div style="font-size:30px;">🪶🐱</div>
        <div style="font-size:18px;font-weight:800;">用手指拖动逗猫玩具</div>
        <div style="font-size:13px;opacity:0.85;max-width:240px;">眉姐姐会扑过来追！在她抓到玩具的瞬间得分，连续抓到会越来越快～</div>
        <button class="big-btn" id="startBtn">开始逗她</button>
      </div>
      <div class="tease-over hide" id="overScreen">
        <div class="over-title">时间到！</div>
        <div class="over-score" id="finalScore">0</div>
        <div class="over-sub" id="overSub">抓到 0 次</div>
        <button class="big-btn" id="againBtn">再逗一次</button>
      </div>
    </div>
    <div class="game-hint">
      🪶 拖动玩具逗她，让她扑空再扑——<b>抓到的瞬间</b>才算分！<br>
      ⚡ 每抓到一次眉姐姐就会变快，挑战你的手速～
    </div>
  </div>
</div>

<script src="js/sfx.js"></script>
<script>
(() => {
  const muteBtn = document.getElementById("mute");
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const on = SFX.toggle();
    muteBtn.textContent = on ? "🔊" : "🔇";
  });

  // ===== Tabs =====
  const tabPet = document.getElementById("tabPet");
  const tabTease = document.getElementById("tabTease");
  const petMode = document.getElementById("petMode");
  const teaseMode = document.getElementById("teaseMode");
  let teaseInited = false;
  function showMode(which) {
    if (which === "pet") {
      petMode.hidden = false; teaseMode.hidden = true;
      tabPet.classList.add("active"); tabTease.classList.remove("active");
    } else {
      petMode.hidden = true; teaseMode.hidden = false;
      tabTease.classList.add("active"); tabPet.classList.remove("active");
      if (!teaseInited) { setupTease(); teaseInited = true; }
    }
  }
  tabPet.addEventListener("click", () => showMode("pet"));
  tabTease.addEventListener("click", () => showMode("tease"));

  // ===== 撸猫 =====
  (function setupPet() {
    const stage = document.getElementById("stage");
    const catPhoto = document.getElementById("catPhoto");
    const purrFill = document.getElementById("purrFill");
    const purrPct = document.getElementById("purrPct");
    const mood = document.getElementById("mood");
    const speech = document.getElementById("speech");
    const petCountEl = document.getElementById("petCount");
    const totalEl = document.getElementById("total");
    const lvEl = document.getElementById("lv");
    const glow = document.getElementById("glow");
    const spotHead = document.getElementById("spotHead");
    const spotChin = document.getElementById("spotChin");

    let petting = false, lastX = 0, lastY = 0;
    let purr = 0, petCount = 0, acc = 0;
    let total = +(localStorage.getItem("mj_total") || 0);
    let lv = +(localStorage.getItem("mj_lv") || 1);
    let rewarded = false;

    if (lvEl) lvEl.textContent = lv;
    totalEl.textContent = total;

    function center() {
      const r = catPhoto.getBoundingClientRect();
      return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, r: r.width / 2 };
    }
    function inside(x, y) {
      const c = center();
      return Math.hypot(x - c.cx, y - c.cy) <= c.r * 0.98;
    }
    function whichSpot(x, y) {
      const c = center();
      const dx = (x - c.cx) / c.r, dy = (y - c.cy) / c.r;
      if (dy < -0.32 && Math.abs(dx) < 0.45) return "head";
      if (dy > 0.5 && Math.abs(dx) < 0.5) return "chin";
      return null;
    }
    function addPurr(amt) {
      if (rewarded) return;
      purr = Math.min(100, purr + amt);
      purrFill.style.width = purr + "%";
      purrPct.textContent = Math.round(purr) + "%";
      if (purr < 33) { mood.textContent = "😺"; speech.textContent = "用手指 rua 我呀～"; }
      else if (purr < 66) { mood.textContent = "😸"; speech.textContent = "好舒服喵～"; }
      else { mood.textContent = "😻"; speech.textContent = "再 rua 再 rua！"; }
      if (purr >= 100) reward();
    }
    function floatEmoji(x, y, emoji, cls) {
      const el = document.createElement("span");
      el.className = cls || "pf-heart";
      el.textContent = emoji;
      const r = stage.getBoundingClientRect();
      el.style.left = (x - r.left) + "px";
      el.style.top = (y - r.top) + "px";
      stage.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
    function reward() {
      rewarded = true;
      catPhoto.classList.remove("breath"); catPhoto.classList.add("reward");
      SFX.win();
      const emojis = ["🎉", "💖", "⭐", "🐾", "✨", "💕"];
      const r = stage.getBoundingClientRect();
      for (let i = 0; i < 26; i++) {
        const c = document.createElement("span");
        c.className = "pf-confetti";
        c.textContent = emojis[i % emojis.length];
        c.style.left = Math.random() * r.width + "px";
        c.style.animationDelay = Math.random() * 0.3 + "s";
        stage.appendChild(c);
        setTimeout(() => c.remove(), 1500);
      }
      lv++; total++;
      localStorage.setItem("mj_lv", lv);
      localStorage.setItem("mj_total", total);
      if (lvEl) lvEl.textContent = lv; totalEl.textContent = total;
      speech.textContent = "被你 rua 爽啦！升级 Lv." + lv;
      mood.textContent = "😻";
      setTimeout(() => {
        catPhoto.classList.remove("reward"); catPhoto.classList.add("breath");
        purr = 0; purrFill.style.width = "0%"; purrPct.textContent = "0%";
        speech.textContent = "再来一次嘛～";
        rewarded = false;
      }, 1100);
    }
    function handle(x, y) {
      if (!inside(x, y)) { glow.classList.remove("hot"); return; }
      const dx = x - lastX, dy = y - lastY;
      const dist = Math.hypot(dx, dy);
      if (dist < 1.5) return;
      const spot = whichSpot(x, y);
      let amt = dist * 0.10;
      if (spot) {
        amt *= 2;
        glow.classList.add("hot");
        spotHead.style.opacity = spot === "head" ? "1" : "0";
        spotChin.style.opacity = spot === "chin" ? "1" : "0";
        if (Math.random() < 0.25) { floatEmoji(x, y, "✨", "pf-spark"); SFX.meow(); speech.textContent = "呜哇这里好痒～"; }
      } else {
        glow.classList.remove("hot");
        spotHead.style.opacity = "0"; spotChin.style.opacity = "0";
      }
      addPurr(amt);
      petCount++; petCountEl.textContent = petCount;
      acc += dist;
      if (acc > 26) {
        acc = 0;
        floatEmoji(x, y, ["❤️", "💗", "💕", "💖"][Math.floor(Math.random() * 4)]);
        SFX.purr();
      }
      lastX = x; lastY = y;
    }
    stage.addEventListener("pointerdown", (e) => {
      SFX.resume();
      petting = true; lastX = e.clientX; lastY = e.clientY; handle(e.clientX, e.clientY);
    });
    stage.addEventListener("pointermove", (e) => { if (!petting) return; handle(e.clientX, e.clientY); });
    window.addEventListener("pointerup", () => { petting = false; glow.classList.remove("hot"); });
    window.addEventListener("pointercancel", () => { petting = false; glow.classList.remove("hot"); });
  })();

  // ===== 逗猫棒 =====
  function setupTease() {
    const stage = document.getElementById("teaseStage");
    const catBody = document.getElementById("catBody");
    const paw = document.getElementById("paw");
    const toy = document.getElementById("toy");
    const eyes = document.getElementById("eyes");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const bestEl = document.getElementById("best");
    const startScreen = document.getElementById("startScreen");
    const overScreen = document.getElementById("overScreen");
    const startBtn = document.getElementById("startBtn");
    const againBtn = document.getElementById("againBtn");
    const finalScore = document.getElementById("finalScore");
    const overSub = document.getElementById("overSub");

    let best = +(localStorage.getItem("mj_tease_best") || 0);
    bestEl.textContent = best;

    let running = false, score = 0, timeLeft = 30, speed = 2.2, pawPos = { x: 0, y: 0 }, toyPos = { x: 0, y: 0 };
    let rafId = null, timerId = null, lastT = 0;

    function stageRect() { return stage.getBoundingClientRect(); }
    function placeToy(x, y) {
      const r = stageRect();
      toyPos.x = Math.max(30, Math.min(r.width - 30, x));
      toyPos.y = Math.max(30, Math.min(r.height - 30, y));
      toy.style.left = toyPos.x + "px";
      toy.style.top = toyPos.y + "px";
    }
    function randomToy() {
      const r = stageRect();
      placeToy(40 + Math.random() * (r.width - 80), 40 + Math.random() * (r.height - 120));
      toy.textContent = ["🧶", "🪶", "⭐", "🐟", "💛"][Math.floor(Math.random() * 5)];
    }
    function showPopup(txt, color) {
      const p = document.createElement("div");
      p.className = "popup"; p.textContent = txt; p.style.color = color || "#fff";
      stage.appendChild(p); setTimeout(() => p.remove(), 700);
    }
    function trail() {
      const t = document.createElement("div");
      t.className = "trail";
      t.style.left = toyPos.x + "px"; t.style.top = toyPos.y + "px";
      stage.appendChild(t); setTimeout(() => t.remove(), 500);
    }
    function start() {
      running = true; score = 0; timeLeft = 30; speed = 2.2;
      scoreEl.textContent = 0; timerEl.textContent = 30;
      startScreen.classList.add("hide"); overScreen.classList.add("hide");
      const r = stageRect();
      pawPos = { x: r.width / 2, y: r.height - 90 };
      randomToy();
      lastT = performance.now();
      rafId = requestAnimationFrame(loop);
      if (timerId) clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--; timerEl.textContent = timeLeft;
        if (timeLeft <= 0) end();
      }, 1000);
    }
    function end() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      if (timerId) clearInterval(timerId);
      if (score > best) { best = score; localStorage.setItem("mj_tease_best", best); bestEl.textContent = best; }
      finalScore.textContent = score;
      overSub.textContent = "抓到 " + score + " 次 · 最高 " + best;
      overScreen.classList.remove("hide");
    }
    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.04, (now - lastT) / 1000);
      lastT = now;
      const r = stageRect();
      const targetX = toyPos.x;
      const lean = Math.max(-60, Math.min(60, (targetX - r.width / 2) * 0.4));
      catBody.style.transform = `translateX(calc(-50% + ${lean}px))`;
      const dx = toyPos.x - pawPos.x, dy = toyPos.y - pawPos.y;
      const d = Math.hypot(dx, dy);
      const step = speed * dt * 90;
      if (d > 1) {
        pawPos.x += (dx / d) * Math.min(step, d);
        pawPos.y += (dy / d) * Math.min(step, d);
      }
      paw.style.left = pawPos.x + "px";
      paw.style.top = pawPos.y + "px";
      if (d < 34) {
        score++; scoreEl.textContent = score;
        SFX.pounce();
        showPopup("抓到！+" + score, "#ffd36e");
        speed = Math.min(7.5, speed + 0.35);
        randomToy();
      }
      rafId = requestAnimationFrame(loop);
    }
    function moveToy(e) {
      const r = stageRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      placeToy(cx - r.left, cy - r.top);
      toy.classList.add("tug");
      trail();
    }
    stage.addEventListener("pointerdown", (e) => { SFX.resume(); if (running) moveToy(e); });
    stage.addEventListener("pointermove", (e) => { if (running) moveToy(e); });
    stage.addEventListener("pointerup", () => toy.classList.remove("tug"));
    stage.addEventListener("pointercancel", () => toy.classList.remove("tug"));
    startBtn.addEventListener("click", () => { SFX.resume(); start(); });
    againBtn.addEventListener("click", () => { SFX.resume(); start(); });

    // 初始放好位置（此时 teaseMode 已显示，尺寸有效）
    const r0 = stageRect();
    pawPos = { x: r0.width / 2, y: r0.height - 90 };
    paw.style.left = pawPos.x + "px"; paw.style.top = pawPos.y + "px";
    placeToy(r0.width / 2, r0.height / 2);
  }
})();
</script>
</body>
</html>
