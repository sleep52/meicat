<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>摸摸乐</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .pet-game-area {
    background: var(--pink-card);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
    overflow: hidden;
    border: 2px solid var(--pink-border);
  }
  .pet-call-text {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 10px;
    position: relative;
  }
  .pet-call-text::before { content: "✨"; position: absolute; left: 10px; top: -5px; font-size: 16px; }
  .pet-call-text::after { content: "💕"; position: absolute; right: 10px; top: -5px; font-size: 16px; }
  .pet-cat-large {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: var(--radius);
    margin: 0 auto;
    display: block;
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
  }
  .pet-cat-large:active { transform: scale(0.97); }
  .hand-cursor {
    position: absolute;
    right: 10px;
    bottom: 60px;
    width: 60px; height: 60px;
    object-fit: contain;
    animation: handBounce 1.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes handBounce {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }
  .pet-progress {
    height: 8px;
    background: #ffffff60;
    border-radius: 4px;
    margin-top: 10px;
    overflow: hidden;
  }
  .pet-progress-fill {
    height: 100%;
    background: var(--white);
    border-radius: 4px;
    width: 0%;
    transition: width 0.3s;
  }
  .deco-float {
    position: absolute;
    pointer-events: none;
    animation: decoFloat 3s ease-in-out infinite;
  }
  @keyframes decoFloat {
    0%, 100% { transform: translateY(0); opacity: 0.5; }
    50% { transform: translateY(-10px); opacity: 0.8; }
  }
</style>
</head>
<body>
  <div class="pet-container">
    <div class="pet-topbar">
      <a class="pet-back" href="pet.html">←</a>
      <div class="pet-title">摸摸乐</div>
      <div class="pet-score">❤️ <span id="heartCount">0</span></div>
    </div>

    <div class="pet-game-area" id="gameArea">
      <img class="deco-float" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:32px;top:10px;left:15px;">
      <img class="deco-float" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:24px;top:25px;right:20px;animation-delay:0.5s;">
      <img class="deco-float" src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:22px;top:60px;left:30px;animation-delay:1s;">
      <img class="deco-float" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:28px;bottom:100px;right:15px;animation-delay:1.5s;">
      <img class="deco-float" src="assets/pet-flower-deco_1794193833335_ca791ebb.png" style="width:24px;bottom:60px;left:20px;animation-delay:0.8s;">
      <img class="deco-float" src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:18px;top:40px;right:50px;animation-delay:2s;">

      <div class="pet-call-text">快来摸摸我呀~</div>
      <div style="position:relative;">
        <img class="pet-cat-large" id="catImg" src="assets/sleep_s.jpg" alt="猫咪">
        <img class="hand-cursor" src="assets/pet-hand-cursor_1794193759189_8e5f4056.png" alt="">
      </div>
    </div>

    <div class="game-hint">
      <span>🐾</span>
      <span>点击猫咪，收集爱心吧！</span>
    </div>
    <div class="pet-progress">
      <div class="pet-progress-fill" id="progressFill"></div>
    </div>
  </div>

<script>
(() => {
  const catImg = document.getElementById("catImg");
  const gameArea = document.getElementById("gameArea");
  const heartCount = document.getElementById("heartCount");
  const progressFill = document.getElementById("progressFill");
  let count = 0;
  const cats = ["sleep", "flat", "wide", "sit", "bunny", "seal"];
  let catIdx = 0;

  catImg.addEventListener("click", (e) => {
    count++;
    heartCount.textContent = count;
    progressFill.style.width = `${(count % 10) * 10}%`;

    const heart = document.createElement("span");
    heart.className = "heart-float";
    heart.textContent = ["❤️", "💗", "💕", "💖", "💘"][Math.floor(Math.random() * 5)];
    const rect = gameArea.getBoundingClientRect();
    heart.style.left = (e.clientX - rect.left - 12) + "px";
    heart.style.top = (e.clientY - rect.top - 12) + "px";
    gameArea.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);

    if (count % 10 === 0) {
      catIdx = (catIdx + 1) % cats.length;
      catImg.src = `assets/${cats[catIdx]}_s.jpg`;
      progressFill.style.width = "0%";
    }

    catImg.style.transform = "scale(0.95)";
    setTimeout(() => { catImg.style.transform = ""; }, 100);
  });
})();
</script>
</body>
</html>
