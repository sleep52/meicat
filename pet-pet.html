<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe4e9">
<title>猫猫摸摸乐</title>
<link rel="stylesheet" href="css/pet.css">
<style>
  .page-frame {
    background: linear-gradient(180deg, #ffe0e8 0%, #fff0f3 100%);
    border-radius: 24px; margin: 8px; padding: 0 0 16px;
    box-shadow: 0 4px 20px #e8899a20; position: relative; overflow: hidden;
  }
  .cloud-top { height: 20px; background: var(--white); border-radius: 0 0 50% 50% / 0 0 100% 100%; margin: 0 -10px; }
  .pet-game-area {
    margin: 0 12px; background: var(--pink-card); border-radius: 20px;
    padding: 14px; position: relative; overflow: hidden; border: 2px solid var(--pink-border);
    text-align: center;
  }
  .pet-call-text {
    text-align: center; font-size: 17px; font-weight: 800; color: var(--ink);
    margin-bottom: 10px; position: relative;
  }
  .pet-call-text .exclaim { position: absolute; left: 10px; top: -2px; font-size: 20px; color: #ffb830; }
  .pet-cat-frame {
    width: 78%; aspect-ratio: 1; border-radius: 16px; overflow: hidden;
    border: 4px solid var(--white); box-shadow: 0 4px 16px #e8899a20;
    position: relative; margin: 0 auto;
  }
  .pet-cat-frame img { width: 100%; height: 100%; object-fit: cover; }
  .pet-speech {
    position: absolute; right: -6px; top: 8px;
    background: var(--white); padding: 9px 12px; border-radius: 16px;
    font-size: 13px; font-weight: 800; color: var(--ink);
    box-shadow: 0 2px 10px #00000012; line-height: 1.5; z-index: 3;
  }
  .pet-speech::after {
    content: ""; position: absolute; left: -7px; top: 16px;
    border: 7px solid transparent; border-right-color: var(--white);
  }
  .paw-wrap { position: relative; display: flex; justify-content: center; margin: 16px 0 4px; }
  .paw-btn {
    width: 104px; height: 104px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #ffc2d2, #ff7e9c);
    box-shadow: 0 0 0 10px #ffd3de80, 0 0 26px #ff8fa380, 0 8px 22px #ff8fa355;
    display: flex; align-items: center; justify-content: center;
    font-size: 50px; color: #fff; cursor: pointer; position: relative; z-index: 3;
    transition: transform 0.1s;
  }
  .paw-btn:active { transform: scale(0.92); }
  .spark { position: absolute; font-size: 20px; z-index: 2; animation: decoFloat 2.4s ease-in-out infinite; }
  @keyframes decoFloat { 0%,100%{transform:translateY(0);opacity:0.7;} 50%{transform:translateY(-8px);opacity:1;} }
  .deco-float { position: absolute; pointer-events: none; animation: decoFloat 3s ease-in-out infinite; }
  .heart-float {
    position: absolute; font-size: 24px; pointer-events: none;
    animation: heartUp 1s ease-out forwards; z-index: 10;
  }
  @keyframes heartUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
  }
</style>
</head>
<body>
<div class="page-frame">
  <div class="cloud-top"></div>
  <div class="pet-topbar">
    <a class="pet-back" href="pet.html">←</a>
    <div class="pet-title">猫猫摸摸乐</div>
    <div class="pet-score">❤️ <span id="heartCount">12</span></div>
  </div>
  <div class="pet-game-area">
    <img class="deco-float" src="assets/pet-heart-deco_1794193821067_ac04d555.png" style="width:28px;top:8px;left:12px;">
    <img class="deco-float" src="assets/pet-star-deco_1794193906929_f5d7b26a.png" style="width:20px;top:30px;right:16px;animation-delay:0.5s;">
    <img class="deco-float" src="assets/pet-flower-deco_1794193833335_ca791ebb.png" style="width:20px;bottom:60px;left:16px;animation-delay:0.8s;">
    <div class="pet-call-text"><span class="exclaim">❗</span>再摸一嘴~♥</div>
    <div class="pet-cat-frame">
      <img id="catImg" src="assets/pet-white-kitten_1794193772792_999ded05.png" alt="猫咪">
      <div class="pet-speech">再摸一嘴~♥</div>
    </div>
    <div class="paw-wrap">
      <span class="spark" style="left:6px;top:-4px;">⭐</span>
      <span class="spark" style="right:2px;top:6px;animation-delay:0.6s;">✨</span>
      <span class="spark" style="left:18px;bottom:-6px;animation-delay:1.1s;">💗</span>
      <span class="spark" style="right:18px;bottom:0;animation-delay:0.3s;">⭐</span>
      <div class="paw-btn" id="pawBtn">🐾</div>
    </div>
  </div>
  <div class="game-hint" style="margin:12px 12px 0;">
    <span>☁️</span><span>快来摸摸我吧！</span><span>☁️</span>
  </div>
</div>
<script src="js/pet-cut.js"></script>
<script>
(() => {
  const pawBtn = document.getElementById("pawBtn");
  const heartCount = document.getElementById("heartCount");
  const area = document.querySelector(".pet-game-area");
  let count = 12;
  pawBtn.addEventListener("click", (e) => {
    count++;
    heartCount.textContent = count;
    const rect = area.getBoundingClientRect();
    const heart = document.createElement("span");
    heart.className = "heart-float";
    heart.textContent = ["❤️","💗","💕","💖"][Math.floor(Math.random()*4)];
    heart.style.left = (e.clientX - rect.left - 12) + "px";
    heart.style.top = (e.clientY - rect.top - 12) + "px";
    area.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  });
})();
</script>
</body>
</html>
