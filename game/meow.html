<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<title>猫语翻译机</title>
<link rel="stylesheet" href="../css/app.css?v=100">
<script src="../js/icons.js?v=100" defer></script>
<script src="../js/core.js?v=100" defer></script>
<script src="../js/cat.js?v=100" defer></script>
<script src="../js/wardrobe.js?v=100" defer></script>
<script src="../js/game.js?v=100" defer></script>
<script src="../js/games.js?v=100" defer></script>
<script src="../js/content.js?v=100" defer></script>
<script src="../js/g/meow.js?v=100" defer></script>
</head>
<body data-page="games" data-back="games.html" data-back-text="游戏大厅" data-tabbar="off">
<div class="app notab">
  <div class="sect"><h2>猫语翻译机</h2><span class="mut small">最高 <i id="mBest">0</i> 分</span></div>
  <p class="mut small" id="mHow"></p>

  <div class="slots" id="mTabs">
    <button class="slot on" data-t="say">人话 → 喵语</button>
    <button class="slot" data-t="quiz">喵语 → 猜心思</button>
  </div>

  <section class="gwrap" id="tabSay">
    <div class="card">
      <canvas class="mcat" id="mCat"></canvas>
    </div>
    <div class="card">
      <p class="mut small">你说的人话</p>
      <textarea id="mText" rows="2" maxlength="48" placeholder="比如：现在就要吃罐头"></textarea>
      <div class="row2">
        <button class="btn gold" id="mGo">翻译</button>
        <button class="btn line" id="mPlay">叫给她听</button>
      </div>
    </div>
    <div class="card">
      <p class="mut small">本喵的答复</p>
      <p class="big" id="mOut">——</p>
      <p class="mut small" id="mPy"></p>
      <p class="small" id="mSay"></p>
      <div class="row2">
        <button class="btn line small" id="mCopy">复制喵语</button>
        <button class="btn line small" id="mPost">导出海报 PNG</button>
      </div>
    </div>
    <div>
      <div class="sect"><h2>试这些</h2></div>
      <div class="chips" id="exRows">
        <button class="chip" type="button">我现在就要吃罐头</button>
        <button class="chip" type="button">陪我玩球</button>
        <button class="chip" type="button">开门</button>
        <button class="chip" type="button">我要去上班了</button>
        <button class="chip" type="button">真喜欢你</button>
        <button class="chip" type="button">该洗澡了</button>
        <button class="chip" type="button">凌晨三点精神很好</button>
        <button class="chip" type="button">几点回家</button>
        <button class="chip" type="button">今天降温了记得加衣服</button>
      </div>
    </div>
    <p class="mut small">译法是确定性映射：这句话的哈希决定每个音节的声调，所以同一条永远翻成同一串，能复现、能对比。发声是真的（WebAudio 按声调滑音、按位置偏左右声道），但「猫是不是这个意思」没有依据——这是玩梗，不是猫科学。</p>
  </section>

  <section class="gwrap hide" id="tabQuiz">
    <div class="card">
      <p class="mut small" id="qMeta">第 1 / 6 题</p>
      <div id="qBox"></div>
    </div>
    <p class="mut small">这六句是本站写好的固定译法，猜不出可以先点「听她说」听声调。答完一轮才记最高分。</p>
  </section>
</div>
</body>
</html>
