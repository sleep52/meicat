<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>合成大猫</title>
<link rel="stylesheet" href="css/style.css">
<style>
  canvas {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    border-radius: var(--radius);
    background: #0e1726;
    touch-action: none;
    cursor: pointer;
  }
  .next-box {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin: 6px 0 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .next-box img {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: #00000040;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 合集</a>
    <h1 class="page-title">合成大猫</h1>
    <button class="btn ghost" id="muteBtn">🔊</button>
  </div>

  <div class="hud">
    <span class="accent">得分<b id="scoreVal">0</b></span>
    <span>纪录<b id="bestVal">0</b></span>
  </div>
  <div class="next-box">
    下一只 <img id="nextImg" alt="next">
  </div>

  <div class="stage" style="max-width:420px">
    <canvas id="game" width="400" height="600"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>🐱 合成大猫</h2>
      <p>点击屏幕投放小猫，两只相同等级碰到一起会合成下一级。<br>
         从被窝猫一路合成到绿光猫，堆到红线就 Game Over。</p>
      <button class="btn" id="startBtn">开始合成</button>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <h2 id="endTitle">堆满了！</h2>
      <div class="big-score" id="endScore">0</div>
      <p id="endComment"></p>
      <button class="btn" id="againBtn">再来一局</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/merge.js"></script>
</body>
</html>
