<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12101a">
<title>合成大猫</title>
<link rel="stylesheet" href="css/style.css">
<style>
  canvas {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    border-radius: var(--radius);
    background: #0e1726;
    touch-action: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← 合集</a>
    <h1 class="page-title">合成大猫</h1>
    <button class="btn ghost" id="muteBtn">🔊</button>
  </div>

  <div class="hud">
    <span class="accent">得分<b id="scoreVal">0</b></span>
    <span>纪录<b id="bestVal">0</b></span>
  </div>

  <div class="stage" style="max-width:420px">
    <canvas id="game" width="420" height="720"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>🐱 合成大猫</h2>
      <p>按住屏幕左右拖动瞄准，松手投放小猫。<br>
         两只相同等级碰到一起会合成下一级，虚线指示落点。<br>
         从被窝猫一路合成到红唇猫，堆到红线就 Game Over。</p>
      <button class="btn" id="startBtn">开始合成</button>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <h2 id="endTitle">堆满了！</h2>
      <div class="big-score" id="endScore">0</div>
      <p id="endComment"></p>
      <button class="btn" id="againBtn">再来一局</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/merge.js"></script>
</body>
</html>
